<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOK Slot Machine - Taille stable</title>
  <style>
    :root {
      --tok-orange: #ff5a00;
      --tok-orange-2: #ff8a00;
      --tok-dark: #0b0b0d;
      --tok-black: #15110f;
      --tok-white: #fff8ee;
      --tok-cream: #ffe7c2;
      --tok-red: #e93512;
      --slot-width: min(900px, 100%);
      --side-paytable-width: clamp(330px, 25vw, 468px);
      --reel-size: clamp(96px, 17vw, 174px);
      --symbol-gap: 16px;
      --reel-visible-height: calc(var(--reel-size) * 1.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--tok-white);
      background:
        radial-gradient(circle at 50% 2%, rgba(255, 120, 0, .42), transparent 34%),
        radial-gradient(circle at 15% 18%, rgba(255, 90, 0, .28), transparent 26%),
        radial-gradient(circle at 83% 24%, rgba(255, 211, 120, .16), transparent 30%),
        linear-gradient(145deg, #040404 0%, #14100d 48%, #050505 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .024) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
    }

    .stage {
      width: min(1880px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(10px, 2.2vw, 34px) clamp(10px, 1.6vw, 28px) 42px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .slot-wrap {
      position: relative;
      width: min(1840px, 98vw);
      min-height: calc(100vh - clamp(20px, 4.4vw, 68px) - 42px);
      display: grid;
      grid-template-columns: clamp(150px, 15vw, 280px) minmax(620px, var(--slot-width)) clamp(58px, 6vw, 96px) var(--side-paytable-width);
      gap: clamp(8px, 1.25vw, 22px);
      align-items: center;
      justify-content: center;
    }

    .tok-chef {
      position: relative;
      z-index: 4;
      grid-column: 1;
      align-self: center;
      justify-self: end;
      width: clamp(150px, 15vw, 276px);
      margin: 0;
      filter: drop-shadow(0 24px 28px rgba(0, 0, 0, .56));
      transform: rotate(-3deg);
      pointer-events: none;
      user-select: none;
      animation: none !important;
      transition: none !important;
    }

    .slot-machine {
      position: relative;
      z-index: 3;
      grid-column: 2;
      align-self: center;
      isolation: isolate;
      border-radius: 44px;
      padding: clamp(18px, 3vw, 34px);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .24), transparent 10%, transparent 78%, rgba(0, 0, 0, .42)),
        radial-gradient(circle at 30% 10%, rgba(255, 242, 212, .32), transparent 28%),
        linear-gradient(145deg, #ff7600 0%, #ff4e00 45%, #ba2507 100%);
      border: 5px solid #2b1308;
      contain: layout paint;
      box-shadow:
        0 34px 70px rgba(0, 0, 0, .56),
        inset 0 3px 1px rgba(255, 255, 255, .55),
        inset 0 -16px 30px rgba(79, 13, 0, .48);
    }

    .slot-machine::before,
    .slot-machine::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 34px;
      pointer-events: none;
    }

    .slot-machine::before {
      border: 3px solid rgba(255, 255, 255, .72);
      box-shadow: inset 0 0 0 4px rgba(15, 10, 7, .44);
    }

    .slot-machine::after {
      z-index: -1;
      inset: -16px -14px -20px;
      border-radius: 52px;
      background: linear-gradient(180deg, rgba(255, 128, 0, .4), rgba(0, 0, 0, .52));
      opacity: .76;
    }

    .top-panel {
      display: grid;
      grid-template-columns: minmax(160px, 280px) 1fr;
      align-items: center;
      gap: clamp(14px, 2vw, 26px);
      margin-bottom: clamp(16px, 2.4vw, 28px);
      position: relative;
      z-index: 2;
    }

    .brand-card {
      height: clamp(104px, 7.2vw, 116px);
      min-height: 0;
      display: grid;
      place-items: center;
      border-radius: 26px;
      padding: 14px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(255, 224, 190, .96)),
        #fff;
      border: 4px solid #1d100b;
      box-shadow:
        inset 0 3px 8px rgba(255, 255, 255, .7),
        inset 0 -8px 16px rgba(255, 98, 0, .16),
        0 12px 0 rgba(76, 20, 0, .58),
        0 18px 24px rgba(0, 0, 0, .35);
    }

    .brand-card img {
      max-width: 100%;
      max-height: 88px;
      object-fit: contain;
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .28));
    }

    .screen {
      height: clamp(104px, 7.2vw, 116px);
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-radius: 28px;
      padding: 14px clamp(16px, 2.4vw, 26px);
      background:
        radial-gradient(circle at 30% 8%, rgba(255, 120, 0, .28), transparent 28%),
        linear-gradient(180deg, #1b1715, #070707);
      border: 4px solid #ffb36d;
      box-shadow:
        inset 0 0 0 3px rgba(0, 0, 0, .72),
        inset 0 0 30px rgba(255, 86, 0, .18),
        0 12px 0 rgba(67, 22, 0, .6);
      overflow: hidden;
      position: relative;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 0 15%, rgba(255, 255, 255, .12) 24%, transparent 34% 100%);
      transform: translateX(-110%);
      animation: screen-shine 5.8s infinite;
    }

    .message {
      position: relative;
      z-index: 2;
      margin: 0 0 6px;
      font-size: clamp(24px, 3.55vw, 52px);
      line-height: .92;
      font-weight: 1000;
      letter-spacing: -.06em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-shadow: 0 4px 0 rgba(255, 92, 0, .45), 0 9px 18px rgba(0, 0, 0, .75);
    }

    .sub-message {
      position: relative;
      z-index: 2;
      margin: 0;
      color: #ffd9b0;
      font-size: clamp(11px, 1.15vw, 15px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .reels-window {
      position: relative;
      z-index: 3;
      padding: clamp(18px, 2.8vw, 30px);
      border-radius: 34px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .92), rgba(255, 232, 205, .96)),
        #fff4e5;
      border: 6px solid #1c100b;
      box-shadow:
        inset 0 12px 22px rgba(255, 255, 255, .8),
        inset 0 -16px 22px rgba(255, 117, 0, .16),
        0 18px 0 rgba(94, 25, 1, .62),
        0 28px 42px rgba(0, 0, 0, .45);
      overflow: hidden;
    }

    .reels-window::before,
    .reels-window::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 34%;
      z-index: 8;
      pointer-events: none;
    }

    .reels-window::before {
      top: 0;
      background: linear-gradient(180deg, rgba(255, 244, 229, .98), rgba(255, 244, 229, .36), transparent);
    }

    .reels-window::after {
      bottom: 0;
      background: linear-gradient(0deg, rgba(255, 244, 229, .98), rgba(255, 244, 229, .36), transparent);
    }

    .reels {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(12px, 2.2vw, 22px);
      min-height: var(--reel-visible-height);
    }

    .reel {
      height: var(--reel-visible-height);
      border-radius: 24px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .12), transparent 23% 77%, rgba(0, 0, 0, .14)),
        linear-gradient(180deg, #fffdf8, #ffe3bb);
      border: 4px solid rgba(21, 13, 8, .86);
      box-shadow:
        inset 0 14px 18px rgba(0, 0, 0, .14),
        inset 0 -14px 18px rgba(0, 0, 0, .12),
        0 12px 18px rgba(0, 0, 0, .22);
      position: relative;
    }

    .reel-strip {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .symbol {
      height: var(--reel-visible-height);
      display: grid;
      place-items: center;
      padding: 13px;
      overflow: hidden;
    }

    .symbol-card {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 22px;
      overflow: hidden;
      background:
        radial-gradient(circle at 32% 12%, rgba(255, 255, 255, .96), transparent 36%),
        linear-gradient(145deg, #fff7ec, #ffc170);
      box-shadow:
        inset 0 3px 6px rgba(255, 255, 255, .78),
        inset 0 -6px 14px rgba(255, 88, 0, .18),
        0 7px 12px rgba(0, 0, 0, .18);
      border: 2px solid rgba(43, 18, 5, .2);
    }

    .reel {
      --motion-ghost-opacity-1: 0;
      --motion-ghost-opacity-2: 0;
      --motion-ghost-opacity-3: 0;
      --motion-ghost-shift-1: 0px;
      --motion-ghost-shift-2: 0px;
      --motion-ghost-shift-3: 0px;
      --motion-stretch: 1;
      --motion-glow: 0;
    }

    .reel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: var(--motion-glow);
      background:
        linear-gradient(180deg,
          transparent 0%,
          rgba(255, 255, 255, .18) 16%,
          transparent 29%,
          rgba(255, 122, 0, .13) 52%,
          transparent 71%,
          rgba(255, 255, 255, .14) 86%,
          transparent 100%);
      mix-blend-mode: screen;
      transition: opacity 70ms linear;
    }

    .reel-strip.is-spinning {
      filter: saturate(1.08) contrast(1.02);
    }

    .reel-strip.is-spinning .symbol-card {
      transform: scaleY(var(--motion-stretch));
      transform-origin: center center;
    }

    .symbol {
      --symbol-transform: none;
    }

    .symbol-card {
      position: relative;
    }

    .symbol img {
      max-width: 94%;
      max-height: 92%;
      object-fit: contain;
      filter: drop-shadow(0 7px 7px rgba(0, 0, 0, .32));
      user-select: none;
      pointer-events: none;
      grid-area: 1 / 1;
      transform: var(--symbol-transform);
      transform-origin: center center;
    }

    .symbol-main {
      position: relative;
      z-index: 3;
    }

    .motion-ghost {
      position: relative;
      z-index: 2;
      opacity: 0;
      mix-blend-mode: multiply;
      will-change: transform, opacity;
    }

    .reel-strip.is-spinning .motion-ghost-1 {
      opacity: var(--motion-ghost-opacity-1);
      transform: var(--symbol-transform) translate3d(0, var(--motion-ghost-shift-1), 0) scaleY(1.055);
    }

    .reel-strip.is-spinning .motion-ghost-2 {
      opacity: var(--motion-ghost-opacity-2);
      transform: var(--symbol-transform) translate3d(0, var(--motion-ghost-shift-2), 0) scaleY(1.11);
    }

    .reel-strip.is-spinning .motion-ghost-3 {
      opacity: var(--motion-ghost-opacity-3);
      transform: var(--symbol-transform) translate3d(0, var(--motion-ghost-shift-3), 0) scaleY(1.18);
    }

    .reel-strip:not(.is-spinning) .motion-ghost {
      opacity: 0 !important;
      transform: var(--symbol-transform) translate3d(0, 0, 0) scaleY(1) !important;
    }

    .symbol[data-symbol="logo_suisse"] img {
      max-width: 98%;
      max-height: 96%;
    }

    .symbol[data-symbol="monstre_fourchette"] {
      --symbol-transform: scale(1.24);
    }

    .symbol[data-symbol="monstre_fourchette"] img {
      max-height: 90%;
    }

    .symbol[data-symbol="chef_tok"] {
      --symbol-transform: translateY(0) scale(1.02);
    }

    .symbol[data-symbol="chef_tok"] img {
      max-height: 96%;
    }

    .symbol[data-symbol="livreur"] {
      --symbol-transform: scale(1.06);
    }

    .symbol[data-symbol="livreur"] img {
      max-height: 94%;
    }

    .symbol[data-symbol="logo_tok"] img {
      max-height: 96%;
    }

    .symbol[data-symbol="bulle_miamz"] {
      --symbol-transform: rotate(-3deg) scale(1.02);
    }

    .symbol[data-symbol="bulle_miamz"] img {
      max-width: 99%;
      max-height: 74%;
    }

    .bottom-panel {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: clamp(18px, 2.8vw, 30px);
    }

    .meter {
      min-height: 74px;
      border-radius: 20px;
      padding: 13px 15px;
      background: linear-gradient(180deg, #1b1511, #080808);
      border: 3px solid rgba(255, 197, 135, .72);
      box-shadow: inset 0 0 18px rgba(255, 82, 0, .12), 0 7px 0 rgba(63, 17, 0, .56);
    }

    .meter-label {
      display: block;
      color: #ffc088;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .meter-value {
      display: block;
      margin-top: 3px;
      color: #fff8ee;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -.04em;
      text-shadow: 0 0 16px rgba(255, 84, 0, .5);
    }

    .spin-button {
      min-height: 74px;
      width: 100%;
      border: 0;
      border-radius: 22px;
      padding: 13px 16px 16px;
      cursor: pointer;
      color: var(--tok-dark);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .42), transparent 32%),
        linear-gradient(180deg, #ffdd49, #ff7a00 62%, #d3370a);
      border: 4px solid #271309;
      box-shadow:
        inset 0 4px 0 rgba(255, 255, 255, .58),
        inset 0 -8px 0 rgba(99, 24, 0, .28),
        0 12px 0 #5b1a03,
        0 19px 22px rgba(0, 0, 0, .34);
      font-size: clamp(20px, 3vw, 34px);
      font-weight: 1000;
      letter-spacing: -.04em;
      text-transform: uppercase;
      transform: translateY(0);
      transition: transform .12s ease, box-shadow .12s ease, filter .2s ease;
    }

    .spin-button:hover {
      filter: brightness(1.06) saturate(1.08);
    }

    .spin-button:active,
    .spin-button.is-down {
      transform: translateY(9px);
      box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, .5),
        inset 0 -5px 0 rgba(99, 24, 0, .24),
        0 3px 0 #5b1a03,
        0 10px 16px rgba(0, 0, 0, .28);
    }

    .spin-button:disabled {
      cursor: wait;
      filter: grayscale(.28) brightness(.72);
    }

    .lever {
      position: relative;
      z-index: 2;
      grid-column: 3;
      height: clamp(286px, 44vw, 470px);
      display: grid;
      place-items: center;
      align-self: center;
      margin-bottom: 0;
    }

    .lever-track {
      position: absolute;
      width: clamp(24px, 3vw, 34px);
      height: 76%;
      border-radius: 999px;
      background:
        linear-gradient(90deg, #100c0a, #4a2817 40%, #120d0a),
        #25140d;
      border: 3px solid #080504;
      box-shadow:
        inset 0 0 18px rgba(0, 0, 0, .74),
        0 18px 28px rgba(0, 0, 0, .46);
    }

    .lever-handle {
      position: absolute;
      top: 9%;
      width: clamp(62px, 8vw, 92px);
      height: clamp(62px, 8vw, 92px);
      border-radius: 999px;
      border: 5px solid #1e0d05;
      background:
        radial-gradient(circle at 34% 26%, #fff2d4 0 8%, transparent 17%),
        radial-gradient(circle at 50% 40%, #ffab2e, #ff5a00 55%, #9f1c04 100%);
      box-shadow:
        inset 0 5px 7px rgba(255, 255, 255, .42),
        inset 0 -10px 18px rgba(64, 8, 0, .46),
        0 14px 0 #5b1702,
        0 24px 28px rgba(0, 0, 0, .45);
      cursor: pointer;
      transition: top .48s cubic-bezier(.2, 1.4, .32, 1), transform .18s ease;
    }

    .lever-handle::after {
      content: "SPIN";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #220d03;
      font-size: clamp(12px, 1.7vw, 17px);
      font-weight: 1000;
      letter-spacing: -.04em;
    }

    .lever-handle:hover {
      transform: scale(1.03);
    }

    .lever.is-pulled .lever-handle {
      top: 68%;
    }

    .side-paytable {
      grid-column: 4;
      align-self: center;
      justify-self: start;
      width: var(--side-paytable-width);
      max-height: calc(100vh - 22px);
      position: relative;
      z-index: 5;
      display: grid;
      place-items: center;
      pointer-events: none;
      user-select: none;
    }

    .side-paytable img {
      width: 100%;
      height: auto;
      max-height: calc(100vh - 22px);
      object-fit: contain;
      display: block;
      border-radius: 10px;
      box-shadow:
        0 26px 58px rgba(0, 0, 0, .58),
        0 0 0 1px rgba(255, 110, 0, .18);
    }

    .paytable {
      position: absolute;
      left: clamp(12px, 3vw, 32px);
      right: clamp(12px, 3vw, 32px);
      bottom: -46px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      z-index: 4;
    }

    .paytable span {
      border-radius: 999px;
      padding: 7px 12px;
      color: #fce8ce;
      background: rgba(0, 0, 0, .52);
      border: 1px solid rgba(255, 165, 88, .5);
      box-shadow: 0 8px 18px rgba(0, 0, 0, .24);
      font-size: 12px;
      font-weight: 850;
      backdrop-filter: none;
    }

    .jackpot-flash {
      position: absolute;
      inset: -18px;
      z-index: 0;
      border-radius: 58px;
      background: radial-gradient(circle at center, rgba(255, 224, 97, .55), rgba(255, 85, 0, .24) 34%, transparent 62%);
      opacity: 0;
      pointer-events: none;
      opacity: .86;
    }

    .slot-machine.is-winning .jackpot-flash {
      animation: jackpot 1.05s ease-in-out 2;
    }

    .slot-machine.is-winning .reels-window {
      animation: win-pop .75s ease-in-out 2;
    }

    .coin {
      position: fixed;
      z-index: 20;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle at 30% 25%, #fff4ad 0 9%, #ffd24b 26%, #ff9200 70%, #a83a00 100%);
      border: 2px solid #5d2500;
      box-shadow: 0 8px 18px rgba(0, 0, 0, .34);
      animation: coin-fall var(--fall-duration, 1200ms) cubic-bezier(.1, .68, .22, 1) forwards;
    }

    @keyframes screen-shine {
      0%, 72% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }

    @keyframes jackpot {
      0%, 100% { opacity: 0; transform: scale(.98); }
      35%, 65% { opacity: 1; transform: scale(1.03); }
    }

    @keyframes win-pop {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(1.018); }
    }

    @keyframes coin-fall {
      0% {
        opacity: 0;
        transform: translate3d(0, -10vh, 0) rotate(0deg) scale(.74);
      }
      12% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate3d(var(--coin-drift, 20px), 106vh, 0) rotate(680deg) scale(1.1);
      }
    }



    @media (min-width: 1421px) {
      body {
        overflow: hidden;
      }

      .stage {
        height: 100vh;
        min-height: 100vh;
        padding-top: 0;
        padding-bottom: 0;
        place-items: center;
        overflow: hidden;
      }

      .slot-wrap {
        height: 100vh;
        min-height: 100vh;
        align-items: center;
      }

      .tok-chef,
      .slot-machine,
      .lever,
      .side-paytable {
        align-self: center;
      }

      .tok-chef {
        margin: 0;
      }

      .lever {
        margin-bottom: 0;
      }

      .side-paytable {
        height: 100vh;
        max-height: 100vh;
      }

      .side-paytable img {
        width: 100%;
        height: 100%;
        max-height: 100vh;
        object-fit: contain;
      }
    }

    @media (max-width: 1420px) {
      .slot-wrap {
        width: min(1180px, 98vw);
        min-height: auto;
        grid-template-columns: clamp(132px, 18vw, 240px) minmax(0, var(--slot-width)) clamp(64px, 9vw, 112px);
      }

      .side-paytable {
        grid-column: 1 / -1;
        justify-self: center;
        width: min(468px, 92vw);
        margin-top: 34px;
        max-height: none;
      }

      .side-paytable img {
        max-height: none;
      }
    }

    @media (max-width: 860px) {
      .slot-wrap {
        width: min(620px, 96vw);
        min-height: auto;
        grid-template-columns: 1fr;
        align-items: center;
      }

      .tok-chef {
        grid-column: 1;
        grid-row: 2;
        justify-self: start;
        width: clamp(118px, 32vw, 168px);
        margin: 12px 0 -86px -4px;
        opacity: .96;
        z-index: 5;
      }

      .slot-machine {
        grid-column: 1;
        grid-row: 1;
      }

      .side-paytable {
        grid-column: 1;
        width: min(430px, 94vw);
        margin-top: 24px;
      }

      .lever {
        grid-column: 1;
      }
    }

    @media (max-width: 760px) {
      :root {
        --reel-size: clamp(78px, 23vw, 132px);
      }

      .stage {
        align-items: start;
      }

      .slot-wrap {
        margin-top: 8px;
      }

      .slot-machine {
        border-radius: 32px;
        padding: 18px;
      }

      .slot-machine::before {
        inset: 9px;
        border-radius: 25px;
      }

      .top-panel {
        grid-template-columns: 1fr;
      }

      .brand-card {
        min-height: 88px;
      }

      .brand-card img {
        max-height: 72px;
      }

      .bottom-panel {
        grid-template-columns: 1fr;
      }

      .meter {
        display: flex;
        justify-content: space-between;
        align-items: end;
      }

      .lever {
        position: absolute;
        right: -5px;
        top: 135px;
        height: 220px;
        width: 72px;
        margin: 0;
      }

      .lever-track {
        width: 22px;
      }

      .lever-handle {
        width: 62px;
        height: 62px;
      }

      .tok-chef {
        width: 138px;
      }

      .paytable {
        position: static;
        margin-top: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="stage">
    <section class="slot-wrap" aria-label="Machine à sous TOK">
      <img class="tok-chef" src="assets/chef2.png" alt="Chef TOK" />

      <div class="slot-machine" id="slotMachine">
        <div class="jackpot-flash" aria-hidden="true"></div>

        <header class="top-panel">
          <div class="brand-card">
            <img src="/logotok.png" alt="Logo TOK Miamz" />
          </div>

          <div class="screen" aria-live="polite">
            <p class="message" id="message">Miamz!</p>
            <p class="sub-message" id="subMessage">Mangez mieux, vivez mieux — 1 crédit par spin</p>
          </div>
        </header>

        <section class="reels-window" aria-label="Rouleaux de la slot machine">
          <div class="reels">
            <div class="reel" aria-label="Rouleau 1">
              <div class="reel-strip" id="reel1"></div>
            </div>

            <div class="reel" aria-label="Rouleau 2">
              <div class="reel-strip" id="reel2"></div>
            </div>

            <div class="reel" aria-label="Rouleau 3">
              <div class="reel-strip" id="reel3"></div>
            </div>
          </div>
        </section>

        <footer class="bottom-panel">
          <div class="meter">
            <span class="meter-label">Crédits</span>
            <span class="meter-value" id="credits">15</span>
          </div>

          <button class="spin-button" id="spinButton" type="button">Tok Spin</button>

          <div class="meter">
            <span class="meter-label">Gain</span>
            <span class="meter-value" id="win">0</span>
          </div>
        </footer>

      </div>

      <aside class="lever" id="lever" aria-hidden="true">
        <div class="lever-track"></div>
        <button class="lever-handle" id="leverHandle" type="button" tabindex="-1" aria-label="Activer la machine"></button>
      </aside>

      <aside class="side-paytable" aria-label="Tableau des gains TOK">
        <img src="assets/paytable.png" alt="Tableau des gains TOK" />
      </aside>
    </section>
  </main>

  <script src="slot-machine.js"></script>
</body>
</html>
