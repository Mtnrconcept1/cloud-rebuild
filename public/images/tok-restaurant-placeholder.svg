<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Photo du restaurant à venir</title>
  <desc id="desc">Illustration neutre TOK utilisée tant qu'aucune photo vérifiée du restaurant n'est disponible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.55" stop-color="#fff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="320" cy="172" r="82" fill="#fff" stroke="#fed7aa" stroke-width="5"/>
  <circle cx="320" cy="172" r="54" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
  <path d="M247 90v124M235 90v54c0 13 8 23 18 23s18-10 18-23V90M393 90v124M393 90c25 18 25 57 0 76" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="320" cy="172" r="9" fill="#f97316"/>
  <text x="320" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#21314b">Photo à venir</text>
  <text x="320" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">Une image vérifiée de cet établissement sera ajoutée prochainement.</text>
  <rect x="277" y="350" width="86" height="30" rx="15" fill="url(#accent)"/>
  <text x="320" y="371" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff">TOK</text>
</svg>
