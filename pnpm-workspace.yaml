packages:
  - "."
  - "workers/image-ai-worker"

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - supabase

ignoredBuiltDependencies:
  - "@firebase/util"
  - protobufjs
  - puppeteer

auditConfig:
  ignoreGhsas:
    # TOK is a Vite declarative SPA with no React Router RSC APIs. Remove this
    # exception before enabling RSC or migrating to React Router v8.
    - GHSA-qwww-vcr4-c8h2

overrides:
  protobufjs: 7.6.5
  ws: 8.21.0
  brace-expansion: ">=1.1.16"

allowBuilds:
  "@firebase/util": false
  "@swc/core": true
  esbuild: true
  protobufjs: false
  puppeteer: false
