name: Diagnose onboarding patch shape

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/restaurateur-onboarding-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/restaurateur-onboarding-reliability
          fetch-depth: 1

      - name: Apply staged product patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tmp/restaurateur-onboarding-reliability.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/onboarding.patch"
          git apply --check "$RUNNER_TEMP/onboarding.patch"
          git apply "$RUNNER_TEMP/onboarding.patch"
          python scripts/write-restaurateur-onboarding-migration.py
          git diff -- src/pages/Auth.tsx src/pages/dashboard/DashboardHome.tsx supabase/functions/create-checkout/index.ts src/test/auth-signup-form.test.tsx src/test/restaurant-onboarding-payments.test.ts > "$RUNNER_TEMP/onboarding-product.diff"

      - name: Package patched sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patched"
          cp --parents \
            src/pages/Auth.tsx \
            src/pages/dashboard/DashboardHome.tsx \
            supabase/functions/create-checkout/index.ts \
            src/test/auth-signup-form.test.tsx \
            src/test/restaurant-onboarding-payments.test.ts \
            src/test/restaurateur-onboarding-reliability.test.ts \
            "$RUNNER_TEMP/patched"
          cp "$RUNNER_TEMP/onboarding-product.diff" "$RUNNER_TEMP/patched/"

      - uses: actions/upload-artifact@v4
        with:
          name: patched-onboarding-sources-${{ github.sha }}
          path: ${{ runner.temp }}/patched
          if-no-files-found: error
          retention-days: 1
