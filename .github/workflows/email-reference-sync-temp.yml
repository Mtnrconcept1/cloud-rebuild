name: Temporary TOK email reference refresh
on:
  push:
    branches:
      - feat/tok-email-chef-visual-identity-20261022
    paths:
      - .github/workflows/email-reference-sync-temp.yml
      - supabase/functions/_shared/marketing-email-template.ts
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:application-index
      - name: Commit generated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          if git diff --cached --quiet; then
            echo "References already synchronized"
          else
            git commit -m "docs: sync generated references for TOK email template"
            git push origin HEAD:feat/tok-email-chef-visual-identity-20261022
          fi
