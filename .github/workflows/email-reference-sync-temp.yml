name: Temporary TOK email index finalization
on:
  push:
    branches:
      - feat/tok-email-chef-visual-identity-20261022
    paths:
      - .github/workflows/email-reference-sync-temp.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate canonical index after removing temporary workflow
        run: |
          git rm -- .github/workflows/email-reference-sync-temp.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
      - name: Commit generated files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git commit -m "docs: finalize TOK email reference index"
          git push origin HEAD:feat/tok-email-chef-visual-identity-20261022
