name: Temporary PR 774 application index refresh
on:
  push:
    branches:
      - codex/mobile-sponsored-banner-landscape-20261012
    paths:
      - .github/workflows/pr774-docs-repair.yml

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dedicated PR branch
        uses: actions/checkout@v6
        with:
          ref: codex/mobile-sponsored-banner-landscape-20261012
          fetch-depth: 1
          persist-credentials: true
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate the index and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/pr774-docs-repair.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh application index after mobile banner fix'
          git push origin HEAD:codex/mobile-sponsored-banner-landscape-20261012
      - name: Re-run canonical CI for the updated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref codex/mobile-sponsored-banner-landscape-20261012
