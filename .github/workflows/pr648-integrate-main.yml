name: PR648 Integrate Latest Main

on:
  push:
    branches:
      - codex/fix-commercial-multispace-demo-20260907
    paths:
      - .github/workflows/pr648-integrate-main.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fix-commercial-multispace-demo-20260907
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge latest main and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/pr648-integrate-main.yml
          git add -A
          git commit -m "chore(demo): integrate latest main"
          git push origin HEAD:codex/fix-commercial-multispace-demo-20260907
