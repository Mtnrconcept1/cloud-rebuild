name: Report production workflow run

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    name: Report Deploy Production run ID
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/dispatch-production-baseline-4e55f4'
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Find and report workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: 4e55f436ed66f9aae83d578d6b7b04e6c15c15da
          DISPATCHED_AFTER: 2026-08-01T17:02:00Z
        shell: bash
        run: |
          set -euo pipefail
          payload="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy-production.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"

          run="$(jq -c \
            --arg sha "$EXPECTED_SHA" \
            --arg after "$DISPATCHED_AFTER" \
            '.workflow_runs
              | map(select(.head_sha == $sha and .created_at >= $after))
              | sort_by(.created_at)
              | last // empty' <<<"$payload")"

          if [[ -z "$run" ]]; then
            echo "::error::No dispatched Deploy Production run found."
            exit 1
          fi

          run_id="$(jq -r '.id' <<<"$run")"
          status="$(jq -r '.status' <<<"$run")"
          conclusion="$(jq -r '.conclusion // "pending"' <<<"$run")"
          html_url="$(jq -r '.html_url' <<<"$run")"
          body="Production observer: run_id=${run_id}; status=${status}; conclusion=${conclusion}; url=${html_url}"

          jq -n --arg body "$body" '{body: $body}' > comment.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data @comment.json >/dev/null

          echo "$body"
