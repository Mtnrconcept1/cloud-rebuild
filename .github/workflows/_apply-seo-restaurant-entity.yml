name: Apply restaurant entity SEO patch

on:
  push:
    branches:
      - feat/seo-restaurant-entity-trust
    paths:
      - .github/seo-entity-patch.py
      - .github/workflows/_apply-seo-restaurant-entity.yml

permissions:
  contents: write

concurrency:
  group: apply-seo-restaurant-entity
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder
  SEO_STRICT_DYNAMIC: "0"

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout isolated SEO branch
        uses: actions/checkout@v6
        with:
          ref: feat/seo-restaurant-entity-trust
          fetch-depth: 0

      - name: Verify isolated branch and repository state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          git status --short --branch
          test "$(git branch --show-current)" = "feat/seo-restaurant-entity-trust"
          git merge-base --is-ancestor origin/main HEAD
          test -f AGENTS.md
          sed -n '1,260p' AGENTS.md

          unexpected="$(git diff --name-only origin/main...HEAD | grep -vE '^\.github/(seo-entity-patch\.py|workflows/_apply-seo-restaurant-entity\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected pre-existing changes on isolated branch:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply reviewed SEO patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/seo-entity-patch.py")
          source = path.read_text(encoding="utf-8")
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.DOTALL)"
          if source.count(old) != 1:
              raise SystemExit("Unexpected patch-runner substitution helper")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python3 .github/seo-entity-patch.py
          python3 - <<'PY'
          from pathlib import Path

          docs_path = Path("docs/skills/TOK_SEO_SKILL.md")
          docs_path.write_text(docs_path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")

          test_path = Path("src/test/seo-growth.test.ts")
          source = test_path.read_text(encoding="utf-8")
          old_declaration = '    const restaurantDetail = read("src/pages/RestaurantDetail.tsx");\n    const seo = read("src/hooks/useSeoMeta.ts");'
          new_declaration = '    const restaurantDetail = read("src/pages/RestaurantDetail.tsx");\n    const restaurantEntity = read("src/lib/seo/restaurantEntity.mjs");\n    const seo = read("src/hooks/useSeoMeta.ts");'
          old_assertions = '''    expect(restaurantDetail).toContain("useSeoMeta");
    expect(restaurantDetail).toContain("buildRestaurantDetailJsonLd");
    expect(restaurantDetail).toContain('\"@type\": \"Restaurant\"');
    expect(restaurantDetail).toContain("const restaurantPath = canonicalPath || `/restaurant/${restaurantId}`");
    expect(restaurantDetail).toContain("buildCanonicalUrl(restaurantPath)");'''
          new_assertions = '''    expect(restaurantDetail).toContain("useSeoMeta");
    expect(restaurantDetail).toContain("buildRestaurantSeoModel");
    expect(restaurantDetail).toContain("jsonLd: restaurantSeoModel?.jsonLd || null");
    expect(restaurantDetail).toContain('aria-label="Fil d\\'Ariane"');
    expect(restaurantEntity).toContain("export function buildRestaurantSeoModel");
    expect(restaurantEntity).toContain('\"@type\": \"Restaurant\"');
    expect(restaurantEntity).toContain('\"@type\": \"WebPage\"');
    expect(restaurantEntity).toContain('\"@type\": \"BreadcrumbList\"');'''

          if source.count(old_declaration) != 1:
              raise SystemExit("Unexpected SEO growth test declaration block")
          if source.count(old_assertions) != 1:
              raise SystemExit("Unexpected SEO growth test assertion block")

          source = source.replace(old_declaration, new_declaration, 1)
          source = source.replace(old_assertions, new_assertions, 1)
          test_path.write_text(source, encoding="utf-8")
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Run targeted SEO tests
        run: pnpm exec vitest run src/test/restaurant-entity-seo.test.ts src/test/seo-growth.test.ts src/test/seo-indexation-hardening.test.ts --reporter=verbose

      - name: Run complete test suite
        run: pnpm test

      - name: Lint all sources
        run: pnpm run lint

      - name: Typecheck application
        run: pnpm run typecheck

      - name: Run repository build
        run: pnpm run build

      - name: Run production SEO build
        run: pnpm run build:prod

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/skills/TOK_SEO_SKILL.md \
            scripts/prerender-seo.mjs \
            src/lib/seo/restaurantEntity.mjs \
            src/lib/seo/restaurantEntity.d.mts \
            src/pages/RestaurantDetail.tsx \
            src/test/restaurant-entity-seo.test.ts \
            src/test/seo-growth.test.ts
          git rm .github/seo-entity-patch.py .github/workflows/_apply-seo-restaurant-entity.yml

          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(seo): strengthen restaurant entity pages"
          git push origin HEAD:feat/seo-restaurant-entity-trust
