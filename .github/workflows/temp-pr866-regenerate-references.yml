name: Temporary PR 866 reference synchronization

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/temp-pr866-regenerate-references.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/admin-security-center-guardian-approval-20261015' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the approved PR head, not the target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1

      - name: Prepare pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install generators without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Remove temporary workflow before computing repository digest
        run: git rm .github/workflows/temp-pr866-regenerate-references.yml

      - name: Regenerate canonical maps and application index
        run: |
          pnpm generate:error-code-map
          pnpm docs:application-index
          pnpm docs:application-index:check

      - name: Commit only regenerated files and remove temporary job
        env:
          EXPECTED_BRANCH: codex/admin-security-center-guardian-approval-20261015
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME:-}" = "866/merge" || true
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts supabase/functions/_shared/error-code-map.ts
          git diff --cached --check
          git commit -m "chore(security): regenerate canonical references after final code changes"
          git push origin HEAD:"refs/heads/$EXPECTED_BRANCH"
