name: TOK Edge generated contracts repair (temporary)
on:
  push:
    branches:
      - fix/edge-bundling-jsr-type-imports-20261028
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/edge-bundling-jsr-type-imports-20261028
          fetch-depth: 1
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Refresh error-code map, then canonical application index
        run: |
          set -euo pipefail
          git rm -- .github/workflows/refresh-edge-generated-contracts-once.yml
          pnpm run generate:error-code-map
          pnpm run docs:application-index
          pnpm run docs:application-index:check
          pnpm exec vitest run --mode production src/test/incident-evidence-depth.test.ts src/test/edge-functions-jsr-bundling.test.ts
          git add supabase/functions/_shared/error-code-map.ts docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(edge): regenerate error-code map and application index"
          git push origin HEAD:refs/heads/fix/edge-bundling-jsr-type-imports-20261028
