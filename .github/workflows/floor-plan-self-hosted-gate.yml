name: Floor Plan Self Hosted Gate

on:
  push:
    branches:
      - fix/floor-plan-finalise-flow-20261005

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VITE_SUPABASE_URL: "https://example.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY: "ci-public-placeholder"
  VITE_SUPABASE_ANON_KEY: "ci-public-placeholder"

jobs:
  floor-plan-gate:
    runs-on: [self-hosted, Linux, X64, cloud-rebuild-linux]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Floor-plan regression tests
        run: >-
          pnpm exec vitest run --mode production
          src/test/floor-plan-page-layout.test.ts
          src/test/floor-plan-automatic-placement.test.ts
          src/test/floor-plan-assignment-governance.test.ts
          src/test/service-shared.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Diff check
        run: git diff --check
