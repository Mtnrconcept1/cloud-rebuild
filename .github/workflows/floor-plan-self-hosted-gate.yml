name: Floor Plan Final Gate

on:
  push:
    branches:
      - fix/floor-plan-finalise-flow-20261005

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VITE_SUPABASE_URL: "https://example.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY: "ci-public-placeholder"
  VITE_SUPABASE_ANON_KEY: "ci-public-placeholder"

jobs:
  floor-plan-final-gate:
    runs-on: [self-hosted, Linux, X64, cloud-rebuild-linux]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove temporary gate and refresh application index
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/floor-plan-self-hosted-gate.yml
          pnpm run docs:application-index
          pnpm run docs:application-index:check

      - name: Floor-plan regression tests
        run: >-
          pnpm exec vitest run --mode production
          src/test/floor-plan-page-layout.test.ts
          src/test/floor-plan-automatic-placement.test.ts
          src/test/floor-plan-assignment-governance.test.ts
          src/test/service-shared.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Validate final tracked diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(.github/workflows/floor-plan-self-hosted-gate.yml|docs/architecture/TOK_APPLICATION_REFERENCE.md|docs/architecture/tok-application-search-index.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected generated changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit refreshed index and remove temporary gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/floor-plan-self-hosted-gate.yml docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          if git diff --cached --quiet; then
            echo "No index refresh required."
            exit 0
          fi
          git commit -m "docs(architecture): refresh floor-plan index"
          git push origin HEAD:fix/floor-plan-finalise-flow-20261005
