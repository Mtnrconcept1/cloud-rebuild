name: Fix incident cache timestamp normalization

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  fix:
    name: Apply corrected stable evidence normalizer
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/unify-incident-intelligence
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply corrected deterministic patch
        shell: bash
        run: |
          python <<'PY_EXTRACT'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-incident-cache-stability.yml").read_text(encoding="utf-8")
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          old = '    || /(?:^|_)(?:created|updated|first|last|started|finished|seen|received|sent|resolved|closed|expires)_at$/.test(normalized)'
          new = '    || normalized.endsWith("_at")'
          if script.count(old) != 1:
              raise SystemExit(f"timestamp normalizer marker count: {script.count(old)}")
          script = script.replace(old, new, 1)
          Path("/tmp/apply-incident-cache-stability.py").write_text(script + "\n", encoding="utf-8")
          PY_EXTRACT
          python /tmp/apply-incident-cache-stability.py

      - name: Regenerate canonical error-code map
        run: pnpm run generate:error-code-map

      - name: Run focused tests
        run: >-
          pnpm exec vitest run --mode production
          src/test/incident-intelligence-routing.test.ts
          src/test/incident-intelligence-unification.test.ts
          src/test/incident-automation-readiness.test.ts
          src/test/incident-evidence-depth.test.ts
          src/test/tok-intelligence-suite.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build:prod

      - name: Validate diff and secret safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff | grep -Eiq '(sk-proj-|sk-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|whsec_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})'; then
            echo "::error::A secret-like value was detected in the generated diff."
            exit 1
          fi

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset \
            .github/workflows/apply-incident-cache-stability.yml \
            .github/workflows/fix-incident-cache-timestamps.yml
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(ops): stabilize incident evidence across recurrences"
          git push origin HEAD:feat/unify-incident-intelligence
