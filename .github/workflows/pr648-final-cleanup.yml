name: PR648 Final Cleanup

on:
  push:
    branches:
      - codex/fix-commercial-multispace-demo-20260907
    paths:
      - .github/workflows/pr648-final-cleanup.yml

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fix-commercial-multispace-demo-20260907
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove unused order-tracking icon import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/pages/SuiviCommandeLive.tsx")
          text = path.read_text()
          old = "  ShoppingBag,\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one unused ShoppingBag import, found {text.count(old)}")
          path.write_text(text.replace(old, "", 1))
          PY
          pnpm exec vitest run --mode production \
            src/test/tok-ai-platform-plan.test.ts \
            src/test/customer-order-tracking-no-simulation.test.ts
          pnpm run typecheck
          git diff --check
      - name: Commit cleaned branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr648-final-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(demo): remove unused tracking icon import"
          git push origin HEAD:codex/fix-commercial-multispace-demo-20260907
