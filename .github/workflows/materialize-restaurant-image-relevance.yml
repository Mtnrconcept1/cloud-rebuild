name: Materialize restaurant image relevance patch

on:
  push:
    branches:
      - fix/restaurant-image-relevance-and-backfill-20260904

permissions:
  contents: write
  issues: read
  actions: write

concurrency:
  group: materialize-restaurant-image-relevance
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PNPM_VERSION: 10.28.1
      EXPECTED_PAYLOAD_SHA256: e9de047e6756c21f44c46254fe2878c3cd1a0911b89bf4380d7c4272c838d762
      PR_NUMBER: "630"

    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: fix/restaurant-image-relevance-and-backfill-20260904
          fetch-depth: 0

      - name: Retrieve and verify the reviewed payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          comments_file="${RUNNER_TEMP}/comments.json"
          payload_file="${RUNNER_TEMP}/image-relevance-payload.tar.gz"

          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > "$comments_file"

          COMMENTS_FILE="$comments_file" PAYLOAD_FILE="$payload_file" python <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          comments = json.loads(Path(os.environ["COMMENTS_FILE"]).read_text(encoding="utf-8"))
          bodies = [
              str(comment.get("body") or "")
              for comment in comments
              if "TOK_IMAGE_RELEVANCE_PAYLOAD_V1_BEGIN" in str(comment.get("body") or "")
          ]
          if not bodies:
              raise SystemExit("reviewed payload comment not found")
          body = bodies[-1]
          match = re.search(
              r"TOK_IMAGE_RELEVANCE_PAYLOAD_V1_BEGIN\s*(.*?)\s*TOK_IMAGE_RELEVANCE_PAYLOAD_V1_END",
              body,
              re.S,
          )
          if not match:
              raise SystemExit("reviewed payload markers are invalid")
          encoded = "".join(match.group(1).split())
          Path(os.environ["PAYLOAD_FILE"]).write_bytes(base64.b64decode(encoded, validate=True))
          PY

          actual_sha="$(sha256sum "$payload_file" | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_PAYLOAD_SHA256"

          PAYLOAD_FILE="$payload_file" python <<'PY'
          import os
          import tarfile

          expected_files = {
              "supabase/functions/enrich-directory-images/index.ts",
              "supabase/migrations/20260904190000_directory_image_relevance_governance.sql",
              "src/test/directory-image-relevance-governance.test.ts",
              "src/test/restaurant-directory-pagination-images.test.ts",
          }
          with tarfile.open(os.environ["PAYLOAD_FILE"], "r:gz") as archive:
              actual_files = set()
              for member in archive.getmembers():
                  normalized = member.name.removeprefix("./")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"archive link is forbidden: {member.name}")
                  if normalized.startswith("/") or ".." in normalized.split("/"):
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.isfile():
                      actual_files.add(normalized)
              if actual_files != expected_files:
                  raise SystemExit(f"unexpected payload files: {sorted(actual_files)}")
          PY

          tar -xzf "$payload_file" -C .
          rm -f .github/workflows/materialize-restaurant-image-relevance.yml

      - name: Verify exact change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            ".github/workflows/materialize-restaurant-image-relevance.yml"
            "src/test/directory-image-relevance-governance.test.ts"
            "src/test/restaurant-directory-pagination-images.test.ts"
            "supabase/functions/enrich-directory-images/index.ts"
            "supabase/migrations/20260904190000_directory_image_relevance_governance.sql"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run targeted regression tests
        run: >-
          pnpm exec vitest run
          src/test/directory-image-relevance-governance.test.ts
          src/test/restaurant-directory-pagination-images.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Commit the exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tok-image-governance-bot"
          git config user.email "tok-image-governance-bot@users.noreply.github.com"
          git add --all
          git commit -m "fix(images): enforce physical restaurant relevance"
          git push origin HEAD:fix/restaurant-image-relevance-and-backfill-20260904

      - name: Dispatch full CI on the tested head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=fix/restaurant-image-relevance-and-backfill-20260904
