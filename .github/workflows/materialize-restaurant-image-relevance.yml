name: Materialize restaurant image relevance patch

on:
  push:
    branches:
      - fix/restaurant-image-relevance-and-backfill-20260904

permissions:
  contents: write
  actions: write

concurrency:
  group: materialize-restaurant-image-relevance
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      PNPM_VERSION: 10.28.1
      PAYLOAD_COMMENT_ID: "5544355532"
      DEDICATED_TOKEN_PRESENT: ${{ secrets.TOK_CODEX_GITHUB_TOKEN != '' }}

    steps:
      - name: Require dedicated repository credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEDICATED_TOKEN_PRESENT" != "true" ]]; then
            echo "::error::TOK_CODEX_GITHUB_TOKEN is required to retrieve the reviewed patch payload."
            exit 1
          fi

      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: fix/restaurant-image-relevance-and-backfill-20260904
          fetch-depth: 0

      - name: Retrieve and verify the reviewed payload
        env:
          GH_TOKEN: ${{ secrets.TOK_CODEX_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$GH_TOKEN"
          comment_file="${RUNNER_TEMP}/payload-comment.json"
          payload_file="${RUNNER_TEMP}/image-relevance-payload.tar.gz"

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${PAYLOAD_COMMENT_ID}" > "$comment_file"

          COMMENT_FILE="$comment_file" PAYLOAD_FILE="$payload_file" python <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          comment = json.loads(Path(os.environ["COMMENT_FILE"]).read_text(encoding="utf-8"))
          body = str(comment.get("body") or "")
          match = re.search(
              r"TOK_IMAGE_RELEVANCE_PAYLOAD_V1_BEGIN\s*(.*?)\s*TOK_IMAGE_RELEVANCE_PAYLOAD_V1_END",
              body,
              re.S,
          )
          if not match:
              raise SystemExit("reviewed payload markers are invalid")
          encoded = "".join(match.group(1).split())
          decoded = base64.b64decode(encoded, validate=True)
          Path(os.environ["PAYLOAD_FILE"]).write_bytes(decoded)
          declared = re.search(r"SHA256=([0-9a-f]{64})", body)
          print(f"encoded_length={len(encoded)} decoded_length={len(decoded)}")
          print(f"declared_sha256={declared.group(1) if declared else 'missing'}")
          PY

          actual_sha="$(sha256sum "$payload_file" | awk '{print $1}')"
          echo "actual_sha256=$actual_sha"

          PAYLOAD_FILE="$payload_file" python <<'PY'
          import os
          import tarfile

          expected_files = {
              "supabase/functions/enrich-directory-images/index.ts",
              "supabase/migrations/20260904190000_directory_image_relevance_governance.sql",
              "src/test/directory-image-relevance-governance.test.ts",
              "src/test/restaurant-directory-pagination-images.test.ts",
          }
          with tarfile.open(os.environ["PAYLOAD_FILE"], "r:gz") as archive:
              actual_files = set()
              for member in archive.getmembers():
                  normalized = member.name.removeprefix("./")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"archive link is forbidden: {member.name}")
                  if normalized.startswith("/") or ".." in normalized.split("/"):
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.isfile():
                      actual_files.add(normalized)
              if actual_files != expected_files:
                  raise SystemExit(f"unexpected payload files: {sorted(actual_files)}")
          PY

          tar -xzf "$payload_file" -C .
          sha256sum \
            supabase/functions/enrich-directory-images/index.ts \
            supabase/migrations/20260904190000_directory_image_relevance_governance.sql \
            src/test/directory-image-relevance-governance.test.ts \
            src/test/restaurant-directory-pagination-images.test.ts
          test "$(sha256sum supabase/functions/enrich-directory-images/index.ts | awk '{print $1}')" = "eafa8e0aaebc3831ee04e19059c53f8e8dd907e703271ee7f3c2f6271a6864ed"
          test "$(sha256sum supabase/migrations/20260904190000_directory_image_relevance_governance.sql | awk '{print $1}')" = "d0340e561b6464ad3dbb67b491596f727f522f5951704ad43f7d1c33e4692f8c"
          test "$(sha256sum src/test/directory-image-relevance-governance.test.ts | awk '{print $1}')" = "1abc8259f81b705475c126195e61d566293d9a9b8a5231997c8f5d932bad486b"
          test "$(sha256sum src/test/restaurant-directory-pagination-images.test.ts | awk '{print $1}')" = "6141d8be728c62c05958d0909b062ea7d9b05cba371102a001716090e72aac8a"
          rm -f .github/workflows/materialize-restaurant-image-relevance.yml

      - name: Verify exact change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            ".github/workflows/materialize-restaurant-image-relevance.yml"
            "src/test/directory-image-relevance-governance.test.ts"
            "src/test/restaurant-directory-pagination-images.test.ts"
            "supabase/functions/enrich-directory-images/index.ts"
            "supabase/migrations/20260904190000_directory_image_relevance_governance.sql"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run targeted regression tests
        run: >-
          pnpm exec vitest run
          src/test/directory-image-relevance-governance.test.ts
          src/test/restaurant-directory-pagination-images.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Commit the exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tok-image-governance-bot"
          git config user.email "tok-image-governance-bot@users.noreply.github.com"
          git add --all
          git commit -m "fix(images): enforce physical restaurant relevance"
          git push origin HEAD:fix/restaurant-image-relevance-and-backfill-20260904

      - name: Dispatch full CI on the tested head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=fix/restaurant-image-relevance-and-backfill-20260904
