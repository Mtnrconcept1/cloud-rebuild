name: Temporary TOK application index refresh
on:
  push:
    branches: [codex/tok-social-three-hour-cadence-20261015]
    paths: [.github/workflows/tok-index-refresh-temporary.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:application-index
      - name: Commit regenerated indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          if ! git diff --cached --quiet; then
            git commit -m 'chore(marketing): refresh application indexes after batch preset'
            git push origin HEAD:codex/tok-social-three-hour-cadence-20261015
          fi
