name: Temporary TOK indexes one-shot clean refresh
on:
  push:
    branches: [codex/tok-social-three-hour-cadence-20261015]
    paths: [.github/workflows/tok-index-refresh-temporary.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove temporary workflow before calculating source digest
        run: rm .github/workflows/tok-index-refresh-temporary.yml
      - run: pnpm docs:application-index
      - name: Commit clean generated state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .github/workflows/tok-index-refresh-temporary.yml docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git commit -m 'chore(marketing): refresh generated indexes without temporary workflow'
          git push origin HEAD:codex/tok-social-three-hour-cadence-20261015
