name: Temporary TOK application index refresh
on:
  push:
    branches:
      - feat/stripe-dispute-sinistres-20261012
    paths:
      - .github/workflows/tok-index-refresh-temporary.yml
permissions:
  contents: write
concurrency:
  group: tok-index-refresh-dispute
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Remove temporary generator before computing source digest
        run: git rm .github/workflows/tok-index-refresh-temporary.yml
      - name: Install dependencies and regenerate canonical reference
        run: |
          pnpm install --frozen-lockfile
          pnpm docs:application-index
          pnpm docs:application-index:check
      - name: Commit generated reference back to feature branch only
        env:
          TARGET_BRANCH: feat/stripe-dispute-sinistres-20261012
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          git commit -m "docs(index): regenerate TOK application reference for Stripe dispute support"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
