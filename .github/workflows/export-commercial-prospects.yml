name: Export commercial prospect source

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v4
        with:
          name: current-geneva-commercial-prospects
          path: public/data/geneva-commercial-prospects.json
          if-no-files-found: error
          retention-days: 1
