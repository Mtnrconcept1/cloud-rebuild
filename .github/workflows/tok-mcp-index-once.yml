name: TOK MCP catalogue regeneration (one-shot)
on:
  push:
    branches:
      - feat/tok-mcp-restaurant-studio-20261017

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.repository == 'Mtnrconcept1/cloud-rebuild' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only the dedicated feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Enable project pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install pinned dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate and verify canonical index without this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/feat/tok-mcp-restaurant-studio-20261017"
          git rm -- .github/workflows/tok-mcp-index-once.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(docs): regenerate canonical TOK application catalogue [index-generated]"
          git push origin HEAD:refs/heads/feat/tok-mcp-restaurant-studio-20261017
