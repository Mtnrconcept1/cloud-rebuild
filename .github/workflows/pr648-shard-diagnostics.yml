name: PR648 Shard Diagnostics

on:
  push:
    branches:
      - codex/fix-commercial-multispace-demo-20260907
    paths:
      - .github/workflows/pr648-shard-diagnostics.yml

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fix-commercial-multispace-demo-20260907
      - run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run shard and print only failures
        shell: bash
        run: |
          set +e
          pnpm exec vitest run --mode production --shard=${{ matrix.shard }}/4 --reporter=json --outputFile=vitest-${{ matrix.shard }}.json >/dev/null 2>&1
          code=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const shard = process.env.SHARD;
          const path = `vitest-${shard}.json`;
          if (!fs.existsSync(path)) {
            console.log(`SHARD ${shard}: no JSON report generated`);
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log(`SHARD ${shard}: success=${report.success} failedSuites=${report.numFailedTestSuites ?? '?'} failedTests=${report.numFailedTests ?? '?'}`);
          for (const suite of report.testResults || []) {
            const failed = (suite.assertionResults || []).filter((a) => a.status === 'failed');
            if (!failed.length && suite.status !== 'failed') continue;
            console.log(`FILE ${suite.name}`);
            for (const test of failed) {
              console.log(`TEST ${(test.ancestorTitles || []).concat(test.title || '').filter(Boolean).join(' > ')}`);
              for (const msg of (test.failureMessages || []).slice(0, 2)) {
                console.log(String(msg).split('\n').slice(0, 14).join('\n'));
              }
            }
            for (const msg of (suite.message ? [suite.message] : []).slice(0, 1)) {
              console.log(String(msg).split('\n').slice(0, 14).join('\n'));
            }
          }
          NODE
          exit "$code"
        env:
          SHARD: ${{ matrix.shard }}
