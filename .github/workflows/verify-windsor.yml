name: Verify TOK Windsor connection

on:
  workflow_dispatch:
  push:
    branches: [agent/tok-growth-windsor-20261101]
    paths: [.github/workflows/verify-windsor.yml]

permissions: {}

jobs:
  read-only:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/agent/tok-growth-windsor-20261101' && github.actor == 'mtnrconcept'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: Production
      deployment: false
    steps:
      - name: Verify the TOK property and Supabase secret metadata
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          const project = "wwcrtyoueexyxkkikaos";
          const property = "sc-domain:thetok.ch";
          const key = process.env.WINDSOR_API_KEY;
          if (!key || !process.env.SUPABASE_ACCESS_TOKEN) throw Error("Missing Production secret");
          async function readJson(url, headers = {}) {
            let response;
            try { response = await fetch(url, { headers, redirect:"error", signal:AbortSignal.timeout(25000) }); }
            catch { throw Error("Provider request did not complete"); }
            if (!response.ok) throw Error("Provider HTTP " + response.status);
            try { return await response.json(); } catch { throw Error("Invalid JSON response"); }
          }
          const list = await readJson("https://api.supabase.com/v1/projects/"+project+"/secrets",
            { Authorization:"Bearer " + process.env.SUPABASE_ACCESS_TOKEN });
          const entry = Array.isArray(list) && list.find(item => item.name === "WINDSOR_API_KEY");
          if (!entry) throw Error("WINDSOR_API_KEY absent from TOK Edge secrets");
          console.log("Confirmed WINDSOR_API_KEY in TOK Edge secret metadata.");
          if (typeof entry.value === "string" && /^[0-9a-f]{64}$/i.test(entry.value)) {
            if (createHash("sha256").update(key).digest("hex") !== entry.value.toLowerCase())
              throw Error("GitHub and Supabase secret fingerprints differ");
            console.log("GitHub and Supabase fingerprints match.");
          }
          const dateAt = days => new Date(Date.now()-days*86400000).toISOString().slice(0,10);
          const from=dateAt(9), to=dateAt(3);
          let session, version;
          const endpoint="https://mcp.windsor.ai/";
          const headers={Authorization:"Bearer "+key,Accept:"application/json, text/event-stream","Content-Type":"application/json"};
          async function rpc(body) {
            const response=await fetch(endpoint,{method:"POST",headers:{...headers,...(session?{"Mcp-Session-Id":session}:{}),...(version?{"MCP-Protocol-Version":version}:{})},redirect:"error",signal:AbortSignal.timeout(30000),body:JSON.stringify({jsonrpc:"2.0",...body})});
            if(!response.ok) throw Error("Windsor MCP HTTP "+response.status);
            if(response.headers.has("mcp-session-id")) session=response.headers.get("mcp-session-id");
            if(body.id===undefined) { await response.body?.cancel(); return; }
            const raw=await response.text();
            const messages=response.headers.get("content-type")?.includes("text/event-stream") ? raw.split(/\r?\n/).filter(s=>s.startsWith("data:")).map(s=>JSON.parse(s.slice(5))) : [JSON.parse(raw)];
            const msg=messages.find(x=>x.id===body.id);
            if(!msg || msg.error || msg.result?.isError) throw Error("Windsor MCP rejected "+body.method);
            return msg.result;
          }
          const init=await rpc({id:1,method:"initialize",params:{protocolVersion:"2025-06-18",capabilities:{},clientInfo:{name:"tok-marketing-agent",version:"1.0"}}});
          version=init.protocolVersion;
          await rpc({method:"notifications/initialized"});
          const read=await rpc({id:2,method:"tools/call",params:{name:"get_data",arguments:{connector:"searchconsole",accounts:[property],date_from:from,date_to:to,fields:["site","date","clicks","impressions"]}}});
          const result=read.structuredContent ?? JSON.parse(read.content.find(x=>x.type==="text").text);
          const rows=result.data ?? result.result?.data;
          console.log("Windsor MCP result status", result.status??result.result?.status??"unknown", "rows", Array.isArray(rows)?rows.length:0);
          if(!Array.isArray(rows) || !rows.length || rows.length>7 ||
             rows.some(row => !["thetok.ch",property].includes(row.site) || typeof row.date!=="string" ||
               row.date<from || row.date>to || !Number.isSafeInteger(row.clicks) || row.clicks<0 ||
               !Number.isSafeInteger(row.impressions) || row.impressions<0) || new Set(rows.map(r=>r.date)).size!==rows.length)
             throw Error("Windsor did not return valid TOK daily observations");
          console.log("Verified", property, from, to, "days", rows.length,
            "clicks", rows.reduce((n,r)=>n+r.clicks,0), "impressions", rows.reduce((n,r)=>n+r.impressions,0));
          NODE
