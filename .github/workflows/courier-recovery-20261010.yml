name: Temporary courier branch recovery
on:
  push:
    branches: [codex/tok-courier-atomic-20261010]
permissions:
  contents: write
concurrency:
  group: courier-branch-recovery
  cancel-in-progress: true
jobs:
  recover:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild' && github.ref == 'refs/heads/codex/tok-courier-atomic-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: 99dbb1397cd144b184e1c36e58ad89e2c24d5518
      CI: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '54322'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      TOK_COURIER_ATOMIC_DISPOSABLE: 'true'
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.102.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare isolated branch and preserve the reviewed main changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=20 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/tok-courier-recovery" "$GITHUB_SHA"
          echo "SOURCE_WORKTREE=$RUNNER_TEMP/tok-courier-recovery" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/courier-recovery-evidence"
          cd "$RUNNER_TEMP/tok-courier-recovery"
          git status --short
          git log -3 --oneline
          if ! git -c user.name='Courier recovery' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-commit --no-ff "$BASE_SHA"; then
            git diff --name-only --diff-filter=U | sort > "$RUNNER_TEMP/courier-conflicts.txt"
            printf '%s\n' docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json | sort > "$RUNNER_TEMP/courier-expected-conflicts.txt"
            diff -u "$RUNNER_TEMP/courier-expected-conflicts.txt" "$RUNNER_TEMP/courier-conflicts.txt"
          fi
          python "$GITHUB_WORKSPACE/.github/courier-recovery-20261010.py" apply
          git rm .github/workflows/courier-recovery-20261010.yml .github/courier-recovery-20261010.py .github/courier-recovery-edge-types.py
          git add src/test/courier-atomic-edge.test.ts
          node --check scripts/test-courier-atomic-postgres.mjs
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/courier-recovery-evidence/install.log" 2>&1
          python "$GITHUB_WORKSPACE/.github/courier-recovery-edge-types.py"
          deno check --frozen supabase/functions/courier-portal/index.ts supabase/functions/dispatch-order/index.ts supabase/functions/dispatch-timeout/index.ts supabase/functions/restaurant-order-status/index.ts > "$RUNNER_TEMP/courier-recovery-evidence/deno-early.log" 2>&1 || { cat "$RUNNER_TEMP/courier-recovery-evidence/deno-early.log"; exit 1; }
          node scripts/generate-application-index.mjs
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Reproduce the stale courier penalty, then validate the fix on a fresh database
        shell: bash
        run: |
          set -euo pipefail
          BASE_WORKTREE="$RUNNER_TEMP/tok-courier-recovery-main"
          EVIDENCE="$RUNNER_TEMP/courier-recovery-evidence"
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          sed -i 's/^project_id = .*/project_id = "tok-courier-recovery-ci"/' "$BASE_WORKTREE/supabase/config.toml"
          printf '\n[db]\nmajor_version = 17\n[db.seed]\nenabled = false\n' >> "$BASE_WORKTREE/supabase/config.toml"
          docker network create --subnet 172.30.76.0/24 tok-courier-recovery-ci
          NETWORK_ID=$(docker network inspect tok-courier-recovery-ci --format '{{.Id}}')
          sudo iptables -I DOCKER-USER 1 -i "br-${NETWORK_ID:0:12}" ! -d 172.30.76.0/24 -m conntrack --ctstate NEW -j REJECT
          cleanup() {
            cd "$BASE_WORKTREE"
            supabase stop --no-backup || true
            docker network rm tok-courier-recovery-ci || true
          }
          trap cleanup EXIT
          replay_main() {
            cd "$BASE_WORKTREE"
            mkdir -p "$RUNNER_TEMP/courier-recovery-later"
            for migration in supabase/migrations/*.sql; do
              filename=$(basename "$migration")
              if [[ "${filename%%_*}" > "20260909025200" ]]; then
                mv "$migration" "$RUNNER_TEMP/courier-recovery-later/"
              fi
            done
            supabase db start --network-id tok-courier-recovery-ci
            if docker exec supabase_db_tok-courier-recovery-ci timeout 3 bash -c 'exec 3<>/dev/tcp/1.1.1.1/443'; then
              echo 'Database egress unexpectedly succeeded' >&2
              exit 1
            fi
            sudo iptables -nvx -L DOCKER-USER > "$EVIDENCE/egress-firewall.txt"
            awk -v bridge="br-${NETWORK_ID:0:12}" '$3 == "REJECT" && $6 == bridge && $1 > 0 { blocked=1 } END { exit !blocked }' "$EVIDENCE/egress-firewall.txt"
            psql -X -v ON_ERROR_STOP=1 -f "$SOURCE_WORKTREE/supabase/tests/print_fulfillment_protocol_baseline_prerequisites.sql"
            mv "$RUNNER_TEMP/courier-recovery-later/"*.sql supabase/migrations/
            git diff --exit-code -- supabase/migrations
            supabase migration up --local --network-id tok-courier-recovery-ci
            psql -X -v ON_ERROR_STOP=1 -At -c 'SELECT version FROM supabase_migrations.schema_migrations ORDER BY version' > "$EVIDENCE/applied-main-versions.txt"
            find supabase/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | cut -d_ -f1 | sort > "$EVIDENCE/expected-main-versions.txt"
            diff -u "$EVIDENCE/expected-main-versions.txt" "$EVIDENCE/applied-main-versions.txt"
          }
          replay_main > "$EVIDENCE/base-red.log" 2>&1
          cd "$SOURCE_WORKTREE"
          set +e
          node scripts/test-courier-atomic-postgres.mjs > "$EVIDENCE/red.log" 2>&1
          RED_EXIT=$?
          set -e
          tail -60 "$EVIDENCE/red.log"
          test "$RED_EXIT" -ne 0
          grep -Fq 'Stale expiry must not penalize a newly assigned courier whose row was not locked' "$EVIDENCE/red.log"
          echo 'RED_CONFIRMED: reassigned offer penalizes the wrong courier'
          python "$GITHUB_WORKSPACE/.github/courier-recovery-20261010.py" fix
          cd "$BASE_WORKTREE"
          supabase stop --no-backup
          replay_main > "$EVIDENCE/base-green.log" 2>&1
          cd "$SOURCE_WORKTREE"
          node scripts/test-courier-atomic-postgres.mjs > "$EVIDENCE/green.log" 2>&1
          tail -50 "$EVIDENCE/green.log"
          echo 'GREEN_CONFIRMED: all real PostgreSQL scenarios passed'
      - name: Validate the complete application and all modified Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_WORKTREE"
          EVIDENCE="$RUNNER_TEMP/courier-recovery-evidence"
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile > "$EVIDENCE/install.log" 2>&1
          node scripts/generate-application-index.mjs
          pnpm run docs:application-index:check
          timeout 8m pnpm exec vitest run --maxWorkers=2 --reporter=verbose > "$EVIDENCE/full-tests.log" 2>&1 || { tail -100 "$EVIDENCE/full-tests.log"; exit 1; }
          tail -15 "$EVIDENCE/full-tests.log"
          pnpm lint > "$EVIDENCE/lint.log" 2>&1
          tail -5 "$EVIDENCE/lint.log"
          pnpm typecheck > "$EVIDENCE/typecheck.log" 2>&1
          pnpm build > "$EVIDENCE/build.log" 2>&1
          tail -5 "$EVIDENCE/build.log"
          deno --version
          deno check --frozen supabase/functions/courier-portal/index.ts supabase/functions/dispatch-order/index.ts supabase/functions/dispatch-timeout/index.ts supabase/functions/restaurant-order-status/index.ts > "$EVIDENCE/deno.log" 2>&1
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json docs/testing/courier-dispatch-atomic.md scripts/test-courier-atomic-postgres.mjs src/test/courier-atomic-edge.test.ts supabase/migrations/20261010223000_courier_dispatch_atomic.sql
          git add supabase/functions/courier-portal/index.ts supabase/functions/dispatch-order/index.ts
          git diff --check
          git diff --cached --check
          pnpm run docs:application-index:check
          echo 'APPLICATION_VALIDATED: full tests, lint, typecheck, Vite build, Deno, canonical index'
      - name: Publish only the verified Git tree objects, never a branch or deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$SOURCE_WORKTREE"
          python "$GITHUB_WORKSPACE/.github/courier-recovery-20261010.py" publish
          mkdir -p "$RUNNER_TEMP/courier-recovery-evidence/complete-files"
          git diff --cached --name-only "$BASE_SHA" -z | xargs -0 -I{} cp --parents "{}" "$RUNNER_TEMP/courier-recovery-evidence/complete-files/"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courier-recovery-evidence
          path: ${{ runner.temp }}/courier-recovery-evidence
          include-hidden-files: true
