name: TOK regenerate tracked indexes (one time)
on:
  push:
    branches:
      - feat/stripe-tok-reusable-price-catalog-20261014
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.ref_name == 'feat/stripe-tok-reusable-price-catalog-20261014'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Rebuild generated application indexes and code map
        run: |
          pnpm run docs:application-index
          pnpm run generate:error-code-map
      - name: Commit verified generated outputs and clean up one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts supabase/functions/_shared/error-code-map.ts
          git rm -f .github/workflows/tok-regenerate-once.yml
          git diff --cached --check
          git config user.name "TOK generated-files bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): refresh generated docs after Stripe regression tests"
          git push origin HEAD:feat/stripe-tok-reusable-price-catalog-20261014
