name: Regenerate TOK index for PR 787 (temporary)
on:
  push:
    branches:
      - codex/client-launch-guest-browsing-20261012
permissions:
  contents: write
jobs:
  update-generated-index:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate documentation from final tracked files
        run: |
          git rm .github/workflows/regen-application-index-pr-787.yml
          pnpm docs:application-index
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate canonical TOK index for customer launch gate'
          git push origin HEAD:refs/heads/codex/client-launch-guest-browsing-20261012
