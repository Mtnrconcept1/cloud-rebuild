name: Temporary PR 443 lint diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: ${{ github.event.pull_request.number == 443 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_JOB_ID: "89754727217"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Extract only the prior lint diagnostics
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" \
            --output "${RUNNER_TEMP}/source-job.log"

          python - "${RUNNER_TEMP}/source-job.log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8-sig", errors="replace").splitlines()
          needles = (
              "ops-incident-control",
              "incident-automation-readiness",
              "error",
              "warning",
              "problem",
              "✖",
          )
          selected = [line for line in lines if any(needle in line.lower() for needle in needles)]
          print("\n".join(selected[-60:]) or "No matching lint diagnostic was found.")
          PY
