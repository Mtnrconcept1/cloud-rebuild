name: TOK dashboard index refresh — temporary PR 944

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tok-dashboard-index-refresh-944.yml

permissions:
  contents: read

concurrency:
  group: tok-dashboard-index-944
  cancel-in-progress: false

jobs:
  build-index:
    if: >-
      github.repository == 'Mtnrconcept1/cloud-rebuild' &&
      github.event.pull_request.number == 944 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/dashboard-white-page-heroes-20261021' &&
      github.actor == 'mtnrconcept'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup pinned Node 22 and pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: pnpm
      - name: Regenerate the exact canonical index
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain)"
          pnpm install --frozen-lockfile
          pnpm run docs:application-index
          git diff --check
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          allowed = {
            'docs/architecture/tok-application-search-index.json',
            'docs/architecture/TOK_APPLICATION_REFERENCE.md',
            'src/data/tok-user-guide-catalog.generated.ts',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != allowed:
            raise RuntimeError(f'Unexpected changed files: {changed}; expected {allowed}')
          archive_path = pathlib.Path('/tmp/tok-dashboard-index.tar.gz')
          with tarfile.open(archive_path, mode='w:gz') as archive:
            for name in sorted(allowed):
              file = pathlib.Path(name)
              if not file.is_file() or file.is_symlink():
                raise RuntimeError(f'Missing or symlink index: {name}')
              archive.add(str(file), arcname=name, recursive=False)
          print('Index refresh approved:', sorted(changed), 'compressed bytes:', archive_path.stat().st_size)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tok-dashboard-index-${{ github.run_id }}
          path: /tmp/tok-dashboard-index.tar.gz
          retention-days: 1
          if-no-files-found: error

  commit-index:
    needs: build-index
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Commit only allowlisted generated index files to dedicated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import base64, io, json, os, re, tarfile, urllib.error, urllib.request, zipfile
          repo = 'Mtnrconcept1/cloud-rebuild'
          branch = 'codex/dashboard-white-page-heroes-20261021'
          expected = os.environ['EXPECTED_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', expected): raise ValueError('Invalid base commit')
          root = 'https://api.github.com/repos/' + repo + '/'
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'}
          def api(path, method='GET', body=None):
            request = urllib.request.Request(root+path, data=None if body is None else json.dumps(body).encode(), headers=headers, method=method)
            with urllib.request.urlopen(request, timeout=60) as response:
              return json.load(response)
          ref = 'git/refs/heads/' + branch
          if api(ref)['object']['sha'] != expected:
            raise RuntimeError('Dedicated branch moved; cannot commit refreshed index')
          run_id=os.environ['RUN_ID']
          artifacts = api('actions/runs/'+run_id+'/artifacts')['artifacts']
          match = [a for a in artifacts if a['name'] == 'tok-dashboard-index-'+run_id and not a['expired']]
          if len(match) != 1: raise RuntimeError('Index artifact missing or ambiguous')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
            opener.open(urllib.request.Request(root+'actions/artifacts/'+str(match[0]['id'])+'/zip',headers=headers),timeout=60)
            raise RuntimeError('Expected redirected artifact')
          except urllib.error.HTTPError as ex:
            if ex.code != 302: raise
            url=ex.headers['Location']
          if not url.startswith('https://'): raise RuntimeError('Non-HTTPS artifact URL')
          with urllib.request.urlopen(url,timeout=60) as response: result=response.read(20_000_001)
          if len(result) > 20_000_000: raise RuntimeError('Oversized index archive')
          outer=zipfile.ZipFile(io.BytesIO(result))
          if outer.namelist() != ['tok-dashboard-index.tar.gz']: raise RuntimeError('Unexpected files in artifact')
          inner=tarfile.open(fileobj=io.BytesIO(outer.read('tok-dashboard-index.tar.gz')),mode='r:gz')
          expected_names={
            'docs/architecture/tok-application-search-index.json',
            'docs/architecture/TOK_APPLICATION_REFERENCE.md',
            'src/data/tok-user-guide-catalog.generated.ts'
          }
          members=inner.getmembers()
          if set(m.name for m in members)!=expected_names or not all(m.isfile() and m.size<12_000_000 for m in members):
            raise RuntimeError('Unexpected generated files')
          files=[]
          for item in members:
            data=inner.extractfile(item).read()
            data.decode('utf-8')
            blob=api('git/blobs','POST',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
            files.append({'path':item.name,'mode':'100644','type':'blob','sha':blob['sha']})
          parent=api('git/commits/'+expected)
          new_tree=api('git/trees','POST',{'base_tree':parent['tree']['sha'],'tree':files})
          commit=api('git/commits','POST',{'message':'docs(dashboards): refresh canonical application index for page scenes','tree':new_tree['sha'],'parents':[expected]})
          if api(ref)['object']['sha'] != expected:
            raise RuntimeError('Concurrent update detected, leaving index commit unattached')
          api(ref,'PATCH',{'sha':commit['sha'],'force':False})
          print('Committed generated canonical index to isolated PR branch:',commit['sha'])
          PY
