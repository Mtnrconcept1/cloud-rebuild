name: Changed Test Files

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "src/**/*.test.ts"
      - "src/**/*.test.tsx"
      - "src/**/*.spec.ts"
      - "src/**/*.spec.tsx"
      - ".github/workflows/changed-test-files.yml"

concurrency:
  group: changed-test-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VITE_SUPABASE_URL: "https://example.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY: "ci-public-placeholder"
  VITE_SUPABASE_ANON_KEY: "ci-public-placeholder"

jobs:
  changed-tests:
    name: changed-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run every changed test file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' test_files < <(
            git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- \
              'src/**/*.test.ts' \
              'src/**/*.test.tsx' \
              'src/**/*.spec.ts' \
              'src/**/*.spec.tsx'
          )

          if (( ${#test_files[@]} == 0 )); then
            echo "No added or modified test file to execute."
            exit 0
          fi

          printf 'Executing changed test: %q\n' "${test_files[@]}"
          pnpm exec vitest run --mode production "${test_files[@]}"
