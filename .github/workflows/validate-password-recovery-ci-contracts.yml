name: Validate password recovery CI contracts

on:
  push:
    branches:
      - fix/password-recovery-ci-contracts

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[full-validation-complete]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/password-recovery-ci-contracts
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build:prod

      - name: Full Vitest suite
        run: pnpm exec vitest run --mode production

      - name: Remove temporary validator after success
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-password-recovery-ci-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/validate-password-recovery-ci-contracts.yml
          git commit -m "ci: record full recovery validation [full-validation-complete]"
          git push origin HEAD:fix/password-recovery-ci-contracts
