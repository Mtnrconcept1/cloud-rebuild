name: Agent AutoPilot PostgreSQL 17 migration verification (one shot)
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  disposable-postgres:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/tok-autopilot-daily-growth-repair-20261031' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true
      - name: Run original and patched growth migrations against disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          psql --version
          psql -v ON_ERROR_STOP=1 -f supabase/tests/marketing_growth_autopilot_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031063000_marketing_growth_autopilot.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031063000_marketing_growth_autopilot.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031214500_marketing_growth_noon_refresh.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031214500_marketing_growth_noon_refresh.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/marketing_growth_autopilot.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove temporary runner and update generated application index
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
          git rm -- .github/workflows/agent-autopilot-postgres-once.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git -c user.name="tok-ci-index" -c user.email="actions@users.noreply.github.com" commit -m "test(marketing): PostgreSQL 17 regression and refreshed canonical index"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
