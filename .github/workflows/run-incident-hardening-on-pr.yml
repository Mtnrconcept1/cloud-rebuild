name: Run incident hardening on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  run-hardening:
    name: Apply and validate incident hardening
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/unify-incident-intelligence
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract and apply deterministic patch
        shell: bash
        run: |
          python <<'PY_EXTRACT'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-incident-intelligence-hardening.yml").read_text(encoding="utf-8")
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )

          strict_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")'''
          tolerant_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              exact_count = source.count(old)
              if exact_count == 1:
                  target.write_text(source.replace(old, new, 1), encoding="utf-8")
                  return

              old_lines = old.strip("\\n").splitlines()
              normalized_old = [line.strip() for line in old_lines]
              source_lines = source.splitlines()
              matches: list[int] = []
              width = len(old_lines)
              for candidate in range(0, len(source_lines) - width + 1):
                  if [line.strip() for line in source_lines[candidate:candidate + width]] == normalized_old:
                      matches.append(candidate)

              if len(matches) != 1:
                  marker = normalized_old[0] if normalized_old else "<empty>"
                  raise SystemExit(
                      f"{path}: expected one normalized occurrence for {marker!r}, found {len(matches)}"
                  )

              candidate = matches[0]
              source_lines[candidate:candidate + width] = new.strip("\\n").splitlines()
              trailing_newline = "\\n" if source.endswith("\\n") else ""
              target.write_text("\\n".join(source_lines) + trailing_newline, encoding="utf-8")'''
          if script.count(strict_helper) != 1:
              raise SystemExit("Unable to locate the strict replace_once helper")
          script = script.replace(strict_helper, tolerant_helper, 1)

          Path("/tmp/apply-incident-hardening.py").write_text(script + "\n", encoding="utf-8")
          PY_EXTRACT
          python /tmp/apply-incident-hardening.py

      - name: Regenerate canonical error-code map
        run: pnpm run generate:error-code-map

      - name: Run focused incident tests
        run: >-
          pnpm exec vitest run --mode production
          src/test/incident-intelligence-routing.test.ts
          src/test/incident-intelligence-unification.test.ts
          src/test/incident-automation-readiness.test.ts
          src/test/incident-evidence-depth.test.ts
          src/test/tok-intelligence-suite.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build:prod

      - name: Validate diff and secret safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff | grep -Eiq '(sk-proj-|sk-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|whsec_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})'; then
            echo "::error::A secret-like value was detected in the generated diff."
            exit 1
          fi
          historical_migrations="$(git diff --name-only --diff-filter=M -- 'supabase/migrations/*.sql' | grep -v '^supabase/migrations/20260801130000_unify_incident_intelligence.sql$' || true)"
          if [[ -n "$historical_migrations" ]]; then
            echo "::error::Existing migrations must remain immutable."
            printf '%s\n' "$historical_migrations"
            exit 1
          fi

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset \
            .github/workflows/apply-incident-intelligence-hardening.yml \
            .github/workflows/run-incident-hardening-on-pr.yml
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(ops): harden incident routing and support deduplication"
          git push origin HEAD:feat/unify-incident-intelligence
