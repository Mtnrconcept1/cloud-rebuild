name: Regenerate TOK Printer application index (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tok-printer-index-bootstrap.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.event.pull_request.number == 835 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/admin-tok-printer-page-20261014' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove temporary bootstrap and regenerate canonical index
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/tok-printer-index-bootstrap.yml
          pnpm run docs:application-index
          pnpm run docs:application-index:check
          pnpm exec vitest run --mode production src/test/application-search-index.test.ts src/test/route-wiring.test.ts src/test/marketing-print-contract.test.ts src/test/admin-mobile-navigation.test.tsx
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(admin): regenerate canonical index for TOK Printer route"
          git push origin HEAD:refs/heads/feat/admin-tok-printer-page-20261014
