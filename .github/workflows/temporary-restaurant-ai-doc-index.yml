name: Temporary Restaurant AI Application Index
on:
  push:
    branches:
      - feat/restaurant-ai-controlled-edits-20261014

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove temporary workflow before indexing
        run: git rm -- .github/workflows/temporary-restaurant-ai-doc-index.yml
      - run: pnpm docs:application-index
      - name: Commit regenerated files and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --quiet || git commit -m "chore(docs): regenerate TOK application index for restaurant AI edits"
          git push origin HEAD:refs/heads/feat/restaurant-ai-controlled-edits-20261014
