name: TOK Connect Canonical URL Patch

on:
  push:
    branches:
      - work/tok-connect-mcp-pulse-widget-20260903

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-mcp-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: work/tok-connect-mcp-pulse-widget-20260903

      - name: Point user-facing ChatGPT setup to the canonical MCP URL
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            Path("src/pages/TokConnect.tsx"): [
              ('const CHATGPT_MCP_SERVER_URL = `${CHATGPT_FUNCTIONS_BASE_URL}/tok-connect-mcp`;', 'const CHATGPT_MCP_SERVER_URL = `${CANONICAL_ORIGIN}/mcp`;'),
            ],
            Path("src/pages/admin/AdminTokConnect.tsx"): [
              ('const CHATGPT_FUNCTIONS_BASE_URL = getChatGptFunctionsBaseUrl();\nconst CHATGPT_MCP_SERVER_URL = `${CHATGPT_FUNCTIONS_BASE_URL}/tok-connect-mcp`;', 'const CHATGPT_FUNCTIONS_BASE_URL = getChatGptFunctionsBaseUrl();\nconst CHATGPT_MCP_SERVER_URL = "https://www.thetok.ch/mcp";'),
            ],
            Path("src/test/tok-connect-frontend.test.ts"): [
              ('expect(page).toContain("/tok-connect-mcp");', 'expect(page).toContain("https://www.thetok.ch/mcp");'),
              ('expect(admin).toContain("tok-connect-mcp");', 'expect(admin).toContain("https://www.thetok.ch/mcp");'),
            ],
          }

          for path, pairs in replacements.items():
            text = path.read_text(encoding="utf-8")
            for before, after in pairs:
              if before not in text:
                raise SystemExit(f"missing marker in {path}: {before}")
              text = text.replace(before, after)
            path.write_text(text, encoding="utf-8")

      - name: Validate canonical setup URL
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CHATGPT_MCP_SERVER_URL = `${CANONICAL_ORIGIN}/mcp`' src/pages/TokConnect.tsx
          grep -q 'CHATGPT_MCP_SERVER_URL = "https://www.thetok.ch/mcp"' src/pages/admin/AdminTokConnect.tsx
          ! grep -q 'CHATGPT_MCP_SERVER_URL = .*tok-connect-mcp' src/pages/TokConnect.tsx
          ! grep -q 'CHATGPT_MCP_SERVER_URL = .*tok-connect-mcp' src/pages/admin/AdminTokConnect.tsx

      - name: Commit product files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mtnrconcept"
          git config user.email "149347251+mtnrconcept@users.noreply.github.com"
          git add src/pages/TokConnect.tsx src/pages/admin/AdminTokConnect.tsx src/test/tok-connect-frontend.test.ts
          git commit -m "fix(tok-connect): documenter l'URL MCP canonique [canonical-mcp-patched]"
          git push origin HEAD:work/tok-connect-mcp-pulse-widget-20260903
