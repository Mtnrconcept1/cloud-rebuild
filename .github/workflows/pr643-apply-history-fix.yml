name: PR643 apply server history fix

on:
  push:
    branches:
      - fix/ai-creations-server-history-20260907

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ai-creations-server-history-20260907
          fetch-depth: 0
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply server-backed history fix
        run: python scripts/pr643_apply_history_fix.py
      - name: Verify focused regressions
        run: |
          pnpm exec vitest run --mode production \
            src/test/ai-creations-server-history.test.ts \
            src/test/photo-studio-persistence.test.ts \
            src/test/ai-gallery-print-media-contract.test.ts \
            src/test/commercial-demo-ai-workspaces.test.ts \
            src/test/commercial-demo-ai-creation-scope.test.ts
          pnpm run typecheck
      - name: Remove temporary patch files
        run: rm -f scripts/pr643_apply_history_fix.py .github/workflows/pr643-apply-history-fix.yml
      - name: Validate diff
        run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): hydrate Mes créations from server"
          git push origin HEAD:fix/ai-creations-server-history-20260907
