name: Validate final MFA password and marketing patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mfa-password-and-marketing-login'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mfa-password-and-marketing-login
          fetch-depth: 1

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build:prod

      - name: Full tests shard 1
        run: pnpm exec vitest run --mode production --shard=1/4

      - name: Full tests shard 2
        run: pnpm exec vitest run --mode production --shard=2/4

      - name: Full tests shard 3
        run: pnpm exec vitest run --mode production --shard=3/4

      - name: Full tests shard 4
        run: pnpm exec vitest run --mode production --shard=4/4

      - name: Remove temporary validator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-final-mfa-password-marketing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/validate-final-mfa-password-marketing.yml
          git diff --cached --check
          git commit -m "ci: remove final MFA password validator"
          git push origin HEAD:fix/mfa-password-and-marketing-login
