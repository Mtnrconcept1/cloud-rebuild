name: TOK Instagram isolated validation workspace

on:
  push:
    branches: [ops/tok-instagram-20261020]
    paths: [.github/workflows/marketing-meta-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: tok-instagram-validation-workspace
  cancel-in-progress: false

jobs:
  workspace:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild' && github.ref == 'refs/heads/ops/tok-instagram-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public source without persistent credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 4
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            api
            server
            src
            supabase
            scripts
            docs
            tests
            patches
            workers
            public/marketing
          sparse-checkout-cone-mode: true
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install locked dependencies without production credentials
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
          npm install --prefix /tmp/tok-sql-tools --no-audit --no-fund @electric-sql/pglite@0.3.15
      - name: Verify and archive only public source and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git branch --show-current
          git log -4 --oneline
          git ls-tree -r --name-only HEAD > /tmp/tok-repository-paths.txt
          if git config --local --get-regexp 'http\..*extraheader'; then
            echo 'Unexpected persistent authentication header' >&2
            exit 1
          fi
          git worktree list
          test -f AGENTS.md
          tar --exclude='./.env' --exclude='./.env.production' --exclude='./.env.production.local' --exclude='./.env.local' \
            --exclude='./dist' --exclude='./.vercel' --exclude='./.supabase' \
            -czf /tmp/tok-instagram-validation-workspace.tar.gz .
          tar -czf /tmp/tok-sql-tools.tar.gz -C /tmp tok-sql-tools
          du -h /tmp/tok-instagram-validation-workspace.tar.gz /tmp/tok-sql-tools.tar.gz
      - name: Upload temporary validation workspace
        uses: actions/upload-artifact@v4
        with:
          name: tok-instagram-validation-workspace
          path: |
            /tmp/tok-instagram-validation-workspace.tar.gz
            /tmp/tok-sql-tools.tar.gz
            /tmp/tok-repository-paths.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
