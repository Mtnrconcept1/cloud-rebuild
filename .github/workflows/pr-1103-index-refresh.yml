name: PR 1103 canonical index refresh

on:
  push:
    branches:
      - agent/marketing-studio-service-tabs-20261106

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/marketing-studio-service-tabs-20261106
          fetch-depth: 1
          persist-credentials: true
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:application-index
      - name: Commit refreshed generated references and remove helper workflow
        run: |
          set -euo pipefail
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git rm -- .github/workflows/pr-1103-index-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): refresh application reference"
          git push origin HEAD:agent/marketing-studio-service-tabs-20261106
