name: Agent AutoPilot index regeneration (one shot)
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/tok-autopilot-daily-growth-repair-20261031' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate canonical index and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
          git rm -- .github/workflows/agent-autopilot-index-once.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git -c user.name="tok-ci-index" -c user.email="actions@users.noreply.github.com" commit -m "chore(marketing): refresh generated application index"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
