name: Signed consent validation bridge
on:
  pull_request:
    paths: ['.github/workflows/consent-confirmation.yml']
permissions:
  contents: read
concurrency:
  group: consent-confirmation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  regression:
    if: github.event.pull_request.number == 993
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['54322:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '54322'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      TOK_CONSENT_DISPOSABLE: 'true'
      TOK_TEST_EMAIL_CONFIRMATION: 'true'
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 52d9274831386997facc1e5870b0d036ce9bd05a
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Restore exact reviewed source with before and after SHA-256 checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          shas=['331205c265724a83659ee32d81926ddb99743357','ca7f5e8f50e4f5b7e8ab6415b27631c4d8124720','f400adc1be13496404e93c0f799ff5030d3ded2f','6056b580cc726583eb6525b8a6fa83656ae86519','f8a9d936eadb0ffc480d4549ef36f6dbf4c0bb9d','4983970770fbc4285d78be6c1893cf2da3d1ff7e']
          paths=[]
          for sha in shas:
            request=urllib.request.Request('https://api.github.com/repos/Mtnrconcept1/cloud-rebuild/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request,timeout=30) as response: data=json.load(response)
            raw=base64.b64decode(data['content'])
            assert hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()==sha
            for item in json.loads(raw):
              path=item['path']; assert not path.startswith('/') and '..' not in path and '.env' not in path
              assert path.startswith(('docs/superpowers/plans/','public/consentement-email.','scripts/test-commercial-consent-postgres.mjs','src/','supabase/')) and path not in paths
              original=pathlib.Path(path).read_bytes(); assert hashlib.sha256(original).hexdigest()==item['old'],path
              lines=original.decode().splitlines(keepends=True)
              for start,end,text in reversed(item['edits']): lines[start:end]=[text]
              updated=''.join(lines).encode(); assert hashlib.sha256(updated).hexdigest()==item['new'],path
              pathlib.Path(path).write_bytes(updated); paths.append(path)
          assert len(paths)==12
          wf='.github/workflows/consent-confirmation.yml'
          pathlib.Path(wf).write_bytes(subprocess.check_output(['git','show','52d9274831386997facc1e5870b0d036ce9bd05a:'+wf]))
          pathlib.Path(os.environ['RUNNER_TEMP']+'/signed-paths.json').write_text(json.dumps(paths))
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.9.6'
      - name: Check affected Edge imports
        env:
          DENO_NO_PACKAGE_JSON: '1'
          DENO_NO_UPDATE_CHECK: '1'
        run: |
          cp deno.lock "$RUNNER_TEMP/consent-edge.lock"
          deno check --no-config --node-modules-dir=none --lock="$RUNNER_TEMP/consent-edge.lock" supabase/functions/send-email/index.ts supabase/functions/commercial-consent-confirmation/index.ts
      - name: Prove the signature eligibility regression fails with the old implementation
        run: |
          migration=supabase/migrations/20261027221840_commercial_email_confirmation.sql
          cp "$migration" "$RUNNER_TEMP/signed-migration.sql"
          git show "52d9274831386997facc1e5870b0d036ce9bd05a:$migration" > "$migration"
          createdb consent_red
          if PGDATABASE=consent_red node scripts/test-commercial-consent-postgres.mjs > "$RUNNER_TEMP/consent-red.log" 2>&1; then
            echo 'Expected regression did not fail'; exit 1
          fi
          grep -F 'explicit signature grants email campaigns before mailbox approval' "$RUNNER_TEMP/consent-red.log"
          dropdb consent_red
          psql -X -v ON_ERROR_STOP=1 -c 'DROP ROLE anon; DROP ROLE authenticated; DROP ROLE service_role;'
          cp "$RUNNER_TEMP/signed-migration.sql" "$migration"
      - name: PostgreSQL17 permissions, transitions, history and concurrent workers
        run: node --test scripts/test-native-consent-history.test.mjs && node scripts/test-commercial-consent-postgres.mjs
      - name: Install frozen dependencies without write credentials
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate && pnpm install --frozen-lockfile
      - name: Generate final canonical references
        run: node scripts/generate-application-index.mjs && node scripts/generate-error-code-map.mjs
      - name: Regression tests, types, lint and build
        run: |
          pnpm exec vitest run src/test/commercial-email-consent.test.tsx src/test/commercial-email-consent-contract.test.ts src/test/commercial-consent-confirmation.test.ts src/test/commercial-consent-page.test.ts src/test/email-provider-reconciliation.test.ts src/test/marketing-consent-dispatch.test.ts src/test/admin-audit-log-narrative.test.ts src/test/application-search-index.test.ts
          pnpm typecheck && pnpm lint && pnpm build
          node scripts/generate-application-index.mjs --check
          git diff --check
      - name: Package only validated source and generated references
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shutil
          paths=json.loads(pathlib.Path(os.environ['RUNNER_TEMP']+'/signed-paths.json').read_text())+['docs/architecture/TOK_APPLICATION_REFERENCE.md','docs/architecture/tok-application-search-index.json','src/data/tok-user-guide-catalog.generated.ts']
          assert len(paths)==15
          for path in paths:
            target=pathlib.Path('validated')/path; target.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(path,target)
          pathlib.Path('validated/paths.json').write_text(json.dumps(paths))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-consent-validated
          path: validated
          retention-days: 3
  publish-validated-objects:
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-consent-validated
          path: validated
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Publish validated file objects only, never refs or commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';import {createHash} from 'node:crypto';
          const paths=JSON.parse(readFileSync('validated/paths.json','utf8'));if(paths.length!==15)throw new Error('Invalid manifest');
          for(const path of paths){
            if(path.startsWith('/')||path.includes('..')||path.includes('.env')||!path.match(/^(docs\/|public\/consentement-email\.|scripts\/test-commercial-consent-postgres.mjs|src\/|supabase\/)/))throw new Error('Invalid path');
            const bytes=readFileSync('validated/'+path);if(bytes.length>12000000)throw new Error('Invalid size');
            const expected=createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            const response=await fetch('https://api.github.com/repos/Mtnrconcept1/cloud-rebuild/git/blobs',{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content:bytes.toString('base64'),encoding:'base64'})});
            if(!response.ok)throw new Error('Object publication failed: '+response.status);const result=await response.json();if(result.sha!==expected)throw new Error('Integrity mismatch');console.log(JSON.stringify({path,sha:result.sha,size:bytes.length}));
          }
          JS
