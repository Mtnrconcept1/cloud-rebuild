name: Sync Cloudprinter Secrets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Cloudprinter mode to provision
        required: true
        default: sandbox
        type: choice
        options:
          - disabled
          - sandbox
          - live

permissions:
  contents: read

concurrency:
  group: sync-cloudprinter-secrets
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  SUPABASE_CLI_VERSION: 2.102.0
  SUPABASE_PROJECT_REF: wwcrtyoueexyxkkikaos

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64, cloud-rebuild-linux]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Validate requested provider mode and credentials
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDPRINTER_API_KEY: ${{ secrets.CLOUDPRINTER_API_KEY }}
          CLOUDPRINTER_WEBHOOK_API_KEY: ${{ secrets.CLOUDPRINTER_WEBHOOK_API_KEY }}
        run: |
          set -euo pipefail
          case "$MODE" in disabled|sandbox|live) ;; *) echo "::error::Invalid Cloudprinter mode"; exit 1 ;; esac
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          if [[ "$MODE" != "disabled" ]]; then
            test -n "$CLOUDPRINTER_API_KEY" || (echo "::error::Missing CLOUDPRINTER_API_KEY" && exit 1)
            test -n "$CLOUDPRINTER_WEBHOOK_API_KEY" || (echo "::error::Missing CLOUDPRINTER_WEBHOOK_API_KEY" && exit 1)
          fi

      - name: Write private Cloudprinter env file
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CLOUDPRINTER_API_KEY: ${{ secrets.CLOUDPRINTER_API_KEY }}
          CLOUDPRINTER_WEBHOOK_API_KEY: ${{ secrets.CLOUDPRINTER_WEBHOOK_API_KEY }}
          PRINT_SUPPORT_EMAIL: ${{ vars.PRINT_SUPPORT_EMAIL || 'support@thetok.ch' }}
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/cloudprinter.env"
          umask 077
          {
            printf 'CLOUDPRINTER_MODE=%s\n' "$MODE"
            printf 'PRINT_SUPPORT_EMAIL=%s\n' "$PRINT_SUPPORT_EMAIL"
            if [[ "$MODE" != "disabled" ]]; then
              printf 'CLOUDPRINTER_API_KEY=%s\n' "$CLOUDPRINTER_API_KEY"
              printf 'CLOUDPRINTER_WEBHOOK_API_KEY=%s\n' "$CLOUDPRINTER_WEBHOOK_API_KEY"
            fi
          } > "$file"
          chmod 600 "$file"

      - name: Sync Cloudprinter secrets to TheTok Supabase
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          pnpm dlx "supabase@${SUPABASE_CLI_VERSION}" secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --env-file "${RUNNER_TEMP}/cloudprinter.env"

      - name: Remove temporary secret file
        if: always()
        shell: bash
        run: rm -f -- "${RUNNER_TEMP}/cloudprinter.env"
