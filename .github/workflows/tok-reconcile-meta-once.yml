name: TOK reconcile applied Meta migration indexes (one time)
on:
  push:
    branches:
      - fix/reconcile-meta-oauth-migration-history-20261014
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref_name == 'fix/reconcile-meta-oauth-migration-history-20261014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Remove temporary workflow and regenerate canonical indexes
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tok-reconcile-meta-once.yml
          pnpm run docs:application-index
          pnpm run generate:error-code-map
          pnpm run docs:application-index:check
      - name: Commit generated references
        shell: bash
        run: |
          set -euo pipefail
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts supabase/functions/_shared/error-code-map.ts
          git diff --cached --check
          git config user.name "TOK generated-files bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): index applied Meta migration on current main"
          git push origin HEAD:fix/reconcile-meta-oauth-migration-history-20261014
