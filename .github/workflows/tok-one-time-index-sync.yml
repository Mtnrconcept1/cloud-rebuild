name: TOK one-time generated index repair
on:
  push:
    branches:
      - feat/tok-central-openai-cost-controls-20261014
    paths:
      - .github/workflows/tok-one-time-index-sync.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/feat/tok-central-openai-cost-controls-20261014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tok-central-openai-cost-controls-20261014
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove helper, regenerate and commit tracked artifacts
        run: |
          set -euo pipefail
          git rm -- .github/workflows/tok-one-time-index-sync.yml
          pnpm docs:application-index
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): synchronize generated TOK application index"
          git push origin HEAD:refs/heads/feat/tok-central-openai-cost-controls-20261014
