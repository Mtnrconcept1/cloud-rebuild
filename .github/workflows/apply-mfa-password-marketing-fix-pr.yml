name: Apply MFA password and marketing fix from PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mfa-password-and-marketing-login'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mfa-password-and-marketing-login
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the reviewed patch embedded in the staged workflow
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-mfa-password-marketing-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format modified sources"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          patch_code = textwrap.dedent(source[start:end])
          compile(patch_code, 'embedded-mfa-password-marketing-fix.py', 'exec')
          exec(patch_code, {'__name__': '__main__'})
          PY

      - name: Format modified sources
        run: >-
          pnpm dlx prettier@3.6.2 --write
          src/components/auth/AccountPasswordForm.tsx
          server/marketingBff.ts
          src/test/password-recovery-routing.test.ts
          src/test/marketing-bff-security.test.ts

      - name: Run focused tests
        run: >-
          pnpm exec vitest run --mode production
          src/test/password-recovery-routing.test.ts
          src/test/marketing-bff-security.test.ts
          src/test/marketing-bff-client.test.ts
          src/test/auth-signup-form.test.tsx

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build:prod

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- \
            public/sitemap-actualites.xml \
            public/sitemap-pages.xml \
            public/sitemap-restaurants.xml

          rm -f \
            .github/workflows/apply-mfa-password-marketing-fix.yml \
            .github/workflows/apply-mfa-password-marketing-fix-pr.yml \
            tmp/trigger-mfa-password-marketing-fix.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/auth/AccountPasswordForm.tsx \
            server/marketingBff.ts \
            src/test/password-recovery-routing.test.ts \
            src/test/marketing-bff-security.test.ts
          git add -u \
            .github/workflows/apply-mfa-password-marketing-fix.yml \
            .github/workflows/apply-mfa-password-marketing-fix-pr.yml \
            tmp/trigger-mfa-password-marketing-fix.txt

          git diff --cached --check
          if git diff --cached | grep -Eiq '(sk-proj-|sk-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|whsec_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})'; then
            echo "::error::A secret-like value was detected in the final diff."
            exit 1
          fi

          git commit -m "fix(auth): handle MFA password updates and marketing enrollment"
          git push origin HEAD:fix/mfa-password-and-marketing-login
