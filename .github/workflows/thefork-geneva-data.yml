name: TheFork Geneva data extraction

on:
  push:
    branches:
      - data/thefork-geneva-enrichment-20260724
    paths:
      - scripts/data/thefork_probe.py
      - scripts/data/thefork_geneva_extract.py
      - data/thefork/**
      - .github/workflows/thefork-geneva-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/data/thefork_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thefork-geneva-probe
          path: artifacts/thefork-probe
          if-no-files-found: error
          retention-days: 1
