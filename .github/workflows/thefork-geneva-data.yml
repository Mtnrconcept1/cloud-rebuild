name: TheFork Geneva data extraction

on:
  push:
    branches:
      - data/thefork-geneva-enrichment-20260724
    paths:
      - scripts/data/thefork_probe.py
      - scripts/data/thefork_geneva_search_index.py
      - scripts/data/thefork_geneva_matrix_plan.py
      - scripts/data/thefork_geneva_search_one.py
      - scripts/data/thefork_geneva_matrix_aggregate.py
      - scripts/data/thefork_geneva_extract.py
      - data/thefork/**
      - .github/workflows/thefork-geneva-data.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/data/thefork_probe.py
      - scripts/data/thefork_geneva_search_index.py
      - scripts/data/thefork_geneva_matrix_plan.py
      - scripts/data/thefork_geneva_search_one.py
      - scripts/data/thefork_geneva_matrix_aggregate.py
      - scripts/data/thefork_geneva_extract.py
      - data/thefork/**
      - .github/workflows/thefork-geneva-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/data/thefork_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thefork-geneva-probe
          path: artifacts/thefork-probe
          if-no-files-found: error
          retention-days: 1

  search-index:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/data/thefork_geneva_search_index.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thefork-geneva-search-index
          path: artifacts/thefork-geneva-search-index
          if-no-files-found: error
          retention-days: 1

  matrix-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/data/thefork_geneva_matrix_plan.py
      - id: matrix
        shell: bash
        run: echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  matrix-search:
    needs: matrix-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix: ${{ fromJSON(needs.matrix-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Search one query page
        env:
          TF_ITEM_ID: ${{ matrix.id }}
          TF_QUERY: ${{ matrix.query }}
          TF_OFFSET: ${{ matrix.offset }}
        run: python scripts/data/thefork_geneva_search_one.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thefork-matrix-${{ matrix.id }}
          path: artifacts/thefork-geneva-matrix/${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 1

  matrix-aggregate:
    needs: matrix-search
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: thefork-matrix-*
          path: artifacts/thefork-geneva-matrix/raw
          merge-multiple: true
      - run: python scripts/data/thefork_geneva_matrix_aggregate.py
      - uses: actions/upload-artifact@v4
        with:
          name: thefork-geneva-matrix-result
          path: artifacts/thefork-geneva-matrix-result
          if-no-files-found: error
          retention-days: 1
