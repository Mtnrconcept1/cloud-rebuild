name: Apply iOS App Icon Fix

on:
  push:
    branches:
      - fix/ios-app-icon-appearance
    paths:
      - ios/.apply-app-icon-fix-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ios-app-icon-fix
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/ios-app-icon-appearance
          fetch-depth: 2

      - name: Guard one-shot trigger
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          parent="${GITHUB_SHA}^"
          git cat-file -e "$parent"
          if ! git diff --name-status "$parent" "$GITHUB_SHA" | grep -Eq '^A[[:space:]]+ios/\.apply-app-icon-fix-v1$'; then
            echo "::error::The app icon fix marker must be added exactly once."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Generate iOS app icon variants
        run: python ./scripts/generate-ios-app-icon.py

      - name: Verify generated icon metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          import json
          from pathlib import Path

          root = Path('ios/App/App/Assets.xcassets/AppIcon.appiconset')
          contents = json.loads((root / 'Contents.json').read_text(encoding='utf-8'))
          expected = {
              'AppIcon-512@2x.png',
              'AppIcon-512@2x-dark.png',
              'AppIcon-512@2x-tinted.png',
          }
          actual = {item.get('filename') for item in contents.get('images', [])}
          if actual != expected:
              raise SystemExit(f'Unexpected app icon entries: {actual}')

          default = Image.open(root / 'AppIcon-512@2x.png')
          dark = Image.open(root / 'AppIcon-512@2x-dark.png')
          tinted = Image.open(root / 'AppIcon-512@2x-tinted.png')
          if default.size != (1024, 1024) or default.mode != 'RGB':
              raise SystemExit(f'Default icon invalid: size={default.size}, mode={default.mode}')
          if dark.size != (1024, 1024) or dark.mode != 'RGBA':
              raise SystemExit(f'Dark icon invalid: size={dark.size}, mode={dark.mode}')
          if tinted.size != (1024, 1024) or tinted.mode != 'RGBA':
              raise SystemExit(f'Tinted icon invalid: size={tinted.size}, mode={tinted.mode}')
          print('Generated icon variants are structurally valid.')
          PY
          git diff --check
          git status --short

      - name: Commit generated icon assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x-dark.png \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x-tinted.png \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          git commit -m "fix(ios): enlarge TOK app icon and define appearance variants"
          git push origin HEAD:fix/ios-app-icon-appearance
