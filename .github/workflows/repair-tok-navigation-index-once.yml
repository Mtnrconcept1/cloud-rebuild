name: TOK navigation index repair (temporary)
on:
  push:
    branches:
      - fix/navigation-seo-flash-swipe-20261028
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.head_commit.message == 'merge(navigation): sync main and repair index'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/navigation-seo-flash-swipe-20261028
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Regenerate canonical index on the final combined source tree
        run: |
          set -euo pipefail
          git rm -- .github/workflows/repair-tok-navigation-index-once.yml
          pnpm run docs:application-index
          pnpm run docs:application-index:check
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(navigation): regenerate index after syncing main"
          git push origin HEAD:refs/heads/fix/navigation-seo-flash-swipe-20261028
