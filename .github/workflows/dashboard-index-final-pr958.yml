name: Finalize TOK dashboard index PR 958
on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/dashboard-index-final-pr958.yml
permissions:
  contents: read
jobs:
  regenerate:
    if: >-
      github.repository == 'Mtnrconcept1/cloud-rebuild' &&
      github.event.pull_request.number == 958 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/dashboard-final-integration-20261022' &&
      github.actor == 'mtnrconcept'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out trusted branch HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
      - name: Regenerate against final staged Git tree
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/dashboard-index-final-pr958.yml
          git add -u -- .github/workflows/dashboard-index-final-pr958.yml
          pnpm docs:application-index
          git diff --check
          pnpm docs:application-index:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --quiet && exit 0
          git commit -m "docs(dashboards): refresh index against final Git tree"
          git push origin HEAD:refs/heads/codex/dashboard-final-integration-20261022
