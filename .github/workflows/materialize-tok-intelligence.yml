name: Materialize TOK Intelligence Suite

on:
  push:
    branches:
      - feat/tok-intelligence-suite-7-8-10-11

permissions:
  contents: write

concurrency:
  group: tok-intelligence-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[materialize-tok-intelligence]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
      VITE_SUPABASE_PROJECT_ID: ci-placeholder

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .tok-intelligence-payload.part* | base64 --decode > /tmp/tok-intelligence-payload.tar.xz
          echo "110d5cc82596636af1e1f3b784cfe7be9fbdc407c704059922f29b51a93999ec  /tmp/tok-intelligence-payload.tar.xz" | sha256sum --check -
          tar -xJf /tmp/tok-intelligence-payload.tar.xz
          python3 scripts/materialize-tok-intelligence.py

      - name: Remove one-time materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tok-intelligence-payload.part*
          rm -f scripts/materialize-tok-intelligence.py
          rm -f .github/workflows/materialize-tok-intelligence.yml

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Contract tests
        run: pnpm exec vitest run src/test/tok-intelligence-suite.test.ts

      - name: Production-compatible build
        run: pnpm build

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes to commit."
            exit 1
          fi
          git commit -m "feat(ai): matérialiser les agents et interfaces TOK Intelligence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
