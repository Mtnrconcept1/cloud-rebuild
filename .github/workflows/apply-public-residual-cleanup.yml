name: Apply public residual cleanup

on:
  push:
    branches: [fix/legal-flat10-pickup-only]
    paths: [.github/workflows/apply-public-residual-cleanup.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/legal-flat10-pickup-only
          fetch-depth: 0
      - name: Apply residual cleanup
        run: python scripts/apply-public-residual-cleanup.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(copy): remove remaining public delivery and internal references"
          git push origin HEAD:fix/legal-flat10-pickup-only
