name: Temporary reviewed TOK production deploy dispatcher

on:
  push:
    branches:
      - codex/tok-production-release-dispatch-20261017

permissions:
  contents: write
  actions: write

concurrency:
  group: tok-production-dispatch-20261017
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production target and dispatch only reviewed main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_PRODUCTION_SHA: 2dfec3459035d79a2eb96103e365242b2e670f28
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Mtnrconcept1/cloud-rebuild"
          test "$GITHUB_REF" = "refs/heads/codex/tok-production-release-dispatch-20261017"
          head_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [[ "$head_sha" != "$EXPECTED_PRODUCTION_SHA" ]]; then
            echo "::error::main changed since payment patch review: refusing release"
            exit 1
          fi
          gh workflow run deploy-production.yml --repo "$GH_REPO" --ref main
          echo "Dispatched existing protected production workflow on reviewed main commit."

      - name: Checkout temporary branch for safe cleanup
        uses: actions/checkout@v6
        with:
          ref: codex/tok-production-release-dispatch-20261017
          persist-credentials: true

      - name: Delete only this temporary dispatcher after dispatch
        env:
          EXPECTED_DISPATCH_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DISPATCH_COMMIT"
          test "$(git branch --show-current)" = "codex/tok-production-release-dispatch-20261017"
          git rm .github/workflows/tok-temporary-production-release-dispatch-20261017.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove temporary production workflow dispatcher"
          git push origin HEAD:refs/heads/codex/tok-production-release-dispatch-20261017
