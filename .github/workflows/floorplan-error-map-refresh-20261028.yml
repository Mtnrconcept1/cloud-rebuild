name: Temporary floorplan error-map refresh
on:
  push:
    branches:
      - fix/floorplan-contain-ai-auth-20261028
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate and validate diagnostics in the final tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/floorplan-error-map-refresh-20261028.yml
          git add -u .github/workflows/floorplan-error-map-refresh-20261028.yml
          pnpm run generate:error-code-map
          pnpm run docs:application-index
          pnpm run docs:application-index:check
          git add supabase/functions/_shared/error-code-map.ts docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(floorplan): refresh generated diagnostic and application indexes'
          git push origin HEAD:fix/floorplan-contain-ai-auth-20261028
