name: Temporary TOK homepage asset and index repair
on:
  push:
    branches:
      - codex/tok-home-leman-reference-v2
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Optimize homepage image and update references
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          old=Path("public/images/home/tok-leman-signature.png")
          new=Path("public/images/home/tok-leman-signature.webp")
          with Image.open(old) as image:
              image.convert("RGB").save(new, format="WEBP", quality=86, method=6)
          assert new.stat().st_size < 400_000, new.stat().st_size
          for name in ("src/components/home/HeroSection.tsx", "src/components/home/HeroSection.css", "src/test/home-hero-search.test.tsx"):
              p=Path(name)
              data=p.read_text(encoding="utf-8")
              assert "tok-leman-signature.png" in data, name
              p.write_text(data.replace("tok-leman-signature.png", "tok-leman-signature.webp"), encoding="utf-8")
          print("WebP generated:", new.stat().st_size, "bytes")
          PY
          git rm public/images/home/tok-leman-signature.png
          git add public/images/home/tok-leman-signature.webp src/components/home/HeroSection.tsx src/components/home/HeroSection.css src/test/home-hero-search.test.tsx
      - name: Remove this one-off workflow before indexing
        run: git rm .github/workflows/tok-home-artifacts-temp.yml
      - name: Rebuild canonical application reference
        run: |
          pnpm docs:application-index
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          pnpm docs:application-index:check
          git diff --cached --check
      - name: Commit generated assets and docs on the PR branch only
        run: |
          test "${GITHUB_REF_NAME}" = "codex/tok-home-leman-reference-v2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(home): optimiser le visuel et actualiser l’index documentaire"
          git push origin HEAD:codex/tok-home-leman-reference-v2
