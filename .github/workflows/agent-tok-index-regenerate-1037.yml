name: TOK temporary canonical index sync PR 1037

on:
  push:
    branches:
      - agent/tok-saturn-loader-20261029
    paths:
      - .github/workflows/agent-tok-index-regenerate-1037.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild' && github.ref == 'refs/heads/agent/tok-saturn-loader-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dedicated feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/tok-saturn-loader-20261029
          fetch-depth: 1
          persist-credentials: true
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh canonical index and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/agent-tok-index-regenerate-1037.yml
          pnpm run docs:application-index
          pnpm run docs:application-index:check
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): refresh TOK application index on loader branch"
          git push origin HEAD:refs/heads/agent/tok-saturn-loader-20261029