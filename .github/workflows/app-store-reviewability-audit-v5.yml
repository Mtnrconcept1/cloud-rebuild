name: App Store Reviewability Audit v5

on:
  push:
    branches:
      - chore/appstore-reviewability-audit-v5
    paths:
      - scripts/app-store-reviewability-audit-v5.mjs
      - .github/workflows/app-store-reviewability-audit-v5.yml

permissions:
  contents: read

jobs:
  audit:
    name: Read App Store reviewability state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: app-store-production
    env:
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate
        run: node --check ./scripts/app-store-reviewability-audit-v5.mjs

      - name: Read Apple state
        run: node ./scripts/app-store-reviewability-audit-v5.mjs

      - name: Inspect official Apple OpenAPI schemas
        shell: bash
        run: |
          set -euo pipefail
          spec_zip="${RUNNER_TEMP}/app-store-connect-openapi.zip"
          spec_json="${RUNNER_TEMP}/app-store-connect-openapi.json"
          curl --fail --silent --show-error \
            "https://developer.apple.com/sample-code/app-store-connect/app-store-connect-openapi-specification.zip" \
            -o "$spec_zip"
          entry="$(unzip -Z1 "$spec_zip" | head -n 1)"
          unzip -p "$spec_zip" "$entry" > "$spec_json"
          node - "$spec_json" <<'NODE'
          const fs = require('node:fs');
          const spec = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const schemas = spec.components?.schemas || {};
          const names = [
            'AppAvailabilityV2CreateRequest',
            'TerritoryAvailabilityInlineCreate',
            'ReviewSubmissionUpdateRequest',
            'ReviewSubmissionItemCreateRequest',
            'AppStoreVersionSubmissionCreateRequest',
          ];
          for (const name of names) {
            console.log(`OPENAPI_SCHEMA ${name} ${JSON.stringify(schemas[name] || null)}`);
          }
          const privacyPaths = Object.keys(spec.paths || {}).filter((path) => path.toLowerCase().includes('privacy'));
          const privacySchemas = Object.keys(schemas).filter((name) => name.toLowerCase().includes('privacy'));
          console.log(`OPENAPI_PRIVACY_PATHS ${JSON.stringify(privacyPaths)}`);
          console.log(`OPENAPI_PRIVACY_SCHEMAS ${JSON.stringify(privacySchemas)}`);
          NODE
          rm -f -- "$spec_zip" "$spec_json"
