name: Publish validated PR 768 cuisine repair

on:
  push:
    branches: [codex/cuisine-768-repair-runner-20261011]
    paths: [.github/workflows/codex-cuisine-768-repair-runner.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: codex-cuisine-768-repair
  cancel-in-progress: false

env:
  TARGET_SHA: 09e289d3f88a598891e7bb1f895089ac6474f6d6
  OUTPUT_BRANCH: codex/cuisine-768-validated-output-20261011
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable product PR head
        uses: actions/checkout@v6
        with:
          ref: 09e289d3f88a598891e7bb1f895089ac6474f6d6
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect and create dedicated worktree
        shell: bash
        run: |
          set -euo pipefail
          git status --short --branch
          git branch --show-current
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          cat AGENTS.md
          git worktree add -b "$OUTPUT_BRANCH" "$RUNNER_TEMP/tok-cuisine-worktree" "$TARGET_SHA"
          echo "WORKTREE=$RUNNER_TEMP/tok-cuisine-worktree" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/publish-evidence"
          echo "EVIDENCE=$RUNNER_TEMP/publish-evidence" >> "$GITHUB_ENV"

      - name: Retrieve exact repair already tested in run 38153712799
        uses: actions/download-artifact@v4
        with:
          name: tok-cuisine-768-repair-evidence
          run-id: 38153712799
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-evidence

      - name: Restore verified patch without changing its bytes
        working-directory: ${{ env.WORKTREE }}
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/previous-evidence/repair.patch"
          echo "e11c391c9becf5a000fc9e260d79c94ead82b9bc1ceaa4e9a4508ee7b4c55c79  $patch" | sha256sum --check --strict
          git apply --check --index "$patch"
          git apply --index "$patch"
          git diff --cached --binary --full-index > "$EVIDENCE/restored.patch"
          cmp "$patch" "$EVIDENCE/restored.patch"
          git diff --cached --check
          git diff --cached --name-only | tee "$EVIDENCE/repair-files.txt"
          test "$(wc -l < "$EVIDENCE/repair-files.txt")" -eq 33
          while IFS= read -r path; do
            case "$path" in
              public/images/miniatures/*.webp|docs/architecture/TOK_APPLICATION_REFERENCE.md|docs/architecture/tok-application-search-index.json) ;;
              *) echo "Unexpected repair file: $path"; exit 1 ;;
            esac
          done < "$EVIDENCE/repair-files.txt"
          git diff --exit-code
          git status --short --branch

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install locked dependencies
        working-directory: ${{ env.WORKTREE }}
        run: pnpm install --frozen-lockfile

      - name: Recheck targeted tests and generated index on restored bytes
        working-directory: ${{ env.WORKTREE }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run --mode production src/test/home-cuisine-accessibility.test.tsx src/test/home-core-web-vitals.test.ts src/test/seo-performance-remediation.test.ts 2>&1 | tee "$EVIDENCE/targeted-tests.log"
          pnpm docs:application-index:check 2>&1 | tee "$EVIDENCE/index-check.log"
          git diff --exit-code
          git diff --cached --binary --full-index | cmp - "$RUNNER_TEMP/previous-evidence/repair.patch"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Publish only isolated output branch with explicit worktree authentication
        working-directory: ${{ env.WORKTREE }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$OUTPUT_BRANCH"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          actual_head="$(gh api repos/Mtnrconcept1/cloud-rebuild/git/ref/heads/codex/cuisine-category-cards-bold-20261011 --jq .object.sha)"
          test "$actual_head" = "$TARGET_SHA"
          git diff --exit-code
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(home): keep cuisine thumbnails within budget and refresh application index'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          unset auth_header
          printf 'VALIDATED_COMMIT=%s\nVALIDATED_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee "$EVIDENCE/git-result.txt"
          git status --short --branch
          test -z "$(git status --porcelain)"
          cat "$EVIDENCE/git-result.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Package complete changed files and verification evidence
        working-directory: ${{ env.WORKTREE }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/complete-files"
          { cat "$EVIDENCE/repair-files.txt"; printf '%s\n' src/components/home/CuisineCategoryStrip.tsx src/test/home-cuisine-accessibility.test.tsx; } | sort -u > "$EVIDENCE/all-product-files.txt"
          test "$(wc -l < "$EVIDENCE/all-product-files.txt")" -eq 35
          while IFS= read -r path; do
            mkdir -p "$EVIDENCE/complete-files/$(dirname "$path")"
            cp "$path" "$EVIDENCE/complete-files/$path"
          done < "$EVIDENCE/all-product-files.txt"
          cp "$RUNNER_TEMP/previous-evidence/image-report.json" "$RUNNER_TEMP/previous-evidence/browser-report.json" "$EVIDENCE/"
          cp "$RUNNER_TEMP/previous-evidence/full-tests.log" "$RUNNER_TEMP/previous-evidence/lint.log" "$RUNNER_TEMP/previous-evidence/typecheck.log" "$RUNNER_TEMP/previous-evidence/build.log" "$EVIDENCE/"
          (cd "$EVIDENCE/complete-files" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$EVIDENCE/complete-files-sha256.txt"

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tok-cuisine-768-published-evidence
          path: ${{ runner.temp }}/publish-evidence
          retention-days: 7
          if-no-files-found: error
