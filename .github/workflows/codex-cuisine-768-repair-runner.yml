name: Reconcile PR 768 with current main

on:
  push:
    branches: [codex/cuisine-768-repair-runner-20261011]
    paths: [.github/workflows/codex-cuisine-768-repair-runner.yml]

permissions:
  contents: write

concurrency:
  group: codex-cuisine-768-repair
  cancel-in-progress: false

env:
  TARGET_SHA: 6fe6c753bd5e014c082a8b2e3749dd5cb82a10fe
  CURRENT_MAIN: ab5e40bc03c019b80011feecf973ca8f7a895059
  OUTPUT_BRANCH: codex/cuisine-768-synced-output-20261011
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable cuisine PR head
        uses: actions/checkout@v6
        with:
          ref: 6fe6c753bd5e014c082a8b2e3749dd5cb82a10fe
          fetch-depth: 6
          persist-credentials: false

      - name: Fetch and inspect actual current main, create dedicated worktree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short --branch
          git branch --show-current
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          test "$(gh api repos/Mtnrconcept1/cloud-rebuild/git/ref/heads/main --jq .object.sha)" = "$CURRENT_MAIN"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" fetch --no-tags --depth=6 origin "$CURRENT_MAIN"
          unset auth_header
          git log -3 --oneline "$CURRENT_MAIN"
          cat AGENTS.md
          git worktree add -b "$OUTPUT_BRANCH" "$RUNNER_TEMP/tok-cuisine-worktree" "$TARGET_SHA"
          echo "WORKTREE=$RUNNER_TEMP/tok-cuisine-worktree" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/reconcile-evidence"
          echo "EVIDENCE=$RUNNER_TEMP/reconcile-evidence" >> "$GITHUB_ENV"

      - name: Merge current main, preserve its images and regenerate rather than hand-edit indexes
        working-directory: ${{ env.WORKTREE }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff "$CURRENT_MAIN" > "$EVIDENCE/merge.log" 2>&1
          merge_status=$?
          set -e
          cat "$EVIDENCE/merge.log"
          test "$merge_status" -le 1
          test "$(git rev-parse MERGE_HEAD)" = "$CURRENT_MAIN"
          git diff --name-only --diff-filter=U | tee "$EVIDENCE/conflicts.txt"
          while IFS= read -r path; do
            case "$path" in
              public/images/miniatures/*.webp|docs/architecture/TOK_APPLICATION_REFERENCE.md|docs/architecture/tok-application-search-index.json) ;;
              '') ;;
              *) echo "Unexpected concurrent change: $path"; exit 1 ;;
            esac
          done < "$EVIDENCE/conflicts.txt"
          git restore --source="$CURRENT_MAIN" --staged --worktree -- public/images/miniatures docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --exit-code "$CURRENT_MAIN" -- public/images/miniatures
          git diff --exit-code "$TARGET_SHA" -- src/components/home/CuisineCategoryStrip.tsx src/test/home-cuisine-accessibility.test.tsx

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install locked dependencies
        working-directory: ${{ env.WORKTREE }}
        run: pnpm install --frozen-lockfile

      - name: Regenerate indexes and validate final scoped diff
        working-directory: ${{ env.WORKTREE }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:application-index
          pnpm docs:application-index:check | tee "$EVIDENCE/index-check.log"
          git add -- docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          git diff --check
          git diff --cached --check
          git diff --name-only "$CURRENT_MAIN" | tee "$EVIDENCE/final-product-files.txt"
          test "$(wc -l < "$EVIDENCE/final-product-files.txt")" -eq 4
          while IFS= read -r path; do
            case "$path" in
              src/components/home/CuisineCategoryStrip.tsx|src/test/home-cuisine-accessibility.test.tsx|docs/architecture/TOK_APPLICATION_REFERENCE.md|docs/architecture/tok-application-search-index.json) ;;
              *) echo "Unexpected product file: $path"; exit 1 ;;
            esac
          done < "$EVIDENCE/final-product-files.txt"
          git diff --binary --full-index "$CURRENT_MAIN" > "$EVIDENCE/final-product.patch"

      - name: Targeted tests against reconciled current main
        working-directory: ${{ env.WORKTREE }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run --mode production src/test/home-cuisine-accessibility.test.tsx src/test/home-core-web-vitals.test.ts src/test/seo-performance-remediation.test.ts 2>&1 | tee "$EVIDENCE/targeted-tests.log"
          pnpm exec eslint src/components/home/CuisineCategoryStrip.tsx src/test/home-cuisine-accessibility.test.tsx 2>&1 | tee "$EVIDENCE/lint-targeted.log"
          pnpm typecheck 2>&1 | tee "$EVIDENCE/typecheck.log"

      - name: Commit and publish reconciled worktree only after validation
        working-directory: ${{ env.WORKTREE }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$OUTPUT_BRANCH"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api repos/Mtnrconcept1/cloud-rebuild/git/ref/heads/main --jq .object.sha)" = "$CURRENT_MAIN"
          test "$(gh api repos/Mtnrconcept1/cloud-rebuild/git/ref/heads/codex/cuisine-category-cards-bold-20261011 --jq .object.sha)" = "$TARGET_SHA"
          git diff --exit-code
          git diff --cached --check
          test -z "$(git ls-files --others --exclude-standard)"
          pnpm docs:application-index:check
          git commit -m 'chore(home): reconcile cuisine cards with concurrent main asset optimization'
          git diff --name-only "$CURRENT_MAIN" HEAD | cmp - "$EVIDENCE/final-product-files.txt"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          unset auth_header
          printf 'VALIDATED_COMMIT=%s\nVALIDATED_TREE=%s\nBASE_SHA=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$CURRENT_MAIN" | tee "$EVIDENCE/git-result.txt"
          test -z "$(git status --porcelain)"
          mkdir -p "$EVIDENCE/complete-files"
          while IFS= read -r path; do
            mkdir -p "$EVIDENCE/complete-files/$(dirname "$path")"
            cp "$path" "$EVIDENCE/complete-files/$path"
          done < "$EVIDENCE/final-product-files.txt"
          (cd "$EVIDENCE/complete-files" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$EVIDENCE/complete-files-sha256.txt"
          cat "$EVIDENCE/git-result.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tok-cuisine-768-final-evidence
          path: ${{ runner.temp }}/reconcile-evidence
          retention-days: 7
          if-no-files-found: error
