name: Workforce Source Index Review
on:
  push:
    branches: [feat/tok-workforce-clock-employee-portal-20261014]
    paths: [.github/workflows/tok-workforce-index-review.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - run: git rm -- .github/workflows/tok-workforce-index-review.yml
      - run: pnpm docs:application-index
      - run: pnpm docs:application-index:check
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs/architecture src/data/tok-user-guide-catalog.generated.ts
          git commit -m 'docs: refresh workforce source index after review'
          git push origin HEAD:refs/heads/feat/tok-workforce-clock-employee-portal-20261014
