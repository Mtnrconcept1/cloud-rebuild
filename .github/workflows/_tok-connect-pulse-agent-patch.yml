name: TOK Connect Pulse Agent Patch

on:
  push:
    branches:
      - work/tok-connect-mcp-pulse-widget-20260903

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tok-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: work/tok-connect-mcp-pulse-widget-20260903

      - name: Clean historical MCP merge marker
        run: node scripts/_clean-tok-connect-mcp-conflict.mjs

      - name: Apply deterministic TOK Connect and Pulse patch
        run: node scripts/_apply-tok-connect-pulse-finalization.mjs

      - name: Restore workflow files handled by the GitHub connector
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- \
            .github/workflows/_tok-connect-pulse-agent-patch.yml \
            .github/workflows/app-store-release.yml \
            .github/workflows/ios-native-validation.yml

      - name: Validate generated configuration
        shell: bash
        run: |
          set -euo pipefail
          node -e 'JSON.parse(require("fs").readFileSync("vercel.json","utf8")); console.log("vercel.json ok")'
          grep -q 'TokPulseWidget.appex' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'functions/v1/tok-connect-chatgpt' vercel.json
          grep -q '\[functions.tok-connect-chatgpt\]' supabase/config.toml
          grep -q '\[functions.tok-pulse-widget\]' supabase/config.toml
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' supabase/functions/tok-connect-mcp/index.ts

      - name: Commit generated changes back to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mtnrconcept"
          git config user.email "149347251+mtnrconcept@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(tok): finaliser MCP ChatGPT et widget Pulse [tok-finalized]"
          git push origin HEAD:work/tok-connect-mcp-pulse-widget-20260903
