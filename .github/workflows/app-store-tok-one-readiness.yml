name: App Store Tok One Readiness

on:
  push:
    branches:
      - ops/app-store-tok-one-readiness
    paths:
      - ios/.appstore-tok-one-readiness-v7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-tok-one-readiness
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: app-store-production
    env:
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ops/app-store-tok-one-readiness
          fetch-depth: 2

      - name: Guard one-shot trigger
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          parent="${GITHUB_SHA}^"
          git cat-file -e "$parent"
          if ! git diff --name-status "$parent" "$GITHUB_SHA" | grep -Eq '^A[[:space:]]+ios/\.appstore-tok-one-readiness-v7$'; then
            echo "::error::Build 4 audit must be triggered by adding its v7 marker exactly once."
            exit 1
          fi

      - name: Validate build audit
        run: node --check ./scripts/app-store-build4-audit.mjs

      - name: Audit processed build 4 and review state
        run: node ./scripts/app-store-build4-audit.mjs
