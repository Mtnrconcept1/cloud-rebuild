name: App Store Tok One Readiness

on:
  push:
    branches:
      - ops/app-store-tok-one-readiness
    paths:
      - ios/.appstore-tok-one-readiness-v9
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-tok-one-readiness
  cancel-in-progress: false

jobs:
  complete-annual-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: app-store-production
    env:
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ops/app-store-tok-one-readiness
          fetch-depth: 2

      - name: Guard one-shot trigger
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          parent="${GITHUB_SHA}^"
          git cat-file -e "$parent"
          if ! git diff --name-status "$parent" "$GITHUB_SHA" | grep -Eq '^A[[:space:]]+ios/\.appstore-tok-one-readiness-v9$'; then
            echo "::error::Annual Tok One metadata completion must be triggered by adding its v9 marker exactly once."
            exit 1
          fi

      - name: Validate uploader and asset archive
        shell: bash
        run: |
          set -euo pipefail
          node --check ./scripts/app-store-yearly-review-screenshot.mjs
          test -s ./ios/TheTok_AppStore_Final_Assets.zip
          unzip -tq ./ios/TheTok_AppStore_Final_Assets.zip

      - name: Extract Tok One review screenshot
        shell: bash
        run: |
          set -euo pipefail
          asset_root="${RUNNER_TEMP}/thetok-appstore-assets"
          rm -rf "$asset_root"
          mkdir -p "$asset_root"
          unzip -q ./ios/TheTok_AppStore_Final_Assets.zip -d "$asset_root"
          screenshot="$asset_root/iPhone_6.9_1320x2868/10_10_abonnement_tok_one.jpg"
          test -s "$screenshot"
          echo "TOK_ONE_REVIEW_SCREENSHOT_PATH=$screenshot" >> "$GITHUB_ENV"

      - name: Upload annual Review Information screenshot
        run: node ./scripts/app-store-yearly-review-screenshot.mjs
