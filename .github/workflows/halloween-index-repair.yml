name: Temporary Halloween index regeneration
on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/halloween-index-repair.yml"
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/halloween-immersive-hero-canopy-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the isolated feature branch (not main)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure commit author and integrate current main into this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git branch --show-current)" = 'agent/halloween-immersive-hero-canopy-20261030'
          git fetch --no-tags origin main
          git merge --no-edit origin/main
          # Restore the reviewed clean Halloween unit test without the temporary diagnostics.
          git show b5e86360a61d74d8068b9ca7c3792b5b18d13efe:src/test/halloween-seasonal-theme.test.tsx > src/test/halloween-seasonal-theme.test.tsx
          # Remove this single-use workflow *before* calculating the repository index.
          git rm -- .github/workflows/halloween-index-repair.yml
      - name: Enable project package manager
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate and verify the canonical application index
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:application-index
          pnpm docs:application-index:check
      - name: Commit only the repaired artifacts, cleaned test and removal of this helper
        shell: bash
        env:
          TARGET_BRANCH: agent/halloween-immersive-hero-canopy-20261030
        run: |
          set -euo pipefail
          git add -u --             .github/workflows/halloween-index-repair.yml             src/test/halloween-seasonal-theme.test.tsx             docs/architecture/TOK_APPLICATION_REFERENCE.md             docs/architecture/tok-application-search-index.json             src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'chore(halloween): remove diagnostic and regenerate canonical index'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
