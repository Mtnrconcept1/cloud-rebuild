name: Temporary TOK Connect canonical index sync
on:
  push:
    branches: [codex/tok-connect-client-transactions-20261015]
    paths: [.github/workflows/tok-connect-index-sync-tmp.yml]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/codex/tok-connect-client-transactions-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:application-index
      - name: Commit generated index only to this branch
        run: |
          set -euo pipefail
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): refresh TOK Connect application index"
          git push origin "HEAD:refs/heads/codex/tok-connect-client-transactions-20261015"
