name: TOK one-time AI branch build validation
on:
  push:
    branches:
      - feat/tok-central-openai-cost-controls-20261014
    paths:
      - .github/workflows/tok-one-time-ai-validation.yml
permissions:
  contents: write
env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder
jobs:
  validate-build:
    if: github.ref == 'refs/heads/feat/tok-central-openai-cost-controls-20261014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tok-central-openai-cost-controls-20261014
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate final branch content without one-time helper
        run: git rm -- .github/workflows/tok-one-time-ai-validation.yml
      - name: Check generated index
        run: pnpm docs:application-index:check
      - name: Production-mode Vite compile with synthetic public CI variables
        run: pnpm build
      - name: Remove temporary helper from branch
        run: |
          set -euo pipefail
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove completed temporary TOK AI validation helper"
          git push origin HEAD:refs/heads/feat/tok-central-openai-cost-controls-20261014
