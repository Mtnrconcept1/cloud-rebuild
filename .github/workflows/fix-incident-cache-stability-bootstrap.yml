name: Fix incident cache stability bootstrap

on:
  push:
    branches:
      - feat/unify-incident-intelligence

permissions:
  contents: write

jobs:
  repair-workflow:
    name: Repair one-shot hardening workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/unify-incident-intelligence
          fetch-depth: 0

      - name: Repair indentation and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-incident-cache-stability.yml')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()

          for variable in ('old_sensitive', 'new_sensitive'):
              start = next(
                  (index for index, line in enumerate(lines)
                   if f"{variable} = '''  const sensitive" in line),
                  None,
              )
              if start is None:
                  raise SystemExit(f'Unable to locate {variable} block')
              indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
              end = None
              for index in range(start + 1, min(len(lines), start + 12)):
                  stripped = lines[index].strip()
                  if stripped.startswith('/'):
                      lines[index] = indent + '    ' + stripped
                  elif stripped == "]);'''":
                      lines[index] = indent + '  ' + stripped
                      end = index
                      break
              if end is None:
                  raise SystemExit(f'Unable to locate the end of {variable} block')

          source = '\n'.join(lines) + '\n'
          old_commit = '''          git add -A
          git reset .github/workflows/apply-incident-cache-stability.yml
          if git diff --cached --quiet; then'''
          new_commit = '''          rm -f .github/workflows/apply-incident-cache-stability.yml
          git add -A
          if git diff --cached --quiet; then'''
          if source.count(old_commit) != 1:
              raise SystemExit('Unable to locate the one-shot cleanup block')
          source = source.replace(old_commit, new_commit, 1)
          path.write_text(source, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-incident-cache-stability.yml
          git rm .github/workflows/fix-incident-cache-stability-bootstrap.yml
          git diff --cached --check
          git commit -m "ci(ops): repair one-shot cache hardening workflow"
          git push origin HEAD:feat/unify-incident-intelligence
