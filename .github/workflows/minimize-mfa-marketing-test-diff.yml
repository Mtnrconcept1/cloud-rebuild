name: Minimize marketing MFA regression test diff

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  minimize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mfa-password-and-marketing-login'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mfa-password-and-marketing-login
          fetch-depth: 1

      - name: Restore canonical test formatting and add one regression case
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git checkout origin/main -- src/test/marketing-bff-security.test.ts
          python <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('src/test/marketing-bff-security.test.ts')
          source = path.read_text(encoding='utf-8')
          marker = '  it("refuses AAL1 TOTP bootstrap when another verified factor exists", async () => {'
          if source.count(marker) != 1:
              raise SystemExit(f'test insertion marker: expected one occurrence, found {source.count(marker)}')
          test = r'''  it("accepts Supabase SVG enrollment payloads containing literal percent characters", async () => {
            configureServerEnvironment();
            const userId = "11111111-1111-4111-8111-111111111111";
            const factorId = "22222222-2222-4222-8222-222222222222";
            const challengeId = "33333333-3333-4333-8333-333333333333";
            vi.stubGlobal("fetch", vi.fn(async (input: string | URL | Request) => {
              const url = String(input);
              if (url.endsWith("/rpc/service_consume_marketing_auth_attempt")) {
                return json({ allowed: true, retry_after_seconds: 0 });
              }
              if (url.endsWith("/auth/v1/token?grant_type=password")) {
                return json({
                  access_token: "supabase-access-token",
                  refresh_token: "supabase-refresh-token",
                  user: { id: userId, email: "admin@thetok.ch" },
                });
              }
              if (url.endsWith(`/auth/v1/admin/users/${userId}`)) {
                return json({ id: userId, email: "admin@thetok.ch" });
              }
              if (url.includes("/rest/v1/user_roles?")) return json([{ user_id: userId }]);
              if (url.endsWith("/auth/v1/user")) {
                return json({ id: userId, email: "admin@thetok.ch", factors: [] });
              }
              if (url.endsWith("/auth/v1/factors")) {
                return json({
                  id: factorId,
                  totp: {
                    qr_code: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"><text>100%</text></svg>',
                  },
                });
              }
              if (url.endsWith(`/auth/v1/factors/${factorId}/challenge`)) {
                return json({ id: challengeId });
              }
              if (url.endsWith("/rpc/service_store_marketing_auth_challenge")) {
                return json({ user_id: userId, expires_at: new Date(Date.now() + 600_000).toISOString() });
              }
              throw new Error(`Unexpected test request: ${url}`);
            }));

            const recorder = responseRecorder();
            await marketingLoginHandler(
              mutationRequest(
                { email: "admin@thetok.ch", password: "correct-password" },
                `${MARKETING_CSRF_COOKIE}=${"c".repeat(43)}`,
              ),
              recorder.response,
            );

            expect(recorder.response.statusCode).toBe(200);
            const payload = JSON.parse(recorder.body) as Record<string, unknown>;
            expect(payload.status).toBe("mfa_enrollment_required");
            expect(payload.qrCode).toMatch(/^data:image\/svg\+xml;base64,/);
            expect(recorder.body).not.toMatch(/supabase-access-token|supabase-refresh-token/);
          });

          '''
          source = source.replace(marker, textwrap.dedent(test) + marker, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused tests
        run: >-
          pnpm exec vitest run --mode production
          src/test/password-recovery-routing.test.ts
          src/test/marketing-bff-security.test.ts
          src/test/marketing-bff-client.test.ts
          src/test/auth-signup-form.test.tsx

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build:prod

      - name: Commit minimal test diff
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- \
            public/sitemap-actualites.xml \
            public/sitemap-pages.xml \
            public/sitemap-restaurants.xml
          rm -f .github/workflows/minimize-mfa-marketing-test-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/marketing-bff-security.test.ts
          git add -u .github/workflows/minimize-mfa-marketing-test-diff.yml
          git diff --cached --check
          git commit -m "chore(auth): keep marketing regression test minimal"
          git push origin HEAD:fix/mfa-password-and-marketing-login
