name: TOK Workforce PostgreSQL Integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/*tok_workforce*.sql'
      - 'src/test/sql/tok_workforce*.sql'
      - '.github/workflows/tok-workforce-postgres.yml'
  push:
    branches: [feat/tok-workforce-clock-employee-portal-20261014]
    paths:
      - 'supabase/migrations/*tok_workforce*.sql'
      - 'src/test/sql/tok_workforce*.sql'
      - '.github/workflows/tok-workforce-postgres.yml'
permissions:
  contents: read
jobs:
  migration-and-tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: workforce_test
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: workforce_test
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL client
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Verify workforce invitations, launch access and tenant isolation
        run: psql -X -v ON_ERROR_STOP=1 -f src/test/sql/tok_workforce_postgres_smoke.sql
