name: "PR786 Refresh application index (one-shot)"
on:
  push:
    branches:
      - fix/zero-attente-miamz-free-checkout-20261012
    paths:
      - .github/workflows/pr786-refresh-index.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/zero-attente-miamz-free-checkout-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Regenerate and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/zero-attente-miamz-free-checkout-20261012'
          git rm -- .github/workflows/pr786-refresh-index.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'docs: refresh TOK application index for free MIAMZ checkout'
          git push origin HEAD:refs/heads/fix/zero-attente-miamz-free-checkout-20261012
