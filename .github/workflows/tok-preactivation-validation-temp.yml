name: TOK preactivation one-time validation

on:
  push:
    branches:
      - feat/restaurant-preactivation-weekly-ai-credits-20261014
    paths:
      - .github/workflows/tok-preactivation-validation-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/restaurant-preactivation-weekly-ai-credits-20261014
          fetch-depth: 1
          persist-credentials: true
      - name: Remove this temporary workflow from the checked-out tree
        run: git rm -- .github/workflows/tok-preactivation-validation-temp.yml
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify canonical application references
        run: pnpm docs:application-index:check
      - name: Run business regression tests
        run: pnpm exec vitest run --mode production src/test/restaurant-preactivation-ai-credits.test.ts src/test/tok-ai-tools.test.ts src/test/restaurant-billing-account.test.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Permanently remove temporary validation workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: cleanup one-time TOK credit validations"
          git push origin HEAD:refs/heads/feat/restaurant-preactivation-weekly-ai-credits-20261014
