name: Dashboard assets - isolated PR 944 transfer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/dashboard-design-assets-944.yml

permissions:
  contents: read

concurrency:
  group: dashboard-assets-944
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'Mtnrconcept1/cloud-rebuild' &&
      github.event.pull_request.number == 944 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/dashboard-white-page-heroes-20261021' &&
      github.actor == 'mtnrconcept'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read the exact dedicated branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout and prepare image encoder
        run: |
          set -euo pipefail
          git status --short
          git branch --show-current
          git rev-parse HEAD
          test -z "$(git status --porcelain)"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y webp
      - name: Transfer and validate native artwork
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, struct, subprocess, tarfile, urllib.request
          from datetime import datetime, timezone
          root = pathlib.Path('/tmp/tok-dashboard-assets')
          root.mkdir()
          sources = [
            ('restaurant-accueil', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:5959e9a9-ca94-4ef9-9734-883a18957492', '6e2c1411-a5f9-4ede-be2a-c20354d22d81', 'Service en salle : une serveuse TOK présente deux assiettes.'),
          ]
          records, hashes = [], set()
          for name, url, request_id, scene in sources:
            if not url.startswith('https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:'):
              raise ValueError('Unexpected image source')
            with urllib.request.urlopen(url, timeout=90) as response:
              if not response.url.startswith('https://'):
                raise ValueError('Insecure redirect')
              data = response.read(25 * 1024 * 1024 + 1)
            if len(data) > 25 * 1024 * 1024 or data[:8] != b'\x89PNG\r\n\x1a\n':
              raise ValueError('Expected a bounded native PNG')
            width, height = struct.unpack('>II', data[16:24])
            if not (1000 <= width <= 6000 and 500 <= height <= 4000 and 1.7 < width / height < 1.85):
              raise ValueError(f'Unexpected photograph dimensions: {width} x {height}')
            original = pathlib.Path('/tmp') / f'{name}.png'
            original.write_bytes(data)
            dest = root / f'{name}.webp'
            subprocess.run(['cwebp', '-quiet', '-q', '88', '-m', '6', '-resize', str(min(width, 1600)), '0', str(original), '-o', str(dest)], check=True)
            image = dest.read_bytes()
            if image[:4] != b'RIFF' or image[8:12] != b'WEBP' or not 10000 < len(image) < 1500000:
              raise ValueError('Invalid or oversized optimized asset')
            digest = hashlib.sha256(image).hexdigest()
            if digest in hashes:
              raise ValueError('Duplicate artwork')
            hashes.add(digest)
            records.append({'id': name, 'file': dest.name, 'sha256': digest, 'bytes': len(image), 'sourceWidth': width, 'sourceHeight': height, 'generationId': url.rsplit('/', 1)[-1], 'requestId': request_id, 'scene': scene})
            print(f'{dest.name}: {len(image)} bytes, SHA256 {digest}')
          provenance = {'generator': 'Adobe Firefly via Adobe image_generate', 'referenceAsset': 'urn:aaid:sc:EU:902c68ee-9b00-4f41-9dbb-80802152cd76', 'direction': 'Photographie de restaurant chaleureuse, accents orange TOK, une scène par fichier ; aucune capture UI.', 'transformations': ['proportional downsize to at most 1600px wide', 'WebP compression, quality 88'], 'importedAt': datetime.now(timezone.utc).isoformat(), 'images': records}
          (root / 'provenance.json').write_text(json.dumps(provenance, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          # A source-only review snapshot. No environment, git credentials, caches or runtime data.
          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.cjs', '.mjs', '.json', '.jsonc', '.md', '.css', '.yaml', '.yml', '.html', '.toml', '.svg', '.txt'}
          with tarfile.open('/tmp/tok-dashboard-source.tar.gz', 'w:gz') as archive:
            for raw in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not raw:
                continue
              file = pathlib.Path(raw)
              if file.suffix in suffixes and file.is_file() and not file.is_symlink() and not any(part.startswith('.env') for part in file.parts) and not file.name.startswith('service-account'):
                archive.add(file, arcname=raw, recursive=False)
          PY
      - name: Retain validated photographs for scoped import
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tok-dashboard-assets-${{ github.run_id }}
          path: /tmp/tok-dashboard-assets/
          retention-days: 1
          if-no-files-found: error
      - name: Retain exact source snapshot for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tok-dashboard-source-${{ github.run_id }}
          path: /tmp/tok-dashboard-source.tar.gz
          retention-days: 1
          if-no-files-found: error

  import:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      # No checkout, dependency installation or repository code executes with this token.
      - name: Commit only validated image files to the same branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, re, urllib.error, urllib.request, zipfile
          repo = 'Mtnrconcept1/cloud-rebuild'
          branch = 'codex/dashboard-white-page-heroes-20261021'
          expected = os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
          api_root = 'https://api.github.com/repos/' + repo + '/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET', body=None):
            payload = None if body is None else json.dumps(body).encode()
            request = urllib.request.Request(api_root + path, data=payload, headers=headers, method=method)
            with urllib.request.urlopen(request, timeout=60) as response:
              return json.load(response)
          ref_path = 'git/refs/heads/' + branch
          if api(ref_path)['object']['sha'] != expected:
            raise RuntimeError('Branch changed; refusing to overwrite concurrent work')
          run_id = os.environ['RUN_ID']
          artifacts = api('actions/runs/' + run_id + '/artifacts')['artifacts']
          artifact = next(a for a in artifacts if a['name'] == 'tok-dashboard-assets-' + run_id and not a['expired'])
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, fp, code, msg, hdrs, newurl):
              return None
          opener = urllib.request.build_opener(NoRedirect)
          try:
            opener.open(urllib.request.Request(api_root + 'actions/artifacts/' + str(artifact['id']) + '/zip', headers=headers), timeout=60)
            raise RuntimeError('Expected an artifact download redirect')
          except urllib.error.HTTPError as error:
            if error.code != 302:
              raise
            location = error.headers['Location']
          if not location.startswith('https://'):
            raise RuntimeError('Insecure artifact redirect')
          # Do not forward the GitHub credential to the artifact storage host.
          with urllib.request.urlopen(location, timeout=90) as response:
            content = response.read(80 * 1024 * 1024 + 1)
          if len(content) > 80 * 1024 * 1024:
            raise RuntimeError('Artifact exceeds size limit')
          names = ['restaurant-accueil']
          expected_files = {name + '.webp' for name in names} | {'provenance.json'}
          archive = zipfile.ZipFile(io.BytesIO(content))
          if set(archive.namelist()) != expected_files:
            raise RuntimeError('Artifact does not match fixed file allowlist')
          provenance = json.loads(archive.read('provenance.json'))
          records = {row['file']: row for row in provenance['images']}
          if set(records) != expected_files - {'provenance.json'}:
            raise RuntimeError('Provenance does not match image set')
          tree = []
          for name in sorted(expected_files):
            info = archive.getinfo(name)
            if info.file_size > 1500000:
              raise RuntimeError('Oversized asset')
            data = archive.read(name)
            if name.endswith('.webp'):
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP' or hashlib.sha256(data).hexdigest() != records[name]['sha256']:
                raise RuntimeError('Invalid asset or integrity mismatch')
            blob = api('git/blobs', 'POST', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
            tree.append({'path': 'public/images/dashboard-scenes/' + name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          parent = api('git/commits/' + expected)
          new_tree = api('git/trees', 'POST', {'base_tree': parent['tree']['sha'], 'tree': tree})
          commit = api('git/commits', 'POST', {'message': 'feat(dashboards): import validated native page artwork', 'tree': new_tree['sha'], 'parents': [expected]})
          if api(ref_path)['object']['sha'] != expected:
            raise RuntimeError('Concurrent work detected; commit left unattached')
          api(ref_path, 'PATCH', {'sha': commit['sha'], 'force': False})
          print('Image-only commit: ' + commit['sha'])
          print('Dedicated branch: ' + branch)
          PY
