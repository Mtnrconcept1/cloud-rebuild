name: TOK Connect temporary index refresh
on:
  push:
    branches:
      - fix/tok-connect-oauth-ui-locales-20261019
    paths:
      - .github/workflows/tok-connect-index-refresh.yml

permissions:
  contents: write

jobs:
  regenerate-index:
    if: ${{ github.repository == 'Mtnrconcept1/cloud-rebuild' && github.ref == 'refs/heads/fix/tok-connect-oauth-ui-locales-20261019' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/tok-connect-oauth-ui-locales-20261019
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Recompute index for the final tree and remove this one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/tok-connect-index-refresh.yml
          pnpm run docs:application-index
          git add -A -- .github/workflows/tok-connect-index-refresh.yml docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): regenerer la reference TOK Connect"
          git push origin "HEAD:refs/heads/fix/tok-connect-oauth-ui-locales-20261019"
