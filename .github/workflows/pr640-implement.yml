          replace("src/test/notifications-ai-admin-hardening.test.ts", 'expect(adminHome).toContain(\'feature: "tok-connect"\');', 'expect(adminHome).toContain(\'feature: "admin-tok-connect"\');')

          # Frontend estimates should recognize the new model defaults, while retaining historical model pricing.
          insert_before("src/lib/ai/tokAiClient.ts", '''  "gpt-5.5": { input: 5, output: 30 },''', '''  "gpt-5.6-terra": { input: 2.5, output: 15 },
