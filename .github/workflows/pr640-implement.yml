          replace("src/test/tok-ai-tools.test.ts", '''    expect(helper).toContain("OPENAI_API_KEY");
              expect(helper).toContain("OPENAI_MODEL");
              expect(helper).toContain("gpt-5.5");
              expect(helper).toContain("https://api.openai.com/v1/responses");''', '''    expect(helper).toContain("OPENAI_API_KEY");
              expect(helper).toContain("OPENAI_MODEL");
              expect(helper).toContain("gpt-5.6-luna");
