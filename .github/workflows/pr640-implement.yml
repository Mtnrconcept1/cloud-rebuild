          # --- Keep source-contract tests aligned with current model catalogue and verified admin flag. ---
          replace("src/test/tok-ai-platform-plan.test.ts", '''    expect(helper).toContain("selectTokAiModel");
              expect(helper).toContain("gpt-5.4-mini");
              expect(helper).toContain("gpt-5.5");''', '''    expect(helper).toContain("selectTokAiModel");
              expect(helper).toContain("gpt-5.6-luna");
