name: PR640 implementation

on:
  push:
    branches:
      - fix/notifications-ai-admin-hardening-20260907

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/notifications-ai-admin-hardening-20260907
          fetch-depth: 1

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare implementation script
        run: python3 scripts/pr640-fix-script.py

      - name: Apply implementation patch
        run: python3 scripts/pr640-implement.py

      - name: Refresh generated error-code map
        run: pnpm run generate:error-code-map

      - name: Run focused regression tests
        run: pnpm exec vitest run --mode production src/test/notifications-ai-admin-hardening.test.ts src/test/tok-ai-platform-plan.test.ts src/test/tok-ai-tools.test.ts src/test/incident-evidence-depth.test.ts

      - name: Validate diff
        run: git diff --check

      - name: Remove temporary implementation files
        run: rm .github/workflows/pr640-implement.yml scripts/pr640-implement.py scripts/pr640-fix-script.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden notification and AI control paths"
          git push origin HEAD:fix/notifications-ai-admin-hardening-20260907
