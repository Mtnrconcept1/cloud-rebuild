                  })
                  .eq("id", delivery.id);

                notificationProcessed++;''', '''        await settleNotificationDelivery(supabaseAdmin, {
                  id: delivery.id,
                  leaseToken: delivery.lease_token,
                  success: true,
                });

                notificationProcessed++;''')
          replace(email, '''        await supabaseAdmin
                  .from("notification_deliveries")
                  .update({ status: "failed", last_error: errMsg })
                  .eq("id", delivery.id);
                notificationFailed++;''', '''        try {
                  await settleNotificationDelivery(supabaseAdmin, {
