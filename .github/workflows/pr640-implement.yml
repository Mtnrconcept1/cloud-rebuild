name: PR640 implement hardening

on:
  push:
    branches:
      - fix/notifications-ai-admin-hardening-20260907

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/notifications-ai-admin-hardening-20260907
          fetch-depth: 1

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch notification workers, AI governance and admin flags
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, before: str, after: str):
              p = Path(path)
              source = p.read_text()
              if before not in source:
                  raise SystemExit(f"Expected source block not found in {path}: {before[:100]!r}")
              p.write_text(source.replace(before, after, 1))

          def insert_before(path: str, marker: str, block: str):
              p = Path(path)
              source = p.read_text()
              if marker not in source:
                  raise SystemExit(f"Marker not found in {path}: {marker!r}")
              p.write_text(source.replace(marker, block + marker, 1))

          # --- send-push: claim atomically, then settle by lease token. ---
          push = "supabase/functions/send-push/index.ts"
          insert_before(push, "Deno.serve(async (req) => {", '''async function settleNotificationDelivery(
            supabaseAdmin: any,
            input: {
              id: string;
              leaseToken: string;
              success: boolean;
              terminal?: boolean;
              terminalStatus?: "failed" | "skipped";
              lastError?: string | null;
              provider?: string | null;
            },
          ) {
            const { error } = await supabaseAdmin.rpc("settle_notification_delivery", {
              p_delivery_id: input.id,
              p_lease_token: input.leaseToken,
              p_success: input.success,
              p_terminal: input.terminal ?? false,
              p_terminal_status: input.terminalStatus ?? "failed",
              p_last_error: input.lastError ?? null,
              p_provider: input.provider ?? null,
            });
            if (error) throw error;
          }

          ''')
          replace(push, '''    // Fetch queued push notification deliveries
              let deliveriesQuery = supabaseAdmin
                .from("notification_deliveries")
                .select("*, notifications!inner(*)")
                .eq("channel", "push")
                .eq("status", "queued")
                .order("created_at", { ascending: true })
                .limit(50);

              if (userIdFilter) {
                deliveriesQuery = deliveriesQuery.eq("notifications.user_id", userIdFilter);
              }

              const { data: deliveries, error } = await deliveriesQuery;

              if (error) throw error;''', '''    // Claim deliveries atomically so concurrent cron/admin invocations cannot double-send.
              const { data: deliveries, error } = await supabaseAdmin.rpc("claim_notification_deliveries", {
                p_channel: "push",
                p_limit: 50,
                p_user_id: userIdFilter,
                p_lease_seconds: 120,
              });

              if (error) throw error;''')
          replace(push, '''        const notification = (delivery as any).notifications;
                if (!notification) {
                  await supabaseAdmin
                    .from("notification_deliveries")
                    .update({ status: "failed", last_error: "Notification not found" })
                    .eq("id", delivery.id);
                  failed++;
                  continue;
                }
''', '''        const notification = {
                  user_id: delivery.notification_user_id,
                  title: delivery.notification_title,
                  body: delivery.notification_body,
                  data: delivery.notification_data,
                };
                if (!notification.user_id) {
                  await settleNotificationDelivery(supabaseAdmin, {
                    id: delivery.id,
                    leaseToken: delivery.lease_token,
                    success: false,
                    terminal: true,
                    terminalStatus: "failed",
                    lastError: "Notification not found",
                  });
                  failed++;
                  continue;
                }
''')
