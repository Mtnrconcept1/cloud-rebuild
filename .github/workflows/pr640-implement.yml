                  await supabaseAdmin
                    .from("notification_deliveries")
                    .update({ status: "skipped", last_error: "No active device tokens" })
                    .eq("id", delivery.id);
                  skipped++;
                  continue;
                }
''', '''        if (!tokens || tokens.length === 0) {
                  await settleNotificationDelivery(supabaseAdmin, {
