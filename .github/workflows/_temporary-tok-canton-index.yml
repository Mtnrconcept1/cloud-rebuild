name: Temporary TOK canton reference sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/_temporary-tok-canton-index.yml

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/tok-home-canton-localization-20261012' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 20
          persist-credentials: true
      - name: Synchronize with latest main
        run: |
          git config user.name "TOK CI Assistant"
          git config user.email "tok-ci-assistant@users.noreply.github.com"
          git fetch --no-tags --depth=20 origin main:refs/remotes/origin/main
          git merge --no-edit --no-ff origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Generate canonical index and remove temporary workflow
        run: |
          pnpm install --frozen-lockfile
          rm .github/workflows/_temporary-tok-canton-index.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add -A docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json .github/workflows/_temporary-tok-canton-index.yml
          git diff --cached --check
          git commit -m "docs: refresh TOK application index for canton home artwork"
          git push origin HEAD:refs/heads/codex/tok-home-canton-localization-20261012
      - name: Re-run CI on updated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref codex/tok-home-canton-localization-20261012
