name: Temporary TOK documentation index refresh
on:
  push:
    branches:
      - codex/list-filters-view-modes-20261021

permissions:
  contents: write

jobs:
  refresh-index:
    if: github.ref == 'refs/heads/codex/list-filters-view-modes-20261021'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate official TOK index and self-remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-list-controls-index-sync.yml
          pnpm docs:application-index
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): refresh application reference for list controls"
          git push origin HEAD:codex/list-filters-view-modes-20261021
