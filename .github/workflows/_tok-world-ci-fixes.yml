name: Temporary TOK artwork CI fixes
on:
  push:
    branches: [codex/tok-world-geo-hero-20261014]
    paths: [.github/workflows/_tok-world-ci-fixes.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/tok-world-geo-hero-20261014
          fetch-depth: 5
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Repair binary deduplication and responsive test assertions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TOK CI Assistant"
          git config user.email "tok-ci-assistant@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          base=Path("public")
          grouped={}
          for p in base.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".avif",".gif",".ico",".jpeg",".jpg",".png",".webp"}:
                  key=(p.stat().st_size,hashlib.sha256(p.read_bytes()).digest())
                  grouped.setdefault(key,[]).append(p)
          manifest=Path("src/lib/homeWorldHero.ts")
          s=manifest.read_text()
          removed=[]
          for candidates in grouped.values():
              if len(candidates)<2 or not any("/locations/" in x.as_posix() for x in candidates):continue
              # Keep existing canonical public assets first, otherwise first referred world art path.
              keep=next((x for x in sorted(candidates,key=lambda p:p.as_posix()) if "/locations/" not in x.as_posix()),None)
              if keep is None:
                  keep=next((x for x in candidates if ("/"+x.relative_to(base).as_posix()) in s),candidates[0])
              for candidate in candidates:
                  if candidate==keep or "/locations/" not in candidate.as_posix():continue
                  old="/"+candidate.relative_to(base).as_posix()
                  new="/"+keep.relative_to(base).as_posix()
                  s=s.replace(old,new)
                  candidate.unlink()
                  removed.append((old,new))
          manifest.write_text(s)
          # Preserve dynamic location-specific LCP instead of preloading the wrong default hero.
          p=Path("src/test/home-core-web-vitals.test.ts")
          s=p.read_text()
          start=s.index('  it("discovers the matching responsive hero photo directly in the initial HTML"')
          end=s.index('  it("uses a lightweight visible logo',start)
          replacement='''  it("loads only the matching responsive hero rather than eagerly preloading a fixed city", () => {
            const html = read("index.html");
            const hero = read("src/components/home/HeroSection.tsx");
            expect(html).not.toContain('href="/images/home/tok-geneve-mobile-fast.webp"');
            expect(html).not.toContain('href="/images/home/tok-leman-signature-fast.webp"');
            expect(hero).toContain("desktopImage");
            expect(hero).toContain("mobileImage");
            expect(hero).toContain('loading="eager"');
            expect(hero).toContain('fetchpriority: "high"');
            expect(assetSize("images/home/tok-leman-signature-fast.webp")).toBeLessThan(160_000);
            expect(assetSize("images/home/tok-geneve-mobile-fast.webp")).toBeLessThan(165_000);
          });

          '''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          print("removed duplicate world-art assets",len(removed))
          for old,new in removed: print(old,"->",new)
          # Ensure no world manifest reference is broken.
          import re
          for url in re.findall(r'"/images/locations/[^"]+\.webp"',manifest.read_text()):
              path=base/url.strip('"').lstrip("/")
              if not path.exists():raise SystemExit("missing manifest asset "+str(path))
          PY
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
          rm .github/workflows/_tok-world-ci-fixes.yml
          git add -u .github/workflows/_tok-world-ci-fixes.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          pnpm exec vitest run src/test/public-asset-deduplication.test.ts src/test/home-core-web-vitals.test.ts src/test/home-world-hero.test.ts src/test/home-hero-search.test.tsx --mode production
          pnpm typecheck
          git add -A public/images/locations src/lib/homeWorldHero.ts src/test/home-core-web-vitals.test.ts docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git commit -m "fix(home): deduplicate world images and update responsive LCP checks"
          git push origin HEAD:refs/heads/codex/tok-world-geo-hero-20261014
