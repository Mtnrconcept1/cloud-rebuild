name: TheFork Geneva public email enrichment

on:
  push:
    branches:
      - data/thefork-geneva-enrichment-20260724
    paths:
      - scripts/data/thefork_email_matrix_plan.py
      - scripts/data/thefork_email_enrich_shard.py
      - scripts/data/thefork_email_aggregate.py
      - .github/workflows/thefork-geneva-email-enrichment.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: 22
  PYTHON_VERSION: "3.12"
  CANDIDATE_ARTIFACT_ID: "8590546387"
  TF_EMAIL_SHARDS: "128"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download aggregated TheFork candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" > candidates.zip
          unzip -q candidates.zip -d input
          test -s input/thefork_geneva_matrix_hits.json
      - run: python scripts/data/thefork_email_matrix_plan.py
      - id: matrix
        shell: bash
        run: echo "matrix=$(cat email-matrix.json)" >> "$GITHUB_OUTPUT"

  enrich:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Download aggregated TheFork candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" > candidates.zip
          unzip -q candidates.zip -d input
          test -s input/thefork_geneva_matrix_hits.json
      - name: Search public business contacts
        env:
          TF_SHARD_NAME: ${{ matrix.shard }}
          TF_SHARD_INDEX: ${{ matrix.shard_index }}
          TF_SHARD_COUNT: ${{ matrix.shard_count }}
        run: python scripts/data/thefork_email_enrich_shard.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thefork-email-${{ matrix.shard }}
          path: artifacts/thefork-geneva-email-shards/${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 1

  aggregate:
    needs: enrich
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: thefork-email-*
          path: artifacts/thefork-geneva-email-raw
          merge-multiple: true
      - run: python scripts/data/thefork_email_aggregate.py
      - uses: actions/upload-artifact@v4
        with:
          name: thefork-geneva-public-email-result
          path: artifacts/thefork-geneva-email-result
          if-no-files-found: error
          retention-days: 1
