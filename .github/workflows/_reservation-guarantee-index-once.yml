name: One-time reservation guarantee index refresh

on:
  push:
    branches:
      - feat/reservation-card-guarantee-20261012
    paths:
      - .github/workflows/_reservation-guarantee-index-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/reservation-card-guarantee-20261012
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove this one-time workflow from the final diff
        run: git rm .github/workflows/_reservation-guarantee-index-once.yml
      - name: Regenerate canonical application index against final source tree
        run: pnpm docs:application-index
      - name: Commit generated reference to the feature branch only
        run: |
          git config user.name "tok-ci-bot"
          git config user.email "tok-ci-bot@users.noreply.github.com"
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          if git diff --cached --quiet; then
            echo "Index unchanged"
          else
            git commit -m "docs(index): refresh TOK reference after guarantee security fixes"
            git push origin HEAD:feat/reservation-card-guarantee-20261012
          fi
