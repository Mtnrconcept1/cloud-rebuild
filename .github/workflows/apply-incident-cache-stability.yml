name: Apply incident cache stability hardening

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  harden:
    name: Stabilize evidence cache and compact support context
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/unify-incident-intelligence
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic product patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_between(source: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement + source[end:]

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              return source.replace(old, new, 1)

          # Stable technical evidence hash: ignore recurrence counters, timestamps and request IDs.
          shared_path = Path("supabase/functions/_shared/incident-intelligence.ts")
          shared = shared_path.read_text(encoding="utf-8")

          sensitivity_start = shared.index("  const sensitive = containsAny(evidenceText, [")
          sensitivity_end = shared.index("\n  ]);", sensitivity_start) + len("\n  ]);")
          sensitivity_block = '''  const sensitive = containsAny(evidenceText, [
            /payment|stripe|checkout|refund|invoice|billing|compta/,
            /auth(?:entication|orization)?|rls|role|permission|security|secret|credential|bearer|jwt|api[_ -]?key|access[_ -]?token|refresh[_ -]?token|session[_ -]?token/,
            /migration|schema|database|postgres/,
          ]);'''
          shared = shared[:sensitivity_start] + sensitivity_block + shared[sensitivity_end:]

          helper_marker = "const VOLATILE_INCIDENT_EVIDENCE_KEY ="
          if helper_marker not in shared:
              stable_marker = "export async function buildStableEvidenceHash(value: unknown) {"
              helpers = '''const VOLATILE_INCIDENT_EVIDENCE_KEY = /^(?:id|source_event_id|request_id|rid|update_id|github_run_id|github_pr_number|decision_message_id|decision_chat_id|occurrence_count|failure_count|attempt|duration_ms|run_number|created_at|updated_at|timestamp|time|date|distinct_clients|distinct_user_agents|input_tokens|output_tokens|total_tokens|cached_input_tokens|cache_write_tokens|reasoning_tokens|usage)$/i;

          function isVolatileIncidentEvidenceKey(key: string) {
            const normalized = key.toLowerCase();
            return VOLATILE_INCIDENT_EVIDENCE_KEY.test(normalized)
              || /(?:^|_)(?:created|updated|first|last|started|finished|seen|received|sent|resolved|closed|expires)_at$/.test(normalized)
              || /(?:^|_)(?:count|duration_ms|tokens)$/.test(normalized);
          }

          function canonicalizeIncidentEvidence(value: unknown, depth = 0): unknown {
            if (depth > 7) return "[depth-limited]";
            if (value === null || value === undefined) return null;
            if (typeof value === "string") return normalizeText(value, 8_000);
            if (typeof value === "number" || typeof value === "boolean") return value;
            if (Array.isArray(value)) {
              const unique = new Map<string, unknown>();
              for (const entry of value.slice(0, 80)) {
                const normalized = canonicalizeIncidentEvidence(entry, depth + 1);
                unique.set(JSON.stringify(normalized), normalized);
              }
              return [...unique.values()].sort((left, right) =>
                JSON.stringify(left).localeCompare(JSON.stringify(right))
              );
            }
            if (typeof value !== "object") return normalizeText(String(value), 1_000);

            const output: Record<string, unknown> = {};
            for (const [key, entry] of Object.entries(value as Record<string, unknown>)
              .sort(([left], [right]) => left.localeCompare(right))
              .slice(0, 120)) {
              if (isVolatileIncidentEvidenceKey(key)) continue;
              output[key.slice(0, 160)] = canonicalizeIncidentEvidence(entry, depth + 1);
            }
            return output;
          }

          function normalizeIncidentSignature(value: unknown) {
            return normalizeText(value, 2_400)
              .replace(/\\b(attempt|essai|retry)\\s*#?\\s*\\d+\\b/g, "$1 <count>");
          }

          function evidenceRecord(value: unknown) {
            return value && typeof value === "object" && !Array.isArray(value)
              ? value as Record<string, unknown>
              : {};
          }

          '''
              if stable_marker not in shared:
                  raise SystemExit("buildStableEvidenceHash marker missing")
              shared = shared.replace(stable_marker, helpers + stable_marker, 1)

          envelope_start = "export function buildIncidentEvidenceEnvelope(input: IncidentEvidenceInput) {"
          envelope_end = "\n\nexport function buildIncidentEvidenceHash"
          envelope = '''export function buildIncidentEvidenceEnvelope(input: IncidentEvidenceInput) {
            const technical = evidenceRecord(input.technicalDetails);
            const context = evidenceRecord(input.context);
            const primaryError = technical.error_message
              || technical.error_type
              || technical.error_code
              || context.primary_error
              || context.error_message
              || input.summary;

            return {
              source: normalizeText(input.source, 120),
              title: normalizeText(input.title, 500),
              primary_error: normalizeIncidentSignature(primaryError),
              technical_details: canonicalizeIncidentEvidence(input.technicalDetails),
              sanitized_context: canonicalizeIncidentEvidence(input.context),
            };
          }'''
          shared = replace_between(shared, envelope_start, envelope_end, envelope)
          shared_path.write_text(shared, encoding="utf-8")

          # Compact Support Resolution context before hashing or sending it to OpenAI.
          support_path = Path("supabase/functions/ai-support-resolution/index.ts")
          support = support_path.read_text(encoding="utf-8")
          support = support.replace("\n  .limit(80);", "\n    .limit(80);", 1)
          support = support.replace(
              '''  const sanitizedMessages = [...(messages || [])]
            .reverse()
            .map((message: Record<string, unknown>) => ({
              ...message,
              body: sanitizeMultilineText(message.body, 1200),
            }));''',
              '''  const sanitizedMessages = [...(messages || [])]
            .reverse()
            .map((message: Record<string, unknown>) => ({
              ...message,
              body: sanitizeMultilineText(message.body, 1200),
            }));''',
              1,
          )

          if "function buildSupportModelContext(" not in support:
              compact_marker = "\n\nasync function invokeOpsIncidentControl(payload: Record<string, unknown>) {"
              compact_helpers = '''

          function compactSupportRecord(
            value: unknown,
            keys: readonly string[],
            maxStringLength = 800,
          ) {
            if (!isRecord(value)) return null;
            const output: Record<string, unknown> = {};
            for (const key of keys) {
              const entry = value[key];
              if (typeof entry === "string") {
                const normalized = sanitizeMultilineText(entry, maxStringLength);
                if (normalized) output[key] = normalized;
              } else if (typeof entry === "number" || typeof entry === "boolean") {
                output[key] = entry;
              }
            }
            return Object.keys(output).length > 0 ? output : null;
          }

          function buildSupportModelContext(
            context: Awaited<ReturnType<typeof getIncidentContext>>,
          ) {
            return {
              incident: compactSupportRecord(context.incident, [
                "category",
                "priority",
                "status",
                "subject",
                "description",
                "resolution",
                "last_message_at",
                "resolved_at",
                "closed_at",
                "created_at",
                "updated_at",
              ], 1_600),
              incident_technical_metadata: buildSupportTechnicalEvidence({
                metadata: context.incident.metadata,
              }).metadata,
              messages: context.messages.map((message) => ({
                author_role: sanitizeText(message.author_role, 80),
                visibility: sanitizeText(message.visibility, 80),
                created_at: sanitizeText(message.created_at, 80),
                body: sanitizeMultilineText(message.body, 1_200),
              })),
              message_digest: context.messageDigest,
              order: compactSupportRecord(context.order, [
                "status",
                "payment_status",
                "fulfillment_status",
                "total_amount",
                "discount_amount",
                "delivery_fee",
                "refund_status",
                "refunded_amount_chf",
                "restaurant_response_status",
                "restaurant_viewed_at",
                "restaurant_accepted_at",
                "acceptance_deadline_at",
                "created_at",
                "updated_at",
                "cancelled_at",
                "cancellation_reason_code",
              ]),
              reservation: compactSupportRecord(context.reservation, [
                "status",
                "feature",
                "date",
                "time",
                "party_size",
                "total_amount",
                "deposit_amount_chf",
                "deposit_status",
                "refund_status",
                "refunded_amount_chf",
                "restaurant_confirmation_required",
                "restaurant_confirmed_at",
                "reservation_confirmation_deadline_at",
                "created_at",
                "updated_at",
                "cancelled_at",
                "cancellation_reason_code",
                "honored_at",
              ]),
              payments: context.payments.map((payment) => compactSupportRecord(payment, [
                "amount",
                "currency",
                "type",
                "status",
                "provider",
                "stripe_mode",
                "created_at",
              ])).filter(Boolean),
              notifications: context.notifications.map((notification) => compactSupportRecord(notification, [
                "title",
                "type",
                "category",
                "read_at",
                "created_at",
              ], 500)).filter(Boolean),
              restaurant: compactSupportRecord(context.restaurant, [
                "name",
                "city",
                "cuisine_type",
                "is_demo",
              ], 500),
            };
          }'''
              if compact_marker not in support:
                  raise SystemExit("support model context insertion marker missing")
              support = support.replace(compact_marker, compact_helpers + compact_marker, 1)

          hash_start = "  const contextHash = await buildStableEvidenceHash({"
          hash_end = "\n\n  const { data: cachedRun"
          hash_block = '''  const modelContext = buildSupportModelContext(context);
            const contextHash = await buildStableEvidenceHash({
              analysis_version: SUPPORT_ANALYSIS_VERSION,
              prompt,
              model_context: modelContext,
            });'''
          support = replace_between(support, hash_start, hash_end, hash_block)

          response_start = support.index("  const openAIResponse = await createOpenAIResponse({")
          payload_start = support.index("        content: JSON.stringify({", response_start)
          payload_end = support.index("\n        }),", payload_start) + len("\n        }),")
          support = (
              support[:payload_start]
              + "        content: JSON.stringify({ prompt, ...modelContext }),"
              + support[payload_end:]
          )
          support_path.write_text(support, encoding="utf-8")

          # Preserve current severity on cached diagnostics and show the real occurrence count in Telegram.
          ops_path = Path("supabase/functions/ops-incident-control/index.ts")
          ops = ops_path.read_text(encoding="utf-8")
          cache_marker = "  if (previous && isReusableRepairPlan(previous.repair_plan, evidenceHash)) {"
          cache_start = ops.index(cache_marker)
          plan_start = ops.index("    const plan = decorateRepairPlan(", cache_start)
          plan_end = ops.index("\n    build = {", plan_start)
          cached_plan = '''    const plan = {
              ...decorateRepairPlan(
                previous.repair_plan,
                routing,
                evidenceHash,
                { source: "cache", cached: true, usage },
              ),
              severity: maxSeverity(
                input.severity,
                normalizeSeverity(previous.repair_plan.severity, input.severity),
              ),
            };'''
          ops = ops[:plan_start] + cached_plan + ops[plan_end:]

          if "occurrenceCount: number" not in ops:
              ops = replace_once(
                  ops,
                  "function buildIncidentTelegramMessage(incidentId: string, input: IncidentInput, plan: RepairPlan) {",
                  '''function buildIncidentTelegramMessage(
            incidentId: string,
            input: IncidentInput,
            plan: RepairPlan,
            occurrenceCount: number,
          ) {''',
                  "telegram message signature",
              )
              ops = replace_once(
                  ops,
                  '`<b>Occurrences :</b> 1 · <b>Source :</b> ${escapeHtml(input.source)}`',
                  '`<b>Occurrences :</b> ${Math.max(1, occurrenceCount)} · <b>Source :</b> ${escapeHtml(input.source)}`',
                  "telegram occurrence display",
              )
              function_start = ops.index("async function sendIncidentApprovalMessage(")
              approval_marker = "  approvalToken: string,\n) {"
              approval_at = ops.index(approval_marker, function_start)
              ops = (
                  ops[:approval_at]
                  + "  approvalToken: string,\n  occurrenceCount: number,\n) {"
                  + ops[approval_at + len(approval_marker):]
              )
              ops = replace_once(
                  ops,
                  "text: buildIncidentTelegramMessage(incidentId, input, plan),",
                  "text: buildIncidentTelegramMessage(incidentId, input, plan, occurrenceCount),",
                  "telegram message call",
              )
              ops = replace_once(
                  ops,
                  "const telegram = await sendIncidentApprovalMessage(registered.incidentId, input, plan, approvalToken);",
                  "const telegram = await sendIncidentApprovalMessage(registered.incidentId, input, plan, approvalToken, currentIncident.occurrence_count);",
                  "telegram approval call",
              )
          ops_path.write_text(ops, encoding="utf-8")

          # Record zero-token Guardian cache hits for cost observability.
          guardian_path = Path("supabase/functions/ai-guardian/index.ts")
          guardian = guardian_path.read_text(encoding="utf-8")
          if "const reusedModel = existingAssessment.model || \"cache\";" not in guardian:
              reuse_start = guardian.index("  if (existingAssessment && !forceDeepAnalysis) {")
              reuse_end = guardian.index("\n  }", reuse_start) + len("\n  }")
              reuse_block = '''  if (existingAssessment && !forceDeepAnalysis) {
            const reusedModel = existingAssessment.model || "cache";
            await recordUsage(actor, {
              status: "success",
              action: "analyze_cached",
              incidentId,
              assessmentId: existingAssessment.id,
              model: reusedModel,
              usage: {},
              metadata: {
                cached: true,
                evidence_hash: evidenceHash,
                analysis_source: existingAssessment.analysis_source || "cache",
              },
            });
            await writeAuditLog({
              adminClient: actor.adminClient,
              functionName: FUNCTION_NAME,
              status: "success",
              action: "analyze_cached",
              actor,
              request,
              targetEntityType: "ops_guardian_assessments",
              targetEntityId: existingAssessment.id,
              metadata: { incident_id: incidentId, evidence_hash: evidenceHash },
            });
            return {
              assessment: existingAssessment,
              result: existingAssessment.assessment,
              function_name: findLikelyFunctionName(incident),
              reused: true,
            };
          }'''
              guardian = guardian[:reuse_start] + reuse_block + guardian[reuse_end:]
          guardian_path.write_text(guardian, encoding="utf-8")

          # Behavioral regression tests for stable cache keys and routing.
          routing_path = Path("src/test/incident-intelligence-routing.test.ts")
          routing_test = routing_path.read_text(encoding="utf-8")
          if "buildIncidentEvidenceHash," not in routing_test:
              routing_test = routing_test.replace(
                  "  buildStableEvidenceHash,\n",
                  "  buildIncidentEvidenceHash,\n  buildStableEvidenceHash,\n",
                  1,
              )
          if "shouldUseDeepIncidentAnalysis," not in routing_test:
              routing_test = routing_test.replace(
                  "  classifyIncidentRepairability,\n",
                  "  classifyIncidentRepairability,\n  shouldUseDeepIncidentAnalysis,\n",
                  1,
              )
          if "keeps the incident evidence hash stable across counts and timestamps" not in routing_test:
              final_marker = "\n});\n"
              if not routing_test.endswith(final_marker):
                  raise SystemExit("unexpected routing test terminator")
              extra_tests = '''

            it("keeps the incident evidence hash stable across counts and timestamps", async () => {
              const first = await buildIncidentEvidenceHash({
                source: "edge_audit",
                severity: "medium",
                title: "Edge Function daily-dish-ai — generate",
                summary: "1 échec sans succès plus récent",
                technicalDetails: {
                  function_name: "daily-dish-ai",
                  action: "generate",
                  error_message: "provider_timeout",
                  failure_count: 1,
                  last_failure_at: "2026-08-01T10:00:00Z",
                },
                context: {
                  source_files: ["supabase/functions/daily-dish-ai/index.ts"],
                  recent_failures: [{
                    created_at: "2026-08-01T10:00:00Z",
                    error_message: "provider_timeout",
                  }],
                  impact_scope: { failure_count: 1, distinct_clients: 1 },
                },
              });
              const second = await buildIncidentEvidenceHash({
                source: "edge_audit",
                severity: "critical",
                title: "Edge Function daily-dish-ai — generate",
                summary: "19 échecs sans succès plus récent",
                technicalDetails: {
                  function_name: "daily-dish-ai",
                  action: "generate",
                  error_message: "provider_timeout",
                  failure_count: 19,
                  last_failure_at: "2026-08-01T16:30:00Z",
                },
                context: {
                  source_files: ["supabase/functions/daily-dish-ai/index.ts"],
                  recent_failures: [{
                    created_at: "2026-08-01T16:30:00Z",
                    error_message: "provider_timeout",
                  }],
                  impact_scope: { failure_count: 19, distinct_clients: 12 },
                },
              });
              const changed = await buildIncidentEvidenceHash({
                source: "edge_audit",
                title: "Edge Function daily-dish-ai — generate",
                technicalDetails: {
                  function_name: "daily-dish-ai",
                  action: "generate",
                  error_message: "invalid_structured_output",
                },
                context: {
                  source_files: ["supabase/functions/daily-dish-ai/index.ts"],
                },
              });

              expect(second).toBe(first);
              expect(changed).not.toBe(first);
            });

            it("does not treat token accounting fields as a security escalation", () => {
              const decision = classifyIncidentRepairability({
                source: "edge_audit",
                severity: "medium",
                summary: "OpenAI provider timeout",
                technicalDetails: {
                  provider: "openai",
                  error_message: "provider_timeout",
                },
                context: {
                  runtime_diagnostics: {
                    input_tokens: 1200,
                    output_tokens: 80,
                    reasoning_tokens: 40,
                  },
                },
              });

              expect(decision.sensitive).toBe(false);
              expect(shouldUseDeepIncidentAnalysis({
                severity: "medium",
                repairability: decision.repairability,
                confidence: decision.confidence,
                sensitive: decision.sensitive,
              })).toBe(false);
            });'''
              routing_test = routing_test[:-len(final_marker)] + extra_tests + final_marker
          routing_path.write_text(routing_test, encoding="utf-8")

          unification_path = Path("src/test/incident-intelligence-unification.test.ts")
          unification = unification_path.read_text(encoding="utf-8")
          marker = '    expect(support).toContain("selectSupportMessages");'
          additions = '''    expect(support).toContain("selectSupportMessages");
              expect(support).toContain("buildSupportModelContext(context)");
              expect(support).toContain("model_context: modelContext");'''
          if "buildSupportModelContext(context)" not in unification:
              unification = replace_once(unification, marker, additions, "support context test")
          unification_path.write_text(unification, encoding="utf-8")

          print("Incident cache stability hardening applied.")
          PY

      - name: Regenerate canonical error-code map
        run: pnpm run generate:error-code-map

      - name: Run focused tests
        run: >-
          pnpm exec vitest run --mode production
          src/test/incident-intelligence-routing.test.ts
          src/test/incident-intelligence-unification.test.ts
          src/test/incident-automation-readiness.test.ts
          src/test/incident-evidence-depth.test.ts
          src/test/tok-intelligence-suite.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build:prod

      - name: Validate diff and secret safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff | grep -Eiq '(sk-proj-|sk-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|whsec_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})'; then
            echo "::error::A secret-like value was detected in the generated diff."
            exit 1
          fi

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/apply-incident-cache-stability.yml
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(ops): stabilize incident cache and compact support context"
          git push origin HEAD:feat/unify-incident-intelligence
