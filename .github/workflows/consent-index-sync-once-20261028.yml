name: One-time TOK signup consent index sync
on:
  push:
    branches:
      - fix/signup-consents-at-form-bottom-20261028
permissions:
  contents: write
jobs:
  regenerate-index:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Enable Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove temporary workflow and rebuild application index
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/consent-index-sync-once-20261028.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add -- docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(auth): regenerate merged application index'
          git push origin HEAD:refs/heads/fix/signup-consents-at-form-bottom-20261028
