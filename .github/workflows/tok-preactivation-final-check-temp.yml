name: TOK preactivation final branch verification

on:
  push:
    branches:
      - feat/restaurant-preactivation-weekly-ai-credits-20261014
    paths:
      - .github/workflows/tok-preactivation-final-check-temp.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/restaurant-preactivation-weekly-ai-credits-20261014
          fetch-depth: 1
          persist-credentials: true
      - name: Remove temporary workflow
        run: git rm -- .github/workflows/tok-preactivation-final-check-temp.yml
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regenerate references from latest main and AI branch
        run: pnpm docs:application-index
      - name: Verify references
        run: pnpm docs:application-index:check
      - name: Run AI, billing, canonical reference and TOK Printer tests
        run: pnpm exec vitest run --mode production src/test/restaurant-preactivation-ai-credits.test.ts src/test/tok-ai-tools.test.ts src/test/restaurant-billing-account.test.ts src/test/application-search-index.test.ts src/test/marketing-print-contract.test.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Publish generated index and remove temp workflow permanently
        if: always()
        run: |
          set -euo pipefail
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): refresh after merging latest main into AI credit branch"
          git push origin HEAD:refs/heads/feat/restaurant-preactivation-weekly-ai-credits-20261014
