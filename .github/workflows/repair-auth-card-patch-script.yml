name: Repair auth card patch script

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/restaurateur-onboarding-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/restaurateur-onboarding-reliability
          fetch-depth: 1

      - name: Make confirmation effect insertion anchor-based
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-restaurateur-auth-card-fix.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('    mount_effect = textwrap.dedent(')
          end_marker = '    auth = replace_once(auth, mount_effect, confirmation_effect, "confirmation effect")'
          end = source.index(end_marker, start) + len(end_marker)
          replacement = r'''    mount_start = auth.find("  useEffect(() => {\n    authMountedRef.current = true;")
          mount_end = auth.find("\n\n  const requiredDocuments", mount_start)
          if mount_start < 0 or mount_end < 0:
              raise RuntimeError("auth mount effect not found")
          confirmation_effect = auth[mount_start:mount_end] + textwrap.dedent(
              '''\

                useEffect(() => {
                  if (!confirmationCompleted || user) return;

                  setPrivilegedSignupAwaitingEmail(false);
                  setPrivilegedSignupResumeChecking(false);
                  setIsLogin(true);
                  setForgotPassword(false);

                  if (!confirmationNoticeShownRef.current) {
                    confirmationNoticeShownRef.current = true;
                    toast({
                      title: "Email confirmé",
                      description: "Votre dossier restaurateur est conservé. La connexion finalisera automatiquement l’inscription.",
                    });
                  }

                  if (!confirmationOperationId) return;
                  let cancelled = false;
                  void loadPrivilegedSignupRecoveryDraft(confirmationOperationId)
                    .then((draft) => {
                      if (!draft || cancelled) return;
                      setSignupForm((current) => ({
                        ...current,
                        email: current.email || draft.email,
                      }));
                      setRoleMode(draft.role);
                      privilegedSignupOperationRef.current = {
                        key: `${draft.email}:${draft.role}`,
                        id: draft.operationId,
                      };
                    })
                    .catch(() => undefined);

                  return () => {
                    cancelled = true;
                  };
                }, [confirmationCompleted, confirmationOperationId, toast, user]);
              '''
          )
          auth = auth[:mount_start] + confirmation_effect + auth[mount_end:]'''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY

      - name: Commit script repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply-restaurateur-auth-card-fix.py
          git diff --cached --check
          git commit -m "chore: make auth confirmation patch anchor-based"
          git push origin HEAD:fix/restaurateur-onboarding-reliability
