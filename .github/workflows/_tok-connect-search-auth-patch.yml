name: TOK Connect Search OAuth Patch

on:
  push:
    branches:
      - work/tok-connect-mcp-pulse-widget-20260903

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[search-oauth-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: work/tok-connect-mcp-pulse-widget-20260903

      - name: Patch search OAuth metadata
        run: node scripts/_patch-tok-connect-search-auth.mjs

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -A5 'name: "search"' supabase/functions/tok-connect-chatgpt/index.ts | grep -q 'authenticated TOK Connect user'
          grep -A25 'name: "search"' supabase/functions/tok-connect-chatgpt/index.ts | grep -q 'securitySchemes: OAUTH_SECURITY'

      - name: Commit only the gateway change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mtnrconcept"
          git config user.email "149347251+mtnrconcept@users.noreply.github.com"
          git add supabase/functions/tok-connect-chatgpt/index.ts
          git commit -m "fix(tok-connect): protéger search par OAuth [search-oauth-patched]"
          git push origin HEAD:work/tok-connect-mcp-pulse-widget-20260903
