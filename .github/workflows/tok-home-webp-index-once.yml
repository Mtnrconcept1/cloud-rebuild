name: TOK Home WebP docs index (one shot)
on:
  push:
    branches:
      - codex/tok-home-webp-responsive-20261014
    paths:
      - .github/workflows/tok-home-webp-index-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/codex/tok-home-webp-responsive-20261014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:application-index
      - name: Commit only generated indexes to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          if git diff --cached --quiet; then
            echo 'Generated indexes are already current.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(docs): refresh generated TOK application indexes for WebP assets'
          git push origin HEAD:refs/heads/codex/tok-home-webp-responsive-20261014
