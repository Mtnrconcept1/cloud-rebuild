name: Apply password recovery and account security

on:
  push:
    branches:
      - fix/password-recovery-and-account-security

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[password-security-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/password-recovery-and-account-security
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply reviewed patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} anchor, found {count}")
              return text.replace(old, new, 1)

          auth_path = Path("src/pages/Auth.tsx")
          auth = auth_path.read_text()
          auth = replace_once(
              auth,
              'import RestaurantPartnerContractPreview, {\n  RESTAURANT_PARTNER_CONTRACT_EXPORT_ACTION_LABEL,\n} from "@/components/contracts/RestaurantPartnerContractPreview";\n',
              'import RestaurantPartnerContractPreview, {\n  RESTAURANT_PARTNER_CONTRACT_EXPORT_ACTION_LABEL,\n} from "@/components/contracts/RestaurantPartnerContractPreview";\nimport AccountPasswordForm from "@/components/auth/AccountPasswordForm";\n',
              "Auth password form import",
          )
          auth = replace_once(
              auth,
              '  const [forgotPassword, setForgotPassword] = useState(false);\n',
              '  const [forgotPassword, setForgotPassword] = useState(false);\n  const [passwordRecoveryMode, setPasswordRecoveryMode] = useState(\n    searchParams.get("mode") === "recovery",\n  );\n',
              "Auth recovery state",
          )
          auth = replace_once(
              auth,
              '  useEffect(() => {\n    authMountedRef.current = true;\n    return () => {\n      authMountedRef.current = false;\n    };\n  }, []);\n',
              '  useEffect(() => {\n    authMountedRef.current = true;\n    return () => {\n      authMountedRef.current = false;\n    };\n  }, []);\n\n  useEffect(() => {\n    if (searchParams.get("mode") === "recovery") {\n      setPasswordRecoveryMode(true);\n      setIsLogin(true);\n      setForgotPassword(false);\n    }\n\n    const { data: authListener } = supabase.auth.onAuthStateChange((event) => {\n      if (event === "PASSWORD_RECOVERY") {\n        setPasswordRecoveryMode(true);\n        setIsLogin(true);\n        setForgotPassword(false);\n      }\n    });\n\n    return () => authListener.subscription.unsubscribe();\n  }, [searchParams]);\n',
              "Auth recovery listener",
          )
          auth = replace_once(
              auth,
              '    (selectedRole: UserRole, replace = false) => {\n      const target = getPostAuthTarget(selectedRole);\n',
              '    (selectedRole: UserRole, replace = false) => {\n      if (passwordRecoveryMode) return;\n      const target = getPostAuthTarget(selectedRole);\n',
              "Auth redirect guard",
          )
          auth = replace_once(
              auth,
              '    [getPostAuthTarget, navigate],\n',
              '    [getPostAuthTarget, navigate, passwordRecoveryMode],\n',
              "Auth redirect dependencies",
          )
          auth = replace_once(
              auth,
              '          redirectTo: isDemoAuthMode\n            ? `${window.location.origin}/auth/demo`\n            : getCanonicalAuthHref(),\n',
              '          redirectTo: isDemoAuthMode\n            ? `${window.location.origin}/auth/demo?mode=recovery`\n            : `${getCanonicalAuthHref()}?mode=recovery`,\n',
              "Auth recovery redirect",
          )
          role_picker_anchor = '  if (showRolePicker && user && canSwitchRole && switchableRoles.length > 1) {\n'
          recovery_render = '''  if (passwordRecoveryMode) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-secondary/10 px-4 py-10">
        <Card className="w-full max-w-md shadow-lg border-0">
          <CardHeader className="text-center space-y-3">
            <img src={logoSrc} alt="Tok" className="mx-auto h-20 w-auto object-contain" />
            <CardTitle className="font-display text-2xl">Créer un nouveau mot de passe</CardTitle>
            <CardDescription>
              Choisissez votre nouveau mot de passe. Vous reviendrez ensuite à la page de connexion.
            </CardDescription>
          </CardHeader>
          <CardContent>
            <AccountPasswordForm
              recovery
              onSuccess={async () => {
                await supabase.auth.signOut({ scope: "local" });
                setPasswordRecoveryMode(false);
                setIsLogin(true);
                setForgotPassword(false);
                navigate("/auth", { replace: true });
              }}
            />
          </CardContent>
        </Card>
      </div>
    );
  }

'''
          auth = replace_once(auth, role_picker_anchor, recovery_render + role_picker_anchor, "Auth recovery render")
          auth = replace_once(
              auth,
              '    !incompletePrivilegedSignupRole\n  )\n    return null;\n',
              '    !incompletePrivilegedSignupRole &&\n    !passwordRecoveryMode\n  )\n    return null;\n',
              "Auth authenticated render guard",
          )
          auth_path.write_text(auth)

          profile_path = Path("src/pages/Profil.tsx")
          profile = profile_path.read_text()
          profile = replace_once(
              profile,
              'import SignupApplicationStatusCard from "@/components/signup/SignupApplicationStatusCard";\n',
              'import SignupApplicationStatusCard from "@/components/signup/SignupApplicationStatusCard";\nimport AccountPasswordForm from "@/components/auth/AccountPasswordForm";\n',
              "Profile password form import",
          )
          settings_anchor = '          <TabsContent value="parametres" className="space-y-6 pt-4">\n'
          settings_card = '''          <TabsContent value="parametres" className="space-y-6 pt-4">
            <div className="rounded-xl border bg-card p-6 space-y-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
                  <Shield className="h-5 w-5 text-primary" />
                </div>
                <div>
                  <h3 className="font-semibold">Mot de passe et sécurité</h3>
                  <p className="text-xs text-muted-foreground">Ce mot de passe donne accès à tous vos espaces TOK.</p>
                </div>
              </div>
              {isCommercialDemoClient ? (
                <p className="text-sm text-muted-foreground">
                  Le changement de mot de passe est désactivé dans la démonstration commerciale.
                </p>
              ) : (
                <AccountPasswordForm />
              )}
            </div>
'''
          profile = replace_once(profile, settings_anchor, settings_card, "Profile settings security card")
          profile_path.write_text(profile)

          app_path = Path("src/App.tsx")
          app = app_path.read_text()
          app = replace_once(
              app,
              'import { BrowserRouter, Routes, Route, Navigate, useLocation, useNavigate } from "react-router-dom";\n',
              'import { BrowserRouter, Routes, Route, Navigate, Link, useLocation, useNavigate } from "react-router-dom";\n',
              "App Link import",
          )
          app = replace_once(
              app,
              'const Profil = lazy(() => import("./pages/Profil"));\n',
              'const Profil = lazy(() => import("./pages/Profil"));\nconst AccountSecurity = lazy(() => import("./pages/AccountSecurity"));\n',
              "Account security lazy import",
          )
          app = replace_once(
              app,
              '          <Route path="/profil" element={<ProtectedRoute requiredRole="client"><Profil /></ProtectedRoute>} />\n',
              '          <Route path="/profil" element={<ProtectedRoute requiredRole="client"><Profil /></ProtectedRoute>} />\n          <Route path="/parametres/securite" element={<ProtectedRoute><AccountSecurity /></ProtectedRoute>} />\n',
              "Account security route",
          )
          shortcut = '''        <Link
          to="/parametres/securite"
          className="hidden h-11 items-center rounded-full border border-border/70 bg-background/95 px-4 text-sm font-medium text-foreground shadow-sm transition-colors hover:bg-accent md:flex"
        >
          Paramètres
        </Link>
'''
          role_switch_count = app.count('        <RoleSpaceSwitcher compact />\n')
          if role_switch_count < 2:
              raise SystemExit(f"Expected dashboard role switcher anchors, found {role_switch_count}")
          app = app.replace('        <RoleSpaceSwitcher compact />\n', '        <RoleSpaceSwitcher compact />\n' + shortcut)
          app_path.write_text(app)
          PY

      - name: Validate targeted behavior
        run: |
          pnpm exec prettier --write src/pages/Auth.tsx src/pages/Profil.tsx src/App.tsx src/components/auth/AccountPasswordForm.tsx src/pages/AccountSecurity.tsx src/test/password-recovery-routing.test.ts
          pnpm exec vitest run src/test/auth-password-recovery.test.ts src/test/password-recovery-routing.test.ts
          pnpm run typecheck
          pnpm run lint

      - name: Commit reviewed result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-password-recovery-and-account-security.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Auth.tsx src/pages/Profil.tsx src/App.tsx src/components/auth/AccountPasswordForm.tsx src/pages/AccountSecurity.tsx src/test/password-recovery-routing.test.ts .github/workflows/apply-password-recovery-and-account-security.yml
          git commit -m "fix(auth): route recovery links to password reset [password-security-applied]"
          git push origin HEAD:fix/password-recovery-and-account-security
