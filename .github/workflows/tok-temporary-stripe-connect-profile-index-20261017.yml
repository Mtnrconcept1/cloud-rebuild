name: Temporary Stripe Connect rebased index refresh
on:
  push:
    branches:
      - codex/stripe-connect-profile-error-20261017
concurrency:
  group: tok-connect-profile-index-20261017
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build regenerated canonical files
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          git rm --quiet .github/workflows/tok-temporary-stripe-connect-profile-index-20261017.yml
          node scripts/generate-error-code-map.mjs
          node scripts/generate-application-index.mjs
          node scripts/generate-application-index.mjs --check
      - uses: actions/upload-artifact@v4
        with:
          name: tok-stripe-connect-rebased-refs
          retention-days: 1
          if-no-files-found: error
          path: |
            supabase/functions/_shared/error-code-map.ts
            docs/architecture/TOK_APPLICATION_REFERENCE.md
            docs/architecture/tok-application-search-index.json
            src/data/tok-user-guide-catalog.generated.ts
  commit-generated:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/stripe-connect-profile-error-20261017
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: tok-stripe-connect-rebased-refs
          path: .
      - name: Commit regenerated index and self-remove
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/stripe-connect-profile-error-20261017"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rm --quiet .github/workflows/tok-temporary-stripe-connect-profile-index-20261017.yml
          git add supabase/functions/_shared/error-code-map.ts docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(stripe-connect): sync canonical references after Golden TOK merge"
          git push origin HEAD:refs/heads/codex/stripe-connect-profile-error-20261017
