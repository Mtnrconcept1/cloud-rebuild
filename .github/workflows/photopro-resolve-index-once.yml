name: PhotoPro regenerate index after main integration
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/photopro-style-reference-weight-20261030' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate derived indexes after preserving main changes
        run: |
          git rm -- .github/workflows/photopro-resolve-index-once.yml
          pnpm run generate:error-code-map
          pnpm docs:application-index
          pnpm docs:application-index:check
          pnpm exec vitest run src/test/incident-evidence-depth.test.ts src/test/ai-image-reference-security.test.ts src/test/tok-ai-tools.test.ts
          git add -- supabase/functions/_shared/error-code-map.ts docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git -c user.name="TOK GitHub Actions" -c user.email="actions@users.noreply.github.com" commit -m "docs(photopro): regenerate indexes after main integration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
