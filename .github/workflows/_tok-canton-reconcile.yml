name: TOK canton branch reconciliation
on:
  push:
    branches:
      - codex/tok-home-canton-localization-20261012
    paths:
      - .github/workflows/_tok-canton-reconcile.yml
permissions:
  contents: write
  actions: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: codex/tok-home-canton-localization-20261012
          fetch-depth: 35
          persist-credentials: true
      - name: Merge current main without discarding application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TOK CI Assistant"
          git config user.email "tok-ci-assistant@users.noreply.github.com"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge --no-edit --no-ff origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for file in "${conflicts[@]}"; do
              case "$file" in
                docs/architecture/TOK_APPLICATION_REFERENCE.md|docs/architecture/tok-application-search-index.json)
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                  ;;
                *) echo "::error::Unexpected conflict: $file"; exit 1 ;;
              esac
            done
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit --no-edit
          fi
      - name: Install dependencies
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Generate and verify final index
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
          rm .github/workflows/_tok-canton-reconcile.yml
          git add -u .github/workflows/_tok-canton-reconcile.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          pnpm exec vitest run --mode production src/test/home-canton-hero.test.ts src/test/home-hero-search.test.tsx src/test/home-core-web-vitals.test.ts src/test/vercel-rewrites.test.ts src/test/application-search-index.test.ts
          pnpm lint
          pnpm typecheck
          VITE_SUPABASE_URL=https://example.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=ci-public-placeholder VITE_SUPABASE_ANON_KEY=ci-public-placeholder pnpm build
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          git diff --cached --check
          git commit -m "fix(home): reconcile canton artwork and regenerate index against latest main"
          git push origin HEAD:refs/heads/codex/tok-home-canton-localization-20261012
      - name: Start final GitHub CI verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref codex/tok-home-canton-localization-20261012
