name: Temporary regenerate application index

on:
  push:
    branches:
      - fix/admin-commercial-supabase-errors

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-commercial-supabase-errors
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regenerate canonical application index
        run: pnpm docs:application-index
      - name: Remove temporary workflow
        run: rm .github/workflows/_temporary-admin-fix-application-index.yml
      - name: Verify canonical application index
        run: pnpm docs:application-index:check
      - name: Commit generated files and self-removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "docs(application): regenerate canonical index"
          git push origin HEAD:fix/admin-commercial-supabase-errors
