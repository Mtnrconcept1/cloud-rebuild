name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
      - "hotfix/**"
      - "fix/tok-restaurant-first-charge-20261014"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  once_reconcile_tok_finance_branch:
    name: One-shot billing branch reconciliation
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/fix/tok-restaurant-first-charge-20261014') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/tok-restaurant-first-charge-20261014') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Integrate main, regenerate artifacts, self-restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            git diff --name-only --diff-filter=U | sort > /tmp/tok-conflicts-actual
            printf '%s\n' \
              'docs/architecture/TOK_APPLICATION_REFERENCE.md' \
              'docs/architecture/tok-application-search-index.json' \
              'src/data/tok-user-guide-catalog.generated.ts' | sort > /tmp/tok-conflicts-allowed
            diff -u /tmp/tok-conflicts-allowed /tmp/tok-conflicts-actual
            git checkout --ours -- \
              docs/architecture/TOK_APPLICATION_REFERENCE.md \
              docs/architecture/tok-application-search-index.json \
              src/data/tok-user-guide-catalog.generated.ts
            git add -- \
              docs/architecture/TOK_APPLICATION_REFERENCE.md \
              docs/architecture/tok-application-search-index.json \
              src/data/tok-user-guide-catalog.generated.ts
          fi
          # Restore the original workflow before indexing and committing.
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run generate:error-code-map
          pnpm run docs:application-index
          pnpm run docs:application-index:check
          git add -- .github/workflows/ci.yml \
            supabase/functions/_shared/error-code-map.ts \
            docs/architecture/TOK_APPLICATION_REFERENCE.md \
            docs/architecture/tok-application-search-index.json \
            src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git commit -m 'merge(finance): integrate current main and refresh derived docs'
          git push origin HEAD:refs/heads/fix/tok-restaurant-first-charge-20261014
          gh workflow run ci.yml --ref fix/tok-restaurant-first-charge-20261014

  validation:
    uses: ./.github/workflows/_validation.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      force_full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' }}
      force_deploy: false
      skip_build: false

  validate:
    name: validate
    if: ${{ always() }}
    needs: validation
    runs-on: ubuntu-latest

    steps:
      - name: Verify reusable validation
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [[ "$VALIDATION_RESULT" != "success" ]]; then
            echo "::error::Reusable validation finished with ${VALIDATION_RESULT}."
            exit 1
          fi
