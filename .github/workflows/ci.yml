name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
      - "hotfix/**"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    uses: ./.github/workflows/_validation.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      force_full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' }}
      force_deploy: false
      skip_build: false

  validate:
    name: validate
    if: ${{ always() }}
    needs: validation
    runs-on: ubuntu-latest

    steps:
      - name: Verify reusable validation
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [[ "$VALIDATION_RESULT" != "success" ]]; then
            echo "::error::Reusable validation finished with ${VALIDATION_RESULT}."
            exit 1
          fi

  prepare_tok_outlook_hero:
    name: Finalize compatible TOK email artwork (one-time)
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/tok-reservation-email-outlook-20261013' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tok-reservation-email-outlook-20261013
          persist-credentials: true
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Convert approved TOK WebP artwork to Outlook-compatible JPEG
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tok-outlook-pillow
          /tmp/tok-outlook-pillow/bin/pip install --quiet Pillow
          /tmp/tok-outlook-pillow/bin/python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          source = Path("public/images/emails/tok-reservation-hero.webp")
          destination = Path("public/images/emails/tok-reservation-hero.jpg")
          with Image.open(source) as im:
              if im.size != (1400, 700):
                  raise SystemExit(f"Unexpected source image dimensions: {im.size}")
              im.convert("RGB").save(destination, "JPEG", quality=84, optimize=True, progressive=False)
          image_bytes = destination.read_bytes()
          if image_bytes[:3] != bytes((255, 216, 255)) or len(image_bytes) > 500000:
              raise SystemExit("Output JPEG failed safety or size validation")
          print("Validated:", str(destination), len(image_bytes), hashlib.sha256(image_bytes).hexdigest())
          PY
      - name: Restore CI workflow and regenerate TOK application index
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main'
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add .github/workflows/ci.yml public/images/emails/tok-reservation-hero.jpg
          pnpm install --frozen-lockfile
          pnpm run docs:application-index
          pnpm run docs:application-index:check
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          git config user.name "tok-ci-bot"
          git config user.email "tok-ci-bot@users.noreply.github.com"
          git commit -m "fix(email): add Outlook JPEG artwork and refresh app index"
          git push origin HEAD:refs/heads/fix/tok-reservation-email-outlook-20261013
