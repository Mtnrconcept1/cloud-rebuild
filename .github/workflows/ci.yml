name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
      - "hotfix/**"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    uses: ./.github/workflows/_validation.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      force_full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' }}
      force_deploy: false
      skip_build: false

  validate:
    name: validate
    if: ${{ always() }}
    needs: validation
    runs-on: ubuntu-latest

    steps:
      - name: Verify reusable validation
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [[ "$VALIDATION_RESULT" != "success" ]]; then
            echo "::error::Reusable validation finished with ${VALIDATION_RESULT}."
            exit 1
          fi

  sync_reservation_email_with_main:
    name: Synchronize PR #801 with main and restore reference index (one-off)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 801 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/reservation-email-responsive-20261013' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reservation-email-responsive-20261013
          fetch-depth: 50
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Integrate current main safely, resolving only generated index files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tok-ci-bot"
          git config user.email "tok-ci-bot@users.noreply.github.com"
          git fetch --no-tags --depth=50 origin '+refs/heads/main:refs/remotes/origin/main'
          if git merge --no-commit --no-ff origin/main; then
            echo 'Merge clean'
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Index merge conflicts: %s\n' "${conflicts[*]}"
            test "${#conflicts[@]}" -eq 2
            printf '%s\n' "${conflicts[@]}" | grep -Fx 'docs/architecture/TOK_APPLICATION_REFERENCE.md'
            printf '%s\n' "${conflicts[@]}" | grep -Fx 'docs/architecture/tok-application-search-index.json'
            git checkout --ours -- docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
            git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          fi
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          corepack pnpm install --frozen-lockfile
          corepack pnpm run docs:application-index
          corepack pnpm run docs:application-index:check
          git add .github/workflows/ci.yml docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          git commit -m "chore(email): integrate main and regenerate canonical index"
          git push origin HEAD:refs/heads/feat/reservation-email-responsive-20261013
