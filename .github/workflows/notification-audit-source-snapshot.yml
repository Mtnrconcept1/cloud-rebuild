name: Finish isolated notification audit
on:
  push:
    branches: [fix/notification-business-wiring-20261021]
    paths: [.github/workflows/notification-audit-source-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: finish-notification-business-wiring-20261021
  cancel-in-progress: false
jobs:
  finish:
    if: github.ref == 'refs/heads/fix/notification-business-wiring-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: notification_fixture
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: notification_fixture
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify isolated branch and install locked dependencies
        run: |
          test "$GITHUB_REF" = refs/heads/fix/notification-business-wiring-20261021
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git switch -C fix/notification-business-wiring-20261021
          git fetch origin 4a55e19d4437b3f401dae62382a8151ba9e0410a --depth=1
          pnpm install --frozen-lockfile
          mkdir -p _notification_validation
      - name: Apply reviewed changes only to verified source blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              p=Path(path); source=p.read_text()
              if source.count(old)!=count:
                  raise SystemExit(f'Source changed unexpectedly: {path}')
              p.write_text(source.replace(old,new))
          replace('supabase/functions/_shared/notifications.ts',
              '  if (!baseUrl || !serviceRoleKey) return;',
              '  if (!baseUrl || !serviceRoleKey) {\n    throw new Error(`${functionName} dispatcher configuration missing`);\n  }')
          replace('supabase/functions/_shared/notifications.ts',
              '  const response = await fetch(`${baseUrl}/functions/v1/${functionName}`, {',
              '  const response = await fetch(`${baseUrl.replace(/\\/+$/, "")}/functions/v1/${functionName}`, {\n    signal: AbortSignal.timeout(10_000),')
          replace('supabase/functions/_shared/notifications.ts',
              '  if (!response.ok) {\n    const body = await response.text();\n    throw new Error(`${functionName} failed: ${response.status} ${body}`);\n  }',
              '''  if (!response.ok) {
              // Never propagate a provider body that may contain private data.
              throw new Error(`${functionName} failed: ${response.status}`);
            }
            const result: unknown = await response.json().catch(() => null);
            if (!result || typeof result !== "object" || Array.isArray(result)) {
              throw new Error(`${functionName} returned an invalid acknowledgement`);
            }
            const summary = result as Record<string, unknown>;
            if (summary.ok === false || summary.success === false || summary.error) {
              throw new Error(`${functionName} reported an application error`);
            }
            if (typeof summary.processed !== "number" || !Number.isFinite(summary.processed) || summary.processed < 0
                || (summary.failed !== undefined && (typeof summary.failed !== "number" || !Number.isFinite(summary.failed) || summary.failed < 0))) {
              throw new Error(`${functionName} returned an invalid acknowledgement`);
            }
            if (typeof summary.failed === "number" && summary.failed > 0) {
              throw new Error(`${functionName} reported ${summary.failed} failed deliveries`);
            }'''.replace('\n          ', '\n'))
          replace('src/lib/notificationRouting.ts',
              '  const supportIncidentId = firstString(data.support_incident_id, data.incident_id, data.ticket_id);',
              '''  // Business destinations follow the active role, never an admin URL
            // carried by an older notification while the user views another space.
            if (notification.type === "golden_tok") {
              if (role === "admin") return "/admin/drops";
              if (role === "restaurateur") return "/dashboard/formules";
              return getNotificationCenterPathForRole(role, fallback);
            }
            if (notification.type === "signup_application") {
              return role === "admin" ? "/admin/utilisateurs?tab=applications" : "/auth";
            }
            if (notification.type === "restaurant_subscription") {
              if (role === "admin") return "/admin/restaurants";
              if (role === "restaurateur") return "/dashboard/mon-compte-facturation";
              return getNotificationCenterPathForRole(role, fallback);
            }

            const supportIncidentId = firstString(data.support_incident_id, data.incident_id, data.ticket_id);'''.replace('\n          ', '\n'))
          replace('src/lib/realtimeNotifications.ts',
              'function invalidateNotificationQueries(queryClient: QueryClient, userId: string) {\n  queryClient.invalidateQueries({ queryKey: ["navbar-notifications", userId] });\n  queryClient.invalidateQueries({ queryKey: ["notifications", userId] });\n}',
              '''function invalidateNotificationQueries(queryClient: QueryClient, userId: string, notification?: RealtimeNotification) {
            queryClient.invalidateQueries({ queryKey: ["navbar-notifications", userId] });
            queryClient.invalidateQueries({ queryKey: ["notifications", userId] });
            const data = notification?.data && typeof notification.data === "object" && !Array.isArray(notification.data)
              ? notification.data : {};
            const restaurantId = typeof data.restaurant_id === "string" && data.restaurant_id.trim()
              ? data.restaurant_id.trim() : null;
            if (notification?.type === "golden_tok") {
              if (data.recipient_role === "admin") queryClient.invalidateQueries({ queryKey: ["admin-golden-tok-applications"] });
              if (restaurantId && data.recipient_role === "restaurateur") {
                queryClient.invalidateQueries({ queryKey: ["golden-tok-accreditation", restaurantId] });
                queryClient.invalidateQueries({ queryKey: ["golden-tok-formulas", restaurantId] });
              }
            } else if (notification?.type === "signup_application") {
              if (data.recipient_role === "admin") queryClient.invalidateQueries({ queryKey: ["admin-signup-applications"] });
              else queryClient.invalidateQueries({ queryKey: ["signup-application", userId] });
            } else if (notification?.type === "restaurant_subscription") {
              if (data.recipient_role === "admin") queryClient.invalidateQueries({ queryKey: ["admin-restaurant-subscriptions"] });
              if (restaurantId && data.recipient_role === "restaurateur") {
                queryClient.invalidateQueries({ queryKey: ["restaurant-subscription-self-service", restaurantId] });
              }
            }
          }'''.replace('\n          ', '\n'))
          replace('src/lib/realtimeNotifications.ts',
              '            invalidateNotificationQueries(current.queryClient, userId);',
              '            invalidateNotificationQueries(current.queryClient, userId, notification);')
          replace('supabase/functions/send-email/index.ts',
              '  const appBaseUrl = Deno.env.get("APP_BASE_URL") || Deno.env.get("PUBLIC_APP_URL") || Deno.env.get("SITE_URL") || "https://www.thetok.ch";',
              '  const appBaseUrl = data.recipient_role === "admin"\n    ? "https://admin.thetok.ch"\n    : Deno.env.get("APP_BASE_URL") || Deno.env.get("PUBLIC_APP_URL") || Deno.env.get("SITE_URL") || "https://www.thetok.ch";')
          migration='supabase/migrations/20261021110000_business_notification_event_wiring.sql'
          replace(migration, "ELSE '/?chat=open' END;", "ELSE '/aide' END;", count=2)
          replace(migration, "v_body:='Une nouvelle réponse du support est disponible dans votre conversation TOK.';", "v_body:='Une nouvelle réponse du support est disponible. Ouvrez votre conversation depuis l’aide TOK ou votre espace support.';")
          replace(migration, 'ALTER TABLE public.notification_business_events ENABLE ROW LEVEL SECURITY;',
              "CREATE INDEX IF NOT EXISTS email_queue_signup_notification_lookup_idx\n  ON public.email_queue(lower(to_email),(metadata->>'application_id'),(metadata->>'kind'),created_at)\n  WHERE metadata->>'kind' IN ('signup_admin_alert','signup_decision');\nALTER TABLE public.notification_business_events ENABLE ROW LEVEL SECURITY;")
          replace(migration, "            AND q.metadata->>'kind'=e.legacy_email_kind", "            AND q.metadata->>'kind' IN ('signup_admin_alert','signup_decision')\n            AND q.metadata->>'kind'=e.legacy_email_kind")
          smoke='src/test/sql/business_notifications_smoke.sql'
          replace(smoke, '\\endif\nROLLBACK;', '''-- A user who owns the restaurant and is also admin receives one projection.
          INSERT INTO public.user_roles VALUES ('00000000-0000-4000-8000-000000000001','admin');
          UPDATE public.restaurants SET owner_id='00000000-0000-4000-8000-000000000001' WHERE id='10000000-0000-4000-8000-000000000001';
          UPDATE public.golden_tok_accreditations SET status='pending' WHERE restaurant_id='10000000-0000-4000-8000-000000000001';
          SELECT public.process_notification_business_events(100);
          SELECT public.notification_test_assert((SELECT count(*)=2 FROM public.notifications WHERE type='golden_tok' AND data->>'event'='pending' AND user_id='00000000-0000-4000-8000-000000000001'),'admin who owns the restaurant is not double-notified');
          -- A persistent enqueue error is retained, bounded and does not loop.
          INSERT INTO public.notification_preferences VALUES ('00000000-0000-4000-8000-000000000004','{"email":"invalid-boolean"}','{}');
          SELECT public.queue_business_notification('bounded-retry-fixture','00000000-0000-4000-8000-000000000004','applicant','Fixture','Fixture','fixture','{}');
          DO $$ BEGIN
            FOR i IN 1..6 LOOP
              UPDATE public.notification_business_events SET next_attempt_at=now() WHERE event_key='bounded-retry-fixture' AND status='retrying';
              PERFORM public.process_notification_business_events(100);
            END LOOP;
          END $$;
          SELECT public.notification_test_assert((SELECT status='failed' AND attempts=5 AND next_attempt_at IS NULL FROM public.notification_business_events WHERE event_key='bounded-retry-fixture'),'persistent errors stop after five attempts');
          SELECT public.queue_business_notification('bounded-retry-fixture','00000000-0000-4000-8000-000000000004','applicant','Fixture','Fixture','fixture','{}');
          SELECT public.notification_test_assert((SELECT count(*)=1 FROM public.notification_business_events WHERE event_key='bounded-retry-fixture'),'capture idempotency preserves a single event recipient');
          \\endif
          ROLLBACK;'''.replace('\n          ', '\n'))
          print('Applied only the reviewed notification changes.')
          PY
      - name: Retire temporary workflow and regenerate reference files on the real Git tree
        run: |
          git rm .github/workflows/notification-audit-source-snapshot.yml
          git add src/lib/notificationRouting.ts src/lib/realtimeNotifications.ts supabase/functions/_shared/notifications.ts supabase/functions/send-email/index.ts supabase/migrations/20261021110000_business_notification_event_wiring.sql src/test/sql/business_notifications_smoke.sql
          pnpm docs:application-index
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          pnpm docs:application-index:check | tee _notification_validation/index.log
          git diff --cached --check
      - name: Verify PostgreSQL events, retry and access isolation
        run: |
          python3 - <<'PY'
          import pathlib,re
          functions=[('supabase/migrations/20260329140000_fix_notification_pipeline_newsletter_column.sql','enqueue_notification'),('supabase/migrations/20260907011600_notification_delivery_reliability.sql','queue_notification_deliveries')]
          output=[]
          for path,name in functions:
              source=pathlib.Path(path).read_text()
              match=re.search(r'CREATE OR REPLACE FUNCTION public\.'+name+r'\([\s\S]*?\n\$\$;',source)
              if not match: raise SystemExit('Missing reviewed fixture function: '+name)
              output.append(match.group(0))
          pathlib.Path('src/test/sql/_notification_queue_fixture.sql').write_text('\n'.join(output))
          PY
          set -o pipefail
          psql -X -v ON_ERROR_STOP=1 -v apply_notification_patch=true -f src/test/sql/business_notifications_smoke.sql 2>&1 | tee _notification_validation/postgres.log
          rm src/test/sql/_notification_queue_fixture.sql
      - name: Verify TypeScript notification behavior and regression contracts
        run: |
          set -o pipefail
          pnpm exec vitest run src/test/notification-business-dispatch.test.ts src/test/notification-business-routing.test.ts src/test/realtime-notifications.test.ts src/test/realtime-notification-recovery.test.ts src/test/notification-campaign-idempotency.test.ts src/test/notification-support-realtime-publication.test.ts src/test/admin-notifications-governance.test.ts src/test/dashboard-notification-day-badges.test.ts src/test/notifications-ai-admin-hardening.test.ts src/test/notifications-sinistres-governance.test.ts src/test/support-notification-governance.test.ts src/test/golden-tok-accreditation.test.ts 2>&1 | tee _notification_validation/vitest.log
      - name: Lint, typecheck and build
        run: |
          set -o pipefail
          pnpm exec eslint src/lib/notificationRouting.ts src/lib/realtimeNotifications.ts supabase/functions/_shared/notifications.ts supabase/functions/send-email/index.ts src/test/notification-business-dispatch.test.ts src/test/notification-business-routing.test.ts 2>&1 | tee _notification_validation/lint.log
          pnpm typecheck 2>&1 | tee _notification_validation/typecheck.log
          pnpm build 2>&1 | tee _notification_validation/build.log
      - name: Commit only validated files to the dedicated branch
        run: |
          test "$GITHUB_REF" = refs/heads/fix/notification-business-wiring-20261021
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess
          allowed={'.github/workflows/notification-audit-source-snapshot.yml','src/lib/notificationRouting.ts','src/lib/realtimeNotifications.ts','supabase/functions/_shared/notifications.ts','supabase/functions/send-email/index.ts','supabase/migrations/20261021110000_business_notification_event_wiring.sql','src/test/sql/business_notifications_smoke.sql','docs/architecture/TOK_APPLICATION_REFERENCE.md','docs/architecture/tok-application-search-index.json','src/data/tok-user-guide-catalog.generated.ts'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          if not changed or not changed <= allowed: raise SystemExit(f'Unexpected staged paths: {changed-allowed}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(notifications): validate dispatch acknowledgements and wire business alert views'
          git push origin HEAD:refs/heads/fix/notification-business-wiring-20261021
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD | tee _notification_validation/commit.txt
      - name: Package complete changed files and their checksums
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,hashlib,json,zipfile
          root=pathlib.Path.cwd(); base='4a55e19d4437b3f401dae62382a8151ba9e0410a'
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines()
          manifest={'base':base,'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files':{}}
          with zipfile.ZipFile('_notification_validation/TOK_notifications_fichiers_complets.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  p=root/name
                  if p.is_file():
                      archive.write(p,name); manifest['files'][name]=hashlib.sha256(p.read_bytes()).hexdigest()
              archive.writestr('MANIFEST.json',json.dumps(manifest,indent=2,ensure_ascii=False))
          (root/'_notification_validation/manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False))
          print(json.dumps({'commit':manifest['commit'],'files':paths},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-audit-validation
          path: _notification_validation/
          retention-days: 3
          if-no-files-found: warn
