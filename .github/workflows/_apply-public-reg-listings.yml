name: Apply public REG restaurant listings

on:
  push:
    branches:
      - feat/public-reg-restaurant-listings
    paths:
      - .github/apply-public-reg-listings.py
      - .github/finalize-public-reg-patch.py
      - .github/workflows/_apply-public-reg-listings.yml
      - scripts/generate-public-reg-seed.py
      - scripts/public-reg-ids/**
      - supabase/migrations/20260829220000_public_registry_restaurant_listings.sql
      - supabase/migrations/20260829220500_seed_public_registry_restaurants.sql
      - src/pages/PublicRestaurantListingDetail.tsx
      - src/test/public-registry-listings.test.ts

permissions:
  contents: write

concurrency:
  group: apply-public-reg-restaurant-listings
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder
  SEO_STRICT_DYNAMIC: "0"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v6
        with:
          ref: feat/public-reg-restaurant-listings
          fetch-depth: 0

      - name: Verify branch scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          test "$(git branch --show-current)" = "feat/public-reg-restaurant-listings"
          git merge-base --is-ancestor origin/main HEAD
          git status --short --branch
          test -f AGENTS.md

          allowed='^(\.github/(apply-public-reg-listings\.py|finalize-public-reg-patch\.py|workflows/_apply-public-reg-listings\.yml)|scripts/(generate-public-reg-seed\.py|public-reg-ids/[0-9]{2}\.txt)|supabase/migrations/20260829220(000_public_registry_restaurant_listings|500_seed_public_registry_restaurants)\.sql|src/pages/PublicRestaurantListingDetail\.tsx|src/test/public-registry-listings\.test\.ts)$'
          unexpected="$(git diff --name-only origin/main...HEAD | grep -vE "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected pre-existing branch changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frozen REG source IDs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ids = []
          paths = sorted(Path("scripts/public-reg-ids").glob("*.txt"))
          if len(paths) != 12:
              raise SystemExit(f"expected 12 stable REG ID files, got {len(paths)}")
          for path in paths:
              ids.extend(line.strip() for line in path.read_text(encoding="utf-8").splitlines() if line.strip())
          if len(ids) != 2230 or len(set(ids)) != 2230:
              raise SystemExit(f"expected exactly 2230 unique stable REG IDs, got {len(ids)} rows / {len(set(ids))} unique")
          print("validated 2230 unique stable REG establishment IDs")
          PY

      - name: Generate stable public REG seed
        run: python3 scripts/generate-public-reg-seed.py

      - name: Validate seed privacy and selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("supabase/migrations/20260829220500_seed_public_registry_restaurants.sql")
          text = path.read_text(encoding="utf-8")
          row_marker = "('REG/SITG – Répertoire des entreprises et établissements'"
          rows = text.count(row_marker)
          if rows != 2230:
              raise SystemExit(f"expected exactly 2230 stable public REG source rows, got {rows}")
          if re.search(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", text):
              raise SystemExit("generated public seed unexpectedly contains an email-like value")
          for forbidden in ("NUM_IDE", "ID_ENTREPRISE", "TEL_SECONDAIRE", "email_reg", "email_site", "email_final"):
              if forbidden in text:
                  raise SystemExit(f"generated public seed unexpectedly contains forbidden field marker: {forbidden}")
          if "exact same-place duplicates" not in text or "live TOK profile" not in text:
              raise SystemExit("generated seed is missing duplicate/live-profile publication guards")
          print(f"validated {rows} stable public listings with no email-like values")
          PY

      - name: Apply reviewed frontend and auth patch
        run: |
          python3 .github/apply-public-reg-listings.py
          python3 .github/finalize-public-reg-patch.py

      - name: Check patch formatting
        run: git diff --check

      - name: Guard migration versions
        env:
          CI_MIGRATION_BASE_REF: origin/main
        run: node scripts/ci-migration-version-guard.mjs

      - name: Run targeted public listing tests
        run: >-
          pnpm exec vitest run
          src/test/public-registry-listings.test.ts
          src/test/route-wiring.test.ts
          src/test/seo-growth.test.ts
          src/test/seo-indexation-hardening.test.ts
          --reporter=verbose

      - name: Run complete test suite
        run: pnpm test

      - name: Lint all sources
        run: pnpm run lint

      - name: Typecheck application
        run: pnpm run typecheck

      - name: Build application
        run: pnpm run build

      - name: Build production SEO output
        run: pnpm run build:prod

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            supabase/migrations/20260829220000_public_registry_restaurant_listings.sql \
            supabase/migrations/20260829220500_seed_public_registry_restaurants.sql \
            scripts/generate-public-reg-seed.py \
            scripts/public-reg-ids/*.txt \
            src/App.tsx \
            src/components/RestaurantCard.tsx \
            src/lib/privilegedSignupRecovery.ts \
            src/pages/Auth.tsx \
            src/pages/LocalRestaurants.tsx \
            src/pages/PublicRestaurantListingDetail.tsx \
            src/pages/Recherche.tsx \
            src/test/public-registry-listings.test.ts \
            src/test/route-wiring.test.ts \
            src/test/seo-growth.test.ts

          git rm -f \
            .github/apply-public-reg-listings.py \
            .github/finalize-public-reg-patch.py \
            .github/workflows/_apply-public-reg-listings.yml

          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(restaurants): add public REG listings and claim flow"
          git push origin HEAD:feat/public-reg-restaurant-listings
