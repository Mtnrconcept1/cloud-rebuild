name: Temporary TOK Workforce Index Generation

on:
  push:
    branches:
      - feat/tok-swisstime-restaurant-workforce-20261014
    paths:
      - .github/workflows/tok-workforce-index-sync.yml

permissions:
  contents: write

jobs:
  sync-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate application index without temporary workflow
        run: |
          set -euo pipefail
          git rm --cached -- .github/workflows/tok-workforce-index-sync.yml
          pnpm docs:application-index
          git restore --staged -- .github/workflows/tok-workforce-index-sync.yml
      - name: Commit generated index to feature branch only
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/feat/tok-swisstime-restaurant-workforce-20261014" ]; then
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          if ! git diff --cached --quiet; then
            git commit -m "docs(workforce): regenerate canonical application reference"
            git push origin HEAD:refs/heads/feat/tok-swisstime-restaurant-workforce-20261014
          fi
