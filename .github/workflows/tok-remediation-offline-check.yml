name: TOK remediation credential-free validation
on:
  push:
    branches: [fix/tok-audit-remediation-20261003]
    paths: [.github/workflows/tok-remediation-offline-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated_fixture_only
          POSTGRES_DB: tok_audit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated_fixture_only
      PGDATABASE: tok_audit_test
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 24
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: tok-remediation-recheck-37100913713
          run-id: 37100913713
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-candidate
      - name: Verify source provenance and prepare isolated combined worktree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git branch --show-current)" = "fix/tok-audit-remediation-20261003"
          mkdir -p "$RUNNER_TEMP/results"
          git worktree add -b "validation/tok-final-${GITHUB_RUN_ID}" "$RUNNER_TEMP/tok-candidate" HEAD
          cd "$RUNNER_TEMP/tok-candidate"
          git config user.name mtnrconcept
          git config user.email 149347251+mtnrconcept@users.noreply.github.com
          git fetch --no-tags origin main
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/results/validated-main-sha.txt"
          git merge --no-ff --no-edit FETCH_HEAD
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import os,pathlib,hashlib,subprocess,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          patch=(root/'prior-candidate/candidate.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='639ffd8f05a1763024cc0e2b860710e737f06efb91983d0d8b5c9e34e03d4966'
          subprocess.run(['git','apply','--3way','-'],input=patch,check=True)
          subprocess.run(['git','reset','--quiet'],check=True)
          fix=pathlib.Path('.github/tok-remediation-transfer/final-fixups.patch').read_bytes()
          assert hashlib.sha256(fix).hexdigest()=='0ed2f8d74959b8953d4fbbce6b380b4dbe059568beaf0546edcce98a14c3d5ad'
          subprocess.run(['git','apply','--check','-'],input=fix,check=True)
          subprocess.run(['git','apply','-'],input=fix,check=True)
          expected=set(json.loads((root/'prior-candidate/candidate-hashes.json').read_text()))|{'src/test/marketing-ai-agent.test.ts','src/test/plan-phase1-readiness.test.ts','.github/workflows/tok-runtime-security.yml'}
          assert len(expected)==62
          (root/'results/expected-files.json').write_text(json.dumps(sorted(expected),indent=2))
          PY
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable && corepack prepare pnpm@10.28.1 --activate
          cd "$RUNNER_TEMP/tok-candidate"
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/results/install.log" 2>&1
      - name: Validate SQL, runtime, application and build without service credentials
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd "$RUNNER_TEMP/tok-candidate"
          run_check() {
            name="$1"; shift
            "$@" > "$RUNNER_TEMP/results/$name.log" 2>&1
            result=$?
            echo "$name=$result" | tee -a "$RUNNER_TEMP/results/checks.txt"
            return 0
          }
          run_check sql-fixture psql -v ON_ERROR_STOP=1 -f scripts/fixtures/tok-audit-schema.sql
          run_check sql-migration psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261003051849_tok_audit_runtime_hardening.sql
          run_check sql-permissions psql -v ON_ERROR_STOP=1 -f supabase/tests/tok-audit-runtime-hardening.sql
          run_check sql-idempotent psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261003051849_tok_audit_runtime_hardening.sql
          run_check sql-permissions-repeat psql -v ON_ERROR_STOP=1 -f supabase/tests/tok-audit-runtime-hardening.sql
          run_check runtime node --test scripts/tok-runtime-regression.test.cjs
          run_check deployment node --test scripts/tok-deployment-regression.test.mjs scripts/stoppin-venue-seo.test.mjs
          run_check duplicate-migrations node scripts/ci-migration-content-guard.mjs
          run_check typecheck pnpm run typecheck
          run_check lint pnpm run lint
          run_check tests pnpm exec vitest run --mode production --maxWorkers=2
          run_check worker-syntax pnpm --filter tok-image-ai-worker syntax
          run_check worker-tests pnpm --filter tok-image-ai-worker test
          run_check audit-production pnpm audit --prod --audit-level=high
          run_check audit-worker npm --prefix workers/image-ai-worker audit --package-lock-only --omit=dev --audit-level=high
          run_check build pnpm run build:prod
      - name: Preserve exact complete candidate and verify every outcome
        if: ${{ always() }}
        shell: python
        run: |
          import pathlib,os,subprocess,hashlib,json,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']);work=root/'tok-candidate';out=root/'results'
          if not (out/'expected-files.json').exists(): raise SystemExit('Candidate was not prepared')
          expected=set(json.loads((out/'expected-files.json').read_text()))
          subprocess.run(['git','add','-N','.'],cwd=work,check=True)
          names=set(subprocess.check_output(['git','diff','--name-only'],cwd=work,text=True).splitlines())
          if names!=expected:
            (out/'unexpected-files.json').write_text(json.dumps({'extra':sorted(names-expected),'missing':sorted(expected-names)},indent=2))
            raise SystemExit('Refusing to export an unexpected file scope')
          check=subprocess.run(['git','diff','--check'],cwd=work,capture_output=True)
          (out/'diff-check.log').write_bytes(check.stdout+check.stderr)
          patch=subprocess.check_output(['git','diff','--binary'],cwd=work)
          (out/'candidate.patch').write_bytes(patch)
          (out/'modified-files.txt').write_text('\n'.join(sorted(names))+'\n')
          hashes={name:hashlib.sha256((work/name).read_bytes()).hexdigest() for name in sorted(names)}
          (out/'candidate-hashes.json').write_text(json.dumps(hashes,indent=2))
          with tarfile.open(out/'complete-modified-files.tgz','w:gz') as archive:
            for name in sorted(names):archive.add(work/name,arcname=name)
          checks={}
          if (out/'checks.txt').exists():
            for line in (out/'checks.txt').read_text().splitlines():
              key,value=line.split('=',1)
              if key in checks:raise SystemExit('Duplicate validation result')
              checks[key]=int(value)
          required={'sql-fixture','sql-migration','sql-permissions','sql-idempotent','sql-permissions-repeat','runtime','deployment','duplicate-migrations','typecheck','lint','tests','worker-syntax','worker-tests','audit-production','audit-worker','build'}
          passed=set(checks)==required and all(value==0 for value in checks.values()) and check.returncode==0
          (out/'verification.json').write_text(json.dumps({'allPassed':passed,'checks':checks,'patchSha256':hashlib.sha256(patch).hexdigest(),'sourceInput':os.environ['GITHUB_SHA'],'validatedMain':(out/'validated-main-sha.txt').read_text().strip(),'productionModified':False,'buildEnvironment':'existing CI public placeholders'},indent=2))
          print(json.dumps({'allPassed':passed,'checks':checks},indent=2))
          if not passed:raise SystemExit(1)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tok-remediation-offline-${{ github.run_id }}
          path: ${{ runner.temp }}/results/
          retention-days: 3
