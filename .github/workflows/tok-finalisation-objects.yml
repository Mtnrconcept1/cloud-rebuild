name: TOK verified Git objects
on:
  push:
    branches: [fix/tok-audit-remediation-20261003]
    paths: [.github/workflows/tok-finalisation-objects.yml]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Await the exact validation run
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os,json,time,urllib.request
          url='https://api.github.com/repos/Mtnrconcept1/cloud-rebuild/actions/runs/37157385328'
          for attempt in range(90):
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            data=json.loads(urllib.request.urlopen(req,timeout=30).read())
            assert data['head_sha']=='8dd5a81cf167caee355db8796f1310a8982443da'
            if data['status']=='completed':break
            time.sleep(10)
          else:raise SystemExit('The validation run did not finish; nothing published')
          print('Validation run finished; its exact verification report must pass before any blob is created.')
      - uses: actions/download-artifact@v4
        with:
          name: tok-finalisation-verified-37157385328
          run-id: 37157385328
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated
      - name: Verify every byte and create immutable Git blobs only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import pathlib,os,json,hashlib,tarfile,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP']);validated=root/'validated';out=root/'objects';out.mkdir()
          report=json.loads((validated/'verification.json').read_text())
          assert report['allPassed'] is True and report['productionModified'] is False
          assert report['base']=='b78debfda01f1e2eb9fd90c3b26563a94b3f0048'
          names=json.loads((validated/'modified-files.json').read_text());hashes=json.loads((validated/'file-hashes.json').read_text())
          assert len(names)==28 and set(names)==set(hashes)
          with tarfile.open(validated/'complete-modified-files.tgz') as archive:
            assert set(archive.getnames())==set(names)
            entries=[]
            for name in sorted(names):
              data=archive.extractfile(name).read();assert hashlib.sha256(data).hexdigest()==hashes[name],name
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              body=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/Mtnrconcept1/cloud-rebuild/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              result=json.loads(urllib.request.urlopen(req,timeout=45).read());assert result['sha']==expected
              entries.append({'path':name,'mode':'100644','type':'blob','sha':expected})
          (out/'git-blobs.json').write_text(json.dumps(entries,indent=2))
          (out/'verification.json').write_text(json.dumps(report,indent=2))
          (out/'file-hashes.json').write_text(json.dumps(hashes,indent=2))
          print(json.dumps({'blobs':len(entries),'branchesModified':False,'productionModified':False}))
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tok-verified-git-objects-${{ github.run_id }}
          path: ${{ runner.temp }}/objects/
          retention-days: 3
