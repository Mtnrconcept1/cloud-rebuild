name: One-time PR 779 application index refresh
on:
  push:
    branches:
      - fix/decouple-delivery-orders-flags-20261012
permissions:
  contents: write
jobs:
  generate-and-self-remove:
    if: ${{ github.repository == 'Mtnrconcept1/cloud-rebuild' && github.ref_name == 'fix/decouple-delivery-orders-flags-20261012' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/decouple-delivery-orders-flags-20261012
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable correct pnpm version
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Remove this one-time workflow before regenerating
        run: git rm -- .github/workflows/pr779-regenerate-index-once.yml
      - name: Regenerate deterministic application index
        run: pnpm docs:application-index && pnpm docs:application-index:check
      - name: Commit generated docs to PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'docs(index): synchronize TOK index after scoped Edge change'
          git push origin HEAD:refs/heads/fix/decouple-delivery-orders-flags-20261012
