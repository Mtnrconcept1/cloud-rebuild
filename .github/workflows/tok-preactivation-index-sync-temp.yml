name: TOK preactivation one-time index sync

on:
  push:
    branches:
      - feat/restaurant-preactivation-weekly-ai-credits-20261014
    paths:
      - .github/workflows/tok-preactivation-index-sync-temp.yml

permissions:
  contents: write

jobs:
  index-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/restaurant-preactivation-weekly-ai-credits-20261014
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Remove this temporary workflow and regenerate the canonical index
        run: |
          git rm -- .github/workflows/tok-preactivation-index-sync-temp.yml
          pnpm docs:application-index
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): regenerate canonical TOK application references"
          git push origin HEAD:refs/heads/feat/restaurant-preactivation-weekly-ai-credits-20261014
