name: Bootstrap incident replay hardening

on:
  push:
    branches:
      - security/incident-replay-hardening-20260904
    paths:
      - .github/workflows/agent-incident-replay-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: security/incident-replay-hardening-20260904
          fetch-depth: 0

      - name: Decode and verify deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          gzip --decompress --stdout .github/agent/incident-replay-hardening.py.gz \
            > .github/agent/apply_incident_replay_hardening.py
          test "$(sha256sum .github/agent/apply_incident_replay_hardening.py | awk '{print $1}')" \
            = "365b033fe67e56d8deae4bdcb62fedec323d7f22620466cc6c308e4455b8ee71"
          python3 -m py_compile .github/agent/apply_incident_replay_hardening.py

      - name: Apply exact-source transformations
        run: python3 .github/agent/apply_incident_replay_hardening.py

      - name: Remove bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/agent/incident-replay-hardening.py.gz \
            .github/agent/apply_incident_replay_hardening.py \
            .github/workflows/agent-incident-replay-bootstrap.yml

      - name: Commit implementation on dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tok-security-agent"
          git config user.email "tok-security-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security(incident): sign callbacks and block replay"
          git push origin HEAD:security/incident-replay-hardening-20260904
