name: Apply password recovery CI contracts

on:
  push:
    branches:
      - fix/password-recovery-ci-contracts

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-ci-contracts-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/password-recovery-ci-contracts
          fetch-depth: 0

      - name: Apply reviewed contract corrections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} anchor, found {count}")
              return source.replace(old, new, 1)

          auth_test_path = Path("src/test/auth-signup-form.test.tsx")
          auth_test = auth_test_path.read_text(encoding="utf-8")

          auth_test = replace_once(
              auth_test,
              "  exchangeCodeForSession: vi.fn(),\n  resetPasswordForEmail: vi.fn(),\n",
              "  exchangeCodeForSession: vi.fn(),\n  onAuthStateChange: vi.fn(),\n  resetPasswordForEmail: vi.fn(),\n",
              "hoisted onAuthStateChange mock",
          )

          auth_test = replace_once(
              auth_test,
              "      exchangeCodeForSession: supabaseMocks.exchangeCodeForSession,\n      resetPasswordForEmail: supabaseMocks.resetPasswordForEmail,\n",
              "      exchangeCodeForSession: supabaseMocks.exchangeCodeForSession,\n      onAuthStateChange: supabaseMocks.onAuthStateChange,\n      resetPasswordForEmail: supabaseMocks.resetPasswordForEmail,\n",
              "Supabase auth mock wiring",
          )

          auth_test = replace_once(
              auth_test,
              "    supabaseMocks.exchangeCodeForSession.mockResolvedValue({\n      data: { session: null },\n      error: null,\n    });\n    supabaseMocks.from.mockImplementation(mockSupabaseTable);\n",
              "    supabaseMocks.exchangeCodeForSession.mockResolvedValue({\n      data: { session: null },\n      error: null,\n    });\n    supabaseMocks.onAuthStateChange.mockReturnValue({\n      data: {\n        subscription: {\n          unsubscribe: vi.fn(),\n        },\n      },\n    });\n    supabaseMocks.from.mockImplementation(mockSupabaseTable);\n",
              "default auth state subscription",
          )

          auth_test_path.write_text(auth_test, encoding="utf-8")

          route_test_path = Path("src/test/route-wiring.test.ts")
          route_test = route_test_path.read_text(encoding="utf-8")
          route_test = replace_once(
              route_test,
              '  "/profil",\n  "/notifications",\n',
              '  "/profil",\n  "/parametres/securite",\n  "/notifications",\n',
              "account security core route",
          )
          route_test_path.write_text(route_test, encoding="utf-8")
          PY

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate focused regressions
        run: >-
          pnpm exec vitest run --mode production
          src/test/auth-signup-form.test.tsx
          src/test/route-wiring.test.ts
          src/test/password-recovery-routing.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Commit validated corrections
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-password-recovery-ci-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/auth-signup-form.test.tsx src/test/route-wiring.test.ts
          git add -u .github/workflows/apply-password-recovery-ci-contracts.yml
          git diff --cached --check
          git commit -m "test(auth): align recovery mocks and route registry [recovery-ci-contracts-applied]"
          git push origin HEAD:fix/password-recovery-ci-contracts
