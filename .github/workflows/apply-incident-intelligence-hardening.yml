      - name: Regenerate canonical error-code map
        run: pnpm run generate:error-code-map

      - name: Run focused incident tests
        run: >-
          pnpm exec vitest run --mode production
          src/test/incident-intelligence-routing.test.ts
          src/test/incident-intelligence-unification.test.ts
          src/test/incident-automation-readiness.test.ts
          src/test/incident-evidence-depth.test.ts
          src/test/tok-intelligence-suite.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build:prod

      - name: Validate diff and secret safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff | grep -Eiq '(sk-proj-|sk-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|whsec_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})'; then
            echo "::error::A secret-like value was detected in the generated diff."
            exit 1
          fi
          historical_migrations="$(git diff --name-only --diff-filter=M -- 'supabase/migrations/*.sql' | grep -v '^supabase/migrations/20260801130000_unify_incident_intelligence.sql$' || true)"
          if [[ -n "$historical_migrations" ]]; then
            echo "::error::Existing migrations must remain immutable."
            printf '%s\n' "$historical_migrations"
            exit 1
          fi

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/apply-incident-intelligence-hardening.yml
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(ops): harden incident routing and support deduplication"
          git push origin HEAD:feat/unify-incident-intelligence
