name: Temporary PR 778 sync main and index
on:
  push:
    branches:
      - fix/mobile-nearby-restaurants-map-20261012

permissions:
  contents: write

jobs:
  sync-and-refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-nearby-restaurants-map-20261012
          fetch-depth: 40
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Merge current main without overwriting any application logic
        run: |
          git fetch --depth=40 origin main
          git merge --no-commit --no-ff -X ours origin/main
      - name: Remove temporary workflow before regeneration
        run: git rm .github/workflows/zz-pr778-sync-main-temporary.yml
      - name: Regenerate shared index for combined source tree
        run: |
          pnpm docs:application-index
          pnpm docs:application-index:check
          git diff --check
      - name: Commit merged source and refreshed generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md
          git diff --cached --check
          git commit -m 'chore(pr778): sync main and regenerate application index'
          git merge-base --is-ancestor origin/main HEAD
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/fix/mobile-nearby-restaurants-map-20261012
