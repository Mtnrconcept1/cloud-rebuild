name: Repair final onboarding validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/restaurateur-onboarding-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/restaurateur-onboarding-reliability
          fetch-depth: 1

      - name: Wire the stabilization helper into the staged validation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-staged-onboarding-patch.yml')
          source = path.read_text(encoding='utf-8')

          pnpm_marker = '      - name: Enable pnpm\n'
          stabilization_step = '''      - name: Stabilize confirmed signup recovery
                  run: python scripts/stabilize-restaurateur-onboarding.py

          '''
          if 'Stabilize confirmed signup recovery' not in source:
              if pnpm_marker not in source:
                  raise SystemExit('pnpm insertion marker not found')
              source = source.replace(pnpm_marker, stabilization_step + pnpm_marker, 1)

          cleanup_anchor = '          rm -f scripts/apply-restaurateur-auth-card-fix.py\n'
          cleanup_extension = (
              cleanup_anchor
              + '          rm -f scripts/stabilize-restaurateur-onboarding.py\n'
              + '          rm -f .github/workflows/apply-staged-onboarding-patch.yml\n'
          )
          commit_section = source.split('      - name: Commit validated product changes', 1)[-1]
          if 'rm -f scripts/stabilize-restaurateur-onboarding.py' not in commit_section:
              if cleanup_anchor not in source:
                  raise SystemExit('cleanup anchor not found')
              source = source.replace(cleanup_anchor, cleanup_extension, 1)

          old_add_u = '''          git add -u \\
                    tmp/restaurateur-onboarding-reliability.patch.gz.b64 \\
                    scripts/apply-restaurateur-auth-card-fix.py
          '''
          new_add_u = '''          git add -u \\
                    tmp/restaurateur-onboarding-reliability.patch.gz.b64 \\
                    scripts/apply-restaurateur-auth-card-fix.py \\
                    scripts/stabilize-restaurateur-onboarding.py \\
                    .github/workflows/apply-staged-onboarding-patch.yml
          '''
          if 'scripts/stabilize-restaurateur-onboarding.py \\' not in commit_section:
              if old_add_u not in source:
                  raise SystemExit('git add -u cleanup block not found')
              source = source.replace(old_add_u, new_add_u, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit the repaired staged workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-onboarding-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-staged-onboarding-patch.yml
          git add -u .github/workflows/repair-onboarding-final.yml
          git diff --cached --check
          git commit -m "ci: run final onboarding stabilization before validation"
          git push origin HEAD:fix/restaurateur-onboarding-reliability
