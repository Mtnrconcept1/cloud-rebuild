name: Temporary compact TOK header verification
on:
  push:
    branches: [codex/tok-compact-prep-20261012]
    paths: [.github/workflows/tok-compact-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tok-compact-prep-20261012
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore the validated worktree patch
        run: |
          set -euo pipefail
          cat > /tmp/compact.patch.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/compact.patch.b64 | gunzip | git apply -
          test "$(git hash-object src/home-section-headers.css)" = f0278849aca104ef23ab3034127508a59b40b767
          test "$(git hash-object src/test/home-section-showcase-header.test.tsx)" = 96eec5eaf8ded4dfd8c1b72a8e56e1275d1930c4
          git rm .github/workflows/tok-compact-once.yml
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm docs:application-index
          pnpm docs:application-index:check
          pnpm exec vitest run src/test/home-section-showcase-header.test.tsx src/test/responsive-seo-regressions.test.ts src/test/home-cuisine-accessibility.test.tsx
          git diff --check
      - name: Render actual component in Chromium
        run: |
          set -euo pipefail
          pnpm exec puppeteer browsers install chrome
          cat > __compact_qa.html <<'HTML'
          <!doctype html><html lang="fr"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Playfair+Display:wght@400;500;600;700&amp;display=swap"></head><body><div id="root"></div><script type="module" src="/src/__compact_qa.tsx"></script></body></html>
          HTML
          cat > src/__compact_qa.tsx <<'TSX'
          import React from 'react';
          import {createRoot} from 'react-dom/client';
          import {MemoryRouter} from 'react-router-dom';
          import {MapPinned,MoonStar,Utensils,Heart,Compass,Gift,Clock,Flame} from 'lucide-react';
          import SectionShowcaseHeader from './components/home/SectionShowcaseHeader';
          import './index.css';import './home-section-headers.css';
          const cases=[['soir','Pour ce soir','Sélection variée du soir','reservation','Voir plus pour le soir','',MoonStar],['local','À moins de 5 km de vous','Votre position actuelle','geneva','Explorer autour de vous','Découvrez les meilleures tables autour de vous.',MapPinned],['discover','À découvrir','Sélection variée','geneva',"Explorer d’autres restaurants",'',Compass],['map','Restaurants dans un rayon de 5 km','Selon votre position actuelle','geneva','Voir la liste','',MapPinned],['cuisine','Explorez par cuisine','À votre goût','cuisine','','Des saveurs du monde, près de chez vous.',Utensils],['fav','Vos habitudes','Pour vous','rewards','Retrouver vos favoris','',Heart],['promo','Promotions et activations du moment','À ne pas manquer','gastronomy','Voir tout','',Gift],['lunch','Pour votre pause de midi','Une sélection gourmande','feast','Voir les restaurants','',Clock],['trends','Les tendances du moment','Les tables qui font envie','evening','Tout découvrir','',Flame],['delivery','Vos offres locales','Offres du moment','delivery','Découvrir les offres','',Gift]];
          createRoot(document.getElementById('root')!).render(<MemoryRouter><main style={{padding:16,maxWidth:1320,margin:'0 auto',display:'grid',gap:14}}>{cases.map(([id,title,subtitle,image,link,description,Icon])=><section key={id as string} data-case={id as string}><SectionShowcaseHeader title={title as string} subtitle={subtitle as string} icon={Icon as typeof MapPinned} imageSrc={'/images/section-headers/tok-editorial-'+image+'-full.jpg'} linkText={link as string} linkTo="/recherche" description={description as string}/></section>)}</main></MemoryRouter>);
          TSX
          cat > .compact-qa.cjs <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),p=require('puppeteer');
          (async()=>{const b=await p.launch({headless:true,args:['--no-sandbox','--disable-setuid-sandbox']}),report=[];fs.mkdirSync('/tmp/tok-compact-evidence/screenshots',{recursive:true});
          for(const width of [320,360,375,390,430,640,768,1280]){const page=await b.newPage();await page.setViewport({width,height:900,deviceScaleFactor:1});await page.goto('http://127.0.0.1:5173/__compact_qa.html',{waitUntil:'networkidle0'});await page.waitForSelector('[data-section-showcase-header]');await page.evaluate(async()=>{document.querySelectorAll('img').forEach(i=>i.loading='eager');await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode()));});
          const rows=await page.evaluate(()=>[...document.querySelectorAll('[data-section-showcase-header]')].map(h=>{const im=h.querySelector('img'),c=h.querySelector('.tok-section-header__content'),a=h.querySelector('a'),hb=h.getBoundingClientRect(),ib=im.getBoundingClientRect(),s=getComputedStyle(im),scale=Math.max(ib.width/im.naturalWidth,ib.height/im.naturalHeight);return {id:h.parentElement.dataset.case,width:hb.width,height:hb.height,fit:s.objectFit,gap:Math.max(0,(ib.height-im.naturalHeight*scale)/2),opacity:s.opacity,mask:s.maskImage,inside:[...c.querySelectorAll('h2,p,a,.tok-section-header__eyebrow')].every(e=>{const r=e.getBoundingClientRect();return r.top>=hb.top-1&&r.bottom<=hb.bottom+1&&r.right<=hb.right+1}),action:a?a.getBoundingClientRect().height:null,overflow:document.documentElement.scrollWidth>innerWidth,loaded:im.naturalWidth===2508&&im.naturalHeight===627};}));
          for(const r of rows){assert(r.inside&&!r.overflow&&r.loaded,JSON.stringify({width,...r}));assert.equal(r.fit,'cover');assert.equal(r.gap,0);assert.equal(r.opacity,'1');assert(!r.action||r.action>=43.9);if(width<640)assert(r.height<=205,JSON.stringify({width,...r}));}
          if(width===390||width===1280){for(const id of ['soir','local','map','cuisine']){const e=await page.$('[data-case="'+id+'"]');await e.screenshot({path:'/tmp/tok-compact-evidence/screenshots/'+id+'-'+width+'.png'});}}report.push({width,rows});await page.close();}
          fs.writeFileSync('/tmp/tok-compact-evidence/browser-report.json',JSON.stringify(report,null,2));console.log('PASS: '+report.reduce((n,r)=>n+r.rows.length,0)+' actual component viewport cases');await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          pnpm exec vite --host 127.0.0.1 --port 5173 >/tmp/tok-compact-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true; rm -f __compact_qa.html src/__compact_qa.tsx .compact-qa.cjs' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/__compact_qa.html >/dev/null && break || sleep 1; done
          node .compact-qa.cjs
          rm __compact_qa.html src/__compact_qa.tsx .compact-qa.cjs
          pnpm docs:application-index:check
          git diff --quiet -- public
          mkdir -p /tmp/tok-compact-evidence/sources/src/test /tmp/tok-compact-evidence/sources/docs/architecture
          cp src/home-section-headers.css /tmp/tok-compact-evidence/sources/src/
          cp src/test/home-section-showcase-header.test.tsx /tmp/tok-compact-evidence/sources/src/test/
          cp docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json /tmp/tok-compact-evidence/sources/docs/architecture/
      - name: Commit only the four validated files
        run: |
          set -euo pipefail
          git add src/home-section-headers.css src/test/home-section-showcase-header.test.tsx docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(home): compact full-bleed section headers and regenerate index"
          git push origin HEAD:refs/heads/codex/tok-compact-prep-20261012
      - uses: actions/upload-artifact@v4
        with:
          name: tok-compact-browser-and-complete-sources
          path: /tmp/tok-compact-evidence
          retention-days: 7
          if-no-files-found: error
