name: Temporary TOK branding index sync
on:
  push:
    branches:
      - codex/tok-connect-official-branding-20261017
concurrency:
  group: tok-brand-index-20261017
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Regenerate canonical files without temporary workflow
        run: |
          set -euo pipefail
          git rm --quiet .github/workflows/tok-temp-brand-index-sync-20261017.yml
          node scripts/generate-error-code-map.mjs
          node scripts/generate-application-index.mjs
          node scripts/generate-application-index.mjs --check
      - uses: actions/upload-artifact@v4
        with:
          name: tok-brand-rebase-reference
          retention-days: 1
          if-no-files-found: error
          path: |
            supabase/functions/_shared/error-code-map.ts
            docs/architecture/TOK_APPLICATION_REFERENCE.md
            docs/architecture/tok-application-search-index.json
            src/data/tok-user-guide-catalog.generated.ts
  commit-generated:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/tok-connect-official-branding-20261017
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: tok-brand-rebase-reference
          path: .
      - name: Commit changes and remove temporary workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/tok-connect-official-branding-20261017"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rm --quiet .github/workflows/tok-temp-brand-index-sync-20261017.yml
          git add supabase/functions/_shared/error-code-map.ts docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(tok): refresh official logo widget references after marketplace release"
          git push origin HEAD:refs/heads/codex/tok-connect-official-branding-20261017
