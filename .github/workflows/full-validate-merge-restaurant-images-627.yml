name: Full validate and merge restaurant image PR 627

on:
  push:
    branches:
      - ops/full-validate-merge-restaurant-images-627

permissions:
  contents: read

concurrency:
  group: full-validate-merge-restaurant-images-627
  cancel-in-progress: true

jobs:
  full-validation:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      NODE_VERSION: 22
      PNPM_VERSION: 10.28.1
      GH_TOKEN: ${{ secrets.TOK_CODEX_GITHUB_TOKEN }}
      TOKEN_PRESENT: ${{ secrets.TOK_CODEX_GITHUB_TOKEN != '' }}
      PR_NUMBER: "627"
      EXPECTED_HEAD_BRANCH: fix/restaurant-image-truth-backfill-20260904
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder

    steps:
      - name: Resolve immutable pull request head
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TOKEN_PRESENT" != "true" ]]; then
            echo "::error::TOK_CODEX_GITHUB_TOKEN is required."
            exit 1
          fi
          echo "::add-mask::$GH_TOKEN"

          PR_JSON="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,isDraft,headRefName,headRefOid,baseRefName)"
          test "$(jq -r '.state' <<<"$PR_JSON")" = "OPEN"
          test "$(jq -r '.isDraft' <<<"$PR_JSON")" = "false"
          test "$(jq -r '.headRefName' <<<"$PR_JSON")" = "$EXPECTED_HEAD_BRANCH"
          test "$(jq -r '.baseRefName' <<<"$PR_JSON")" = "main"
          HEAD_SHA="$(jq -r '.headRefOid' <<<"$PR_JSON")"
          test -n "$HEAD_SHA"
          test "$HEAD_SHA" != "null"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout and clean workspace
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run targeted restaurant image tests
        run: >-
          pnpm exec vitest run
          src/test/restaurant-image-truth-pipeline.test.ts
          src/test/restaurant-image-truth-guards.test.ts
          src/test/restaurant-image-safe-fetch.test.ts
          src/test/restaurant-image-mapped-ip-guard.test.ts
          src/test/restaurant-image-discovery-trigger.test.ts
          src/test/restaurant-image-discovery-reactivation.test.ts

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run full test suite
        run: pnpm run test

      - name: Build production artifacts
        run: pnpm run build:prod

      - name: Verify clean diff and UTF-8-sensitive paths
        env:
          BASE_SHA: ${{ steps.target.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          ! git grep -n $'\357\277\275' -- \
            .github/workflows/restaurant-image-truth-backfill.yml \
            docs/superpowers/plans/2026-09-04-restaurant-image-truth-backfill.md \
            scripts/lib/safe-public-fetch.mjs \
            scripts/restaurant-image-safe-fetch-hook.mjs \
            scripts/restaurant-image-truth-worker.mjs \
            src/test/restaurant-image-*.test.ts \
            supabase/migrations/20260904173*.sql

      - name: Require all pull request checks to pass on the same head
        env:
          APPROVED_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,headRefOid --jq 'select(.state == "OPEN") | .headRefOid')"
          test "$CURRENT_HEAD_SHA" = "$APPROVED_HEAD_SHA"

          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --watch --interval 10 --fail-fast
          CHECKS="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json name,state,bucket,workflow)"
          test "$(jq 'length' <<<"$CHECKS")" -gt 0
          jq -e 'any(.[]; ((.workflow // "") == "CI") or (.name == "validate"))' \
            <<<"$CHECKS" >/dev/null
          jq -e 'all(.[]; .bucket == "pass" or .bucket == "skipping")' \
            <<<"$CHECKS" >/dev/null

      - name: Merge exact validated head without administrative bypass
        env:
          APPROVED_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "$APPROVED_HEAD_SHA" \
            --subject "fix(directory): vérifier les images et continuer le remplissage (#627)"

      - name: Remove temporary validation branch
        if: ${{ success() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/git/refs/heads/ops/full-validate-merge-restaurant-images-627"
