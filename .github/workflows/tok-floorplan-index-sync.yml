name: TOK Floor Plan — temporary canonical index sync

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/tok-floorplan-index-sync.yml"

permissions:
  contents: read

jobs:
  regenerate:
    name: Sync canonical reference and remove temporary workflow
    if: ${{ github.event.pull_request.number == 1022 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/tok-floorplan-spacious-layout-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout dedicated floor-plan PR branch
        uses: actions/checkout@v6
        with:
          ref: codex/tok-floorplan-spacious-layout-20261028
          fetch-depth: 1
          persist-credentials: true
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove one-off workflow before computing canonical index
        run: git rm -- .github/workflows/tok-floorplan-index-sync.yml
      - name: Regenerate and verify canonical application references
        run: |
          pnpm run docs:application-index
          pnpm run docs:application-index:check
      - name: Commit generated files and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): sync TOK reference after floor-plan layout"
          git push origin HEAD:refs/heads/codex/tok-floorplan-spacious-layout-20261028
