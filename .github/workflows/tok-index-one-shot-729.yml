name: TOK PR 729 index synchronization (one shot)
on:
  push:
    branches:
      - fix/tok-route-navigation-audit-20261009

permissions:
  contents: write

jobs:
  refresh-application-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned pnpm and project dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
      - name: Remove temporary workflow and regenerate canonical index
        run: |
          set -euo pipefail
          git rm .github/workflows/tok-index-one-shot-729.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          pnpm exec vitest run src/test/application-search-index.test.ts src/test/route-serving-regression.test.ts src/test/dashboard-selection-navigation.test.tsx --maxWorkers=2
      - name: Commit generated index and remove this workflow
        run: |
          set -euo pipefail
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(routes): refresh canonical index for PR #729'
          git push origin HEAD:refs/heads/fix/tok-route-navigation-audit-20261009
