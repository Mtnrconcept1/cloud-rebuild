name: TOK Floor Plan — one-shot width-fit reference sync

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/tok-floorplan-fit-width-index-sync.yml"

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate canonical application index and remove one-shot workflow
    if: ${{ github.event.pull_request.number == 1024 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/tok-floorplan-fit-width-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout dedicated PR branch
        uses: actions/checkout@v6
        with:
          ref: codex/tok-floorplan-fit-width-20261028
          fetch-depth: 1
          persist-credentials: true
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Remove the temporary workflow before generating the index
        run: git rm -- .github/workflows/tok-floorplan-fit-width-index-sync.yml
      - name: Generate and verify canonical references
        run: |
          pnpm run docs:application-index
          pnpm run docs:application-index:check
      - name: Commit references and remove temporary workflow from PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): synchronize canonical TOK floor-plan references"
          git push origin HEAD:refs/heads/codex/tok-floorplan-fit-width-20261028
