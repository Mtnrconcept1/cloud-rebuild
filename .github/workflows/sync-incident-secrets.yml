name: TOK Incident Secret Sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-incident-secrets.yml"
      - "scripts/write-supabase-secrets-env.mjs"
      - "supabase/functions/ops-incident-control/**"
      - "supabase/functions/ops-incident-native-scan/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tok-incident-secret-sync-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_REF: wwcrtyoueexyxkkikaos
      SUPABASE_URL: https://wwcrtyoueexyxkkikaos.supabase.co
      GITHUB_INCIDENT_REPOSITORY: Mtnrconcept1/cloud-rebuild

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Verify required incident credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TOK_INCIDENT_GITHUB_CONTROL: ${{ secrets.TOK_INCIDENT_GITHUB_CONTROL }}
          OPS_INGEST_SECRET: ${{ secrets.OPS_INGEST_SECRET }}
          TOK_INCIDENT_GITHUB_SECRET: ${{ secrets.TOK_INCIDENT_GITHUB_SECRET }}
          GITHUB_INCIDENT_TOKEN: ${{ secrets.TOK_GITHUB_INCIDENT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          required=(
            SUPABASE_ACCESS_TOKEN
            TOK_INCIDENT_GITHUB_CONTROL
            OPS_INGEST_SECRET
            TOK_INCIDENT_GITHUB_SECRET
            GITHUB_INCIDENT_TOKEN
            TELEGRAM_BOT_TOKEN
            TELEGRAM_ADMIN_CHAT_ID
            TELEGRAM_ADMIN_USER_ID
            TELEGRAM_WEBHOOK_SECRET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production secret: ${name}"
              exit 1
            fi
          done

      - name: Prepare incident Edge secrets
        shell: bash
        env:
          OPS_CONTROL_SECRET: ${{ secrets.TOK_INCIDENT_GITHUB_CONTROL }}
          OPS_INGEST_SECRET: ${{ secrets.OPS_INGEST_SECRET }}
          OPS_GITHUB_CALLBACK_SECRET: ${{ secrets.TOK_INCIDENT_GITHUB_SECRET }}
          GITHUB_INCIDENT_TOKEN: ${{ secrets.TOK_GITHUB_INCIDENT_TOKEN }}
          GITHUB_INCIDENT_REPOSITORY: Mtnrconcept1/cloud-rebuild
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          node ./scripts/write-supabase-secrets-env.mjs \
            --out="${RUNNER_TEMP}/tok-incident-secrets.env"

      - name: Sync incident Edge secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase secrets set \
            --env-file "${RUNNER_TEMP}/tok-incident-secrets.env" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Configure Telegram webhook
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status_code="$({
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "$(node -e '
                const url = process.env.SUPABASE_URL + "/functions/v1/ops-incident-control";
                process.stdout.write(JSON.stringify({
                  url,
                  secret_token: process.env.TELEGRAM_WEBHOOK_SECRET,
                  allowed_updates: ["callback_query"],
                  drop_pending_updates: false,
                }));
              ')" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook"
          })"
          test "$status_code" = "200" || {
            echo "::error::Telegram webhook configuration failed with HTTP ${status_code}."
            rm -f -- "$response_file"
            exit 1
          }
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (payload.ok !== true) process.exit(1);
          ' "$response_file" || {
            echo "::error::Telegram rejected the webhook configuration."
            rm -f -- "$response_file"
            exit 1
          }
          rm -f -- "$response_file"

      - name: Verify incident control readiness
        shell: bash
        env:
          OPS_CONTROL_SECRET: ${{ secrets.TOK_INCIDENT_GITHUB_CONTROL }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status_code="$({
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "x-ops-control-secret: ${OPS_CONTROL_SECRET}" \
              "${SUPABASE_URL}/functions/v1/ops-incident-control"
          })"
          test "$status_code" = "200" || {
            echo "::error::Incident control readiness failed with HTTP ${status_code}."
            rm -f -- "$response_file"
            exit 1
          }
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              payload.ok !== true ||
              payload.telegramConfigured !== true ||
              payload.githubConfigured !== true ||
              payload.openAiConfigured !== true
            ) process.exit(1);
          ' "$response_file" || {
            echo "::error::Telegram, GitHub/Codex or OpenAI incident readiness is incomplete."
            rm -f -- "$response_file"
            exit 1
          }
          rm -f -- "$response_file"

      - name: Run initial incident scan
        shell: bash
        env:
          OPS_CONTROL_SECRET: ${{ secrets.TOK_INCIDENT_GITHUB_CONTROL }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status_code="$({
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "x-ops-control-secret: ${OPS_CONTROL_SECRET}" \
              --data '{"action":"scan"}' \
              "${SUPABASE_URL}/functions/v1/ops-incident-control"
          })"
          test "$status_code" = "200" || {
            echo "::error::Initial incident scan failed with HTTP ${status_code}."
            rm -f -- "$response_file"
            exit 1
          }
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (payload.ok !== true) process.exit(1);
          ' "$response_file" || {
            echo "::error::Initial incident scan returned an invalid response."
            rm -f -- "$response_file"
            exit 1
          }
          rm -f -- "$response_file"

      - name: Remove temporary incident secrets
        if: always()
        shell: bash
        run: rm -f -- "${RUNNER_TEMP}/tok-incident-secrets.env"
