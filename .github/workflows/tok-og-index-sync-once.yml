name: TOK OG temporary application index synchronization

on:
  push:
    branches:
      - agent/tok-og-chef-social-preview-20261031
    paths:
      - .github/workflows/tok-og-index-sync-once.yml

permissions:
  contents: write

jobs:
  synchronize-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check branch and working tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/tok-og-chef-social-preview-20261031"
          git status --short --branch
          git rev-parse --show-toplevel
          git worktree list

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove temporary workflow from the indexed source
        run: git rm -- .github/workflows/tok-og-index-sync-once.yml

      - name: Regenerate canonical references
        run: pnpm run docs:application-index

      - name: Verify generated references
        run: pnpm run docs:application-index:check

      - name: Check and commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git diff --cached --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(docs): synchroniser les references TOK apres apercu OG"
          git push origin "HEAD:refs/heads/agent/tok-og-chef-social-preview-20261031"
