name: Publish verified dependency security remediation (one-off)
'on':
  push:
    branches: [fix/dependabot-audit-20261003]
    paths: [.github/workflows/security-remediation-bootstrap.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: dependency-security-remediation-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  publish:
    if: ${{ github.repository == 'Mtnrconcept1/cloud-rebuild' && github.ref == 'refs/heads/fix/dependabot-audit-20261003' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      EVIDENCE: /tmp/tok-security-verified-${{ github.run_id }}
    steps:
      - name: Checkout exact dedicated-branch revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Retrieve the immutable artifact from the successful validation job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11264171029'
          run-id: '37094866166'
          repository: Mtnrconcept1/cloud-rebuild
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ env.EVIDENCE }}
      - name: Verify provenance, copy only tested files, and publish without running application code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'fix/dependabot-audit-20261003'
          test "$(git rev-parse HEAD^)" = 80271e03727623b0ed50022bac8fd57b8c9b9940
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          expected = {
            'README.md': '494054a9e6180e4742dbe41bf5937b5ca7681f1f',
            'package.json': '471272eaec83e0c0e8d5b83a4120c600c08aef80',
            'pnpm-lock.yaml': 'ba40e0b20c2cb8e1c5cbbacc2012db36582530ca',
            'pnpm-workspace.yaml': 'dcc2292cb5d5a0371896bffc9239693f41e4e73d',
            'deno.lock': 'bd3a227392af2f22fa340dd7fc25036efbe42601',
            'patches/braces@3.0.3.patch': 'bbcb751f6c8d4912fc0c49fdd576653114c8fc7d',
            'scripts/dependency-security.test.mjs': 'ee014ac7f3506e6cc2f933a006ec5b2af529c7f0',
            'src/test/dependency-security.test.ts': 'f941cdf0da2dfc7914120ef2958077d6414cd573',
            'src/lib/admin/auditLogNarrative.ts': '131da0fa66ad0743615dbd1e9f4f215d4854dc96',
            'src/test/admin-mobile-navigation.test.tsx': '8ade8b21c5d9ac6d6fad9b6d878badd60bb082ad',
            'src/test/marketing-outreach-schema.test.ts': '9e273ff02ddd20c6bbc42c873b97510e6067041b',
            'src/test/plan-phase1-readiness.test.ts': 'db4ffc2f146f4c657b9253e11da4f3c1216e0bfc',
            'docs/audits/DEPENDABOT_2026-10-03.md': '9498db31b8dabde6dd3981c087360ecab22850d5',
          }
          root = Path(os.environ['EVIDENCE'])
          summary = json.loads((root/'summary.json').read_text())
          assert summary['source_commit'] == '80271e03727623b0ed50022bac8fd57b8c9b9940'
          assert summary['run_id'] == '37094866166'
          assert summary['tests_failed'] == 0 and summary['tests_passed'] == 2610
          assert summary['before_unique_ghsa'] == 54 and summary['after_unique_ghsa'] == 1
          hashes = json.loads((root/'files.sha256.json').read_text())
          assert set(hashes) == set(expected)
          assert json.loads((root/'deleted-paths.json').read_text()) == ['package-lock.json']
          for filename, expected_blob in expected.items():
              source = root/'files'/filename
              assert source.is_file() and not source.is_symlink()
              data = source.read_bytes()
              data.decode('utf8')
              assert hashlib.sha256(data).hexdigest() == hashes[filename], filename
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert blob == expected_blob, filename
              target = Path(filename)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          Path('package-lock.json').unlink()
          print('All 13 file bodies match the already tested Git blobs and SHA-256 hashes.')
          PY
          git add -- README.md package.json pnpm-lock.yaml pnpm-workspace.yaml deno.lock patches/braces@3.0.3.patch scripts/dependency-security.test.mjs src/test/dependency-security.test.ts src/lib/admin/auditLogNarrative.ts src/test/admin-mobile-navigation.test.tsx src/test/marketing-outreach-schema.test.ts src/test/plan-phase1-readiness.test.ts docs/audits/DEPENDABOT_2026-10-03.md
          git add -u -- package-lock.json
          # Unified-diff context lines contain a required single-space prefix.
          # Preserve the tested patch bytes/hash; validate its syntax separately.
          git diff --cached --check -- . ':!patches/*.patch'
          git apply --numstat patches/braces@3.0.3.patch
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): remediate dependencies and guard recursive patterns'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "Published verified commit $(git rev-parse HEAD); main unchanged."
