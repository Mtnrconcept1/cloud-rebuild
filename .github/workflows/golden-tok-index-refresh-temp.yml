name: Golden TOK final canonical reference refresh
on:
  push:
    branches:
      - feat/golden-tok-accreditation-search-upload-20261014
    paths:
      - .github/workflows/golden-tok-index-refresh-temp.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/feat/golden-tok-accreditation-search-upload-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout dedicated feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/golden-tok-accreditation-search-upload-20261014
          persist-credentials: true
      - name: Prepare pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage the temporary workflow deletion before repository index scan
        run: |
          git rm -- .github/workflows/golden-tok-index-refresh-temp.yml
          if git ls-files --cached | grep -F 'golden-tok-index-refresh-temp.yml'; then
            echo 'Temporary workflow unexpectedly remains tracked'
            exit 1
          fi
      - name: Generate both canonical files from the FINAL tracked tree
        run: |
          pnpm run generate:error-code-map
          pnpm run docs:application-index
          pnpm run docs:application-index:check
      - name: Commit generated files together with tracked workflow deletion
        run: |
          set -euo pipefail
          git add -- supabase/functions/_shared/error-code-map.ts docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): derive final Golden TOK source reference without temporary workflows"
          git push origin HEAD:refs/heads/feat/golden-tok-accreditation-search-upload-20261014
