name: Golden TOK temporary index refresh
on:
  push:
    branches:
      - feat/golden-tok-accreditation-search-upload-20261014
    paths:
      - .github/workflows/golden-tok-index-refresh-temp.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/feat/golden-tok-accreditation-search-upload-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v6
        with:
          ref: feat/golden-tok-accreditation-search-upload-20261014
          persist-credentials: true
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate index
        run: pnpm run docs:application-index
      - name: Commit generated files only
        run: |
          set -euo pipefail
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          if git diff --cached --quiet; then
            echo "Index already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): refresh La Tok d'Or application reference"
          git push origin HEAD:refs/heads/feat/golden-tok-accreditation-search-upload-20261014
