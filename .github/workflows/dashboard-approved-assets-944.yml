name: Dashboard - verified native photography and master badge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/dashboard-approved-assets-944.yml

permissions:
  contents: read

concurrency:
  group: dashboard-approved-assets-944
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'Mtnrconcept1/cloud-rebuild' &&
      github.event.pull_request.number == 944 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/dashboard-white-page-heroes-20261021' &&
      github.actor == 'mtnrconcept'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read the exact dedicated branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout and prepare image encoder
        run: |
          set -euo pipefail
          git status --short
          git branch --show-current
          git rev-parse HEAD
          test -z "$(git status --porcelain)"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y webp
      - name: Transfer and validate native artwork
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, struct, subprocess, tarfile, urllib.request, zipfile
          from datetime import datetime, timezone
          root = pathlib.Path('/tmp/tok-dashboard-assets')
          root.mkdir()
          sources = [
            ('client-accueil', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:7b2dac21-1b60-47e2-ba49-d78a13265984', 'verified-reference-generation', 'Accueil client / dîner au restaurant'),
            ('client-reservations', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:2ad07f4d-dc37-4ae9-8e84-93ab2a7157ff', 'verified-reference-generation', 'Réservations client / table dressée'),
            ('client-avis', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:932b7555-eae8-42b4-84ab-e8701bc1593d', 'verified-reference-generation', 'Avis client / repas et smartphone'),
            ('client-profil', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:6aba016b-7346-4d44-a463-2cb6e74349a9', 'verified-reference-generation', 'Profil client / cliente au restaurant'),
            ('client-favoris', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:795cae62-5bca-41b3-9545-9a40e403bd06', 'verified-reference-generation', 'Favoris client / clients à leur table'),
            ('client-abonnement', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:fa0da3ba-5a14-4255-bea4-888408cab33f', 'verified-reference-generation', 'Abonnement client / dîner'),
            ('client-preferences', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:7a2177d3-2b8b-4970-9642-f8d15102a434', 'verified-reference-generation', 'Préférences client / tablette'),
            ('client-parametres', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:2674a318-cf0c-4f0a-97fc-a3d20a6c50d2', 'verified-reference-generation', 'Paramètres client / carnet et téléphone'),
            ('client-notifications', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:3fa5f911-4619-4ebf-969d-1f0d3bb1bfde', 'verified-reference-generation', 'Notifications client / téléphone'),
            ('client-memoire', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:3b8b1bc3-4d3b-4c5d-b2a4-2694dbba71a3', 'verified-reference-generation', 'Mémoire client / carnet de souvenirs'),
            ('restaurant-menu', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:ff6a8b27-498b-4dea-9940-7ab3be5a6824', 'verified-reference-generation', 'Menu restaurateur / cheffe préparant une assiette'),
            ('restaurant-performances', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:28cafcf7-d7f4-4413-adc2-416f7d879954', 'verified-reference-generation', 'Performances / restaurateur et ordinateur'),
            ('restaurant-facturation', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:c25d8fe9-7ae5-4de0-ac0e-c2efb0740020', 'verified-reference-generation', 'Paramètres facturation / bureau'),
            ('restaurant-photos', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:9ac34db7-492c-4ebc-80ba-0487d445bb7e', 'verified-reference-generation', 'Studio photo / photographie de plat'),
            ('restaurant-plan', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:92187d54-5b43-466f-a203-0013bc06bb58', 'verified-reference-generation', 'Plan de salle / salle du restaurant'),
            ('restaurant-crm', 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:a4903449-f22e-402d-b1f9-d9fff54831b9', 'verified-reference-generation', 'CRM / accueil des clients'),
          ]
          records, hashes = [], set()
          for name, url, request_id, scene in sources:
            if not url.startswith('https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:'):
              raise ValueError('Unexpected image source')
            with urllib.request.urlopen(url, timeout=90) as response:
              if not response.url.startswith('https://'):
                raise ValueError('Insecure redirect')
              data = response.read(25 * 1024 * 1024 + 1)
            if len(data) > 25 * 1024 * 1024 or data[:8] != b'\x89PNG\r\n\x1a\n':
              raise ValueError('Expected a bounded native PNG')
            width, height = struct.unpack('>II', data[16:24])
            if not (1000 <= width <= 6000 and 500 <= height <= 4000 and 1.7 < width / height < 1.85):
              raise ValueError(f'Unexpected photograph dimensions: {width} x {height}')
            original = pathlib.Path('/tmp') / f'{name}.png'
            original.write_bytes(data)
            dest = root / f'{name}.webp'
            subprocess.run(['cwebp', '-quiet', '-q', '88', '-m', '6', '-resize', str(min(width, 1600)), '0', str(original), '-o', str(dest)], check=True)
            image = dest.read_bytes()
            if image[:4] != b'RIFF' or image[8:12] != b'WEBP' or not 10000 < len(image) < 1500000:
              raise ValueError('Invalid or oversized optimized asset')
            digest = hashlib.sha256(image).hexdigest()
            if digest in hashes:
              raise ValueError('Duplicate artwork')
            hashes.add(digest)
            records.append({'id': name, 'file': dest.name, 'sha256': digest, 'bytes': len(image), 'sourceWidth': width, 'sourceHeight': height, 'generationId': url.rsplit('/', 1)[-1], 'requestId': request_id, 'scene': scene})
            print(f'{dest.name}: {len(image)} bytes, SHA256 {digest}')
          # The client's own approved source badge: it is a native raster asset, not a post-generation overlay.
          badge_url = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3DJyQNq1pAMlmOO3OIClX45KbLY/14a87d20-70bc-4131-9636-23158c918a7a.png'
          with urllib.request.urlopen(badge_url, timeout=60) as response:
            badge = response.read(10 * 1024 * 1024 + 1)
          if len(badge) > 10 * 1024 * 1024 or hashlib.sha256(badge).hexdigest() != 'd03527f0e94c12557e5914bffbd0a1ac841d3e589d3de68948b3f7c88a609573':
            raise ValueError('Official uploaded TOK badge checksum mismatch')
          if badge[:8] != b'\\x89PNG\\r\\n\\x1a\\n' or struct.unpack('>II', badge[16:24]) != (2048, 2048):
            raise ValueError('Unexpected official badge dimensions or format')
          badge_original = pathlib.Path('/tmp/tok-official.png')
          badge_original.write_bytes(badge)
          badge_webp = root / 'tok-round-official.webp'
          subprocess.run(['cwebp', '-quiet', '-q', '94', '-m', '6', '-resize', '1024', '0', str(badge_original), '-o', str(badge_webp)], check=True)
          if badge_webp.read_bytes()[:4] != b'RIFF':
            raise ValueError('Invalid official badge WebP output')
          print('Official badge approved, hash:', hashlib.sha256(badge_webp.read_bytes()).hexdigest())
          provenance = {'generator': 'Adobe Firefly via Adobe image_generate', 'referenceAsset': 'urn:aaid:sc:EU:902c68ee-9b00-4f41-9dbb-80802152cd76', 'direction': 'Photographie de restaurant chaleureuse, accents orange TOK, une scène par fichier ; aucune capture UI.', 'transformations': ['proportional downsize to at most 1600px wide', 'WebP compression, quality 88'], 'importedAt': datetime.now(timezone.utc).isoformat(), 'images': records}
          (root / 'provenance-curated.json').write_text(json.dumps(provenance, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          # Independent image files only. No contact sheet, JSON, or generated collage in this archive.
          with zipfile.ZipFile('/tmp/tok-approved-photos.zip', 'w', compression=zipfile.ZIP_STORED) as image_archive:
            for photo in sorted(root.glob('*.webp')):
              if photo.name != 'tok-round-official.webp':
                image_archive.write(photo, arcname=photo.name)
          # A source-only review snapshot. No environment, git credentials, caches or runtime data.
          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.cjs', '.mjs', '.json', '.jsonc', '.md', '.css', '.yaml', '.yml', '.html', '.toml', '.svg', '.txt'}
          with tarfile.open('/tmp/tok-dashboard-source.tar.gz', 'w:gz') as archive:
            for raw in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not raw:
                continue
              file = pathlib.Path(raw)
              if file.suffix in suffixes and file.is_file() and not file.is_symlink() and not any(part.startswith('.env') for part in file.parts) and not file.name.startswith('service-account'):
                archive.add(file, arcname=raw, recursive=False)
          PY
      - name: Retain validated photographs for scoped import
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tok-dashboard-assets-${{ github.run_id }}
          path: /tmp/tok-dashboard-assets/
          retention-days: 1
          if-no-files-found: error
      - name: Retain native photos archive (only verified independent scenes)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tok-dashboard-photos-validated-${{ github.run_id }}
          path: /tmp/tok-approved-photos.zip
          retention-days: 7
          if-no-files-found: error
      - name: Retain exact source snapshot for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tok-dashboard-source-${{ github.run_id }}
          path: /tmp/tok-dashboard-source.tar.gz
          retention-days: 1
          if-no-files-found: error

  import:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      # No checkout, dependency installation or repository code executes with this token.
      - name: Commit only validated image files to the same branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, re, urllib.error, urllib.request, zipfile
          repo = 'Mtnrconcept1/cloud-rebuild'
          branch = 'codex/dashboard-white-page-heroes-20261021'
          expected = os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
          api_root = 'https://api.github.com/repos/' + repo + '/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET', body=None):
            payload = None if body is None else json.dumps(body).encode()
            request = urllib.request.Request(api_root + path, data=payload, headers=headers, method=method)
            with urllib.request.urlopen(request, timeout=60) as response:
              return json.load(response)
          ref_path = 'git/refs/heads/' + branch
          if api(ref_path)['object']['sha'] != expected:
            raise RuntimeError('Branch changed; refusing to overwrite concurrent work')
          run_id = os.environ['RUN_ID']
          artifacts = api('actions/runs/' + run_id + '/artifacts')['artifacts']
          artifact = next(a for a in artifacts if a['name'] == 'tok-dashboard-assets-' + run_id and not a['expired'])
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, fp, code, msg, hdrs, newurl):
              return None
          opener = urllib.request.build_opener(NoRedirect)
          try:
            opener.open(urllib.request.Request(api_root + 'actions/artifacts/' + str(artifact['id']) + '/zip', headers=headers), timeout=60)
            raise RuntimeError('Expected an artifact download redirect')
          except urllib.error.HTTPError as error:
            if error.code != 302:
              raise
            location = error.headers['Location']
          if not location.startswith('https://'):
            raise RuntimeError('Insecure artifact redirect')
          # Do not forward the GitHub credential to the artifact storage host.
          with urllib.request.urlopen(location, timeout=90) as response:
            content = response.read(80 * 1024 * 1024 + 1)
          if len(content) > 80 * 1024 * 1024:
            raise RuntimeError('Artifact exceeds size limit')
          names = ["client-accueil","client-reservations","client-avis","client-profil","client-favoris","client-abonnement","client-preferences","client-parametres","client-notifications","client-memoire","restaurant-menu","restaurant-performances","restaurant-facturation","restaurant-photos","restaurant-plan","restaurant-crm"]
          expected_files = {name + '.webp' for name in names} | {'provenance-curated.json', 'tok-round-official.webp'}
          archive = zipfile.ZipFile(io.BytesIO(content))
          if set(archive.namelist()) != expected_files:
            raise RuntimeError('Artifact does not match fixed file allowlist')
          provenance = json.loads(archive.read('provenance-curated.json'))
          records = {row['file']: row for row in provenance['images']}
          if set(records) != expected_files - {'provenance-curated.json', 'tok-round-official.webp'}:
            raise RuntimeError('Provenance does not match image set')
          tree = []
          for name in sorted(expected_files):
            info = archive.getinfo(name)
            if info.file_size > 1500000:
              raise RuntimeError('Oversized asset')
            data = archive.read(name)
            if name.endswith('.webp'):
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP' or (name in records and hashlib.sha256(data).hexdigest() != records[name]['sha256']):
                raise RuntimeError('Invalid asset or integrity mismatch')
            blob = api('git/blobs', 'POST', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
            tree.append({'path': ('public/images/brand/' if name == 'tok-round-official.webp' else 'public/images/dashboard-scenes/') + name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          parent = api('git/commits/' + expected)
          new_tree = api('git/trees', 'POST', {'base_tree': parent['tree']['sha'], 'tree': tree})
          commit = api('git/commits', 'POST', {'message': 'feat(dashboards): import validated native page artwork', 'tree': new_tree['sha'], 'parents': [expected]})
          if api(ref_path)['object']['sha'] != expected:
            raise RuntimeError('Concurrent work detected; commit left unattached')
          api(ref_path, 'PATCH', {'sha': commit['sha'], 'force': False})
          print('Image-only commit: ' + commit['sha'])
          print('Dedicated branch: ' + branch)
          PY
