name: Apply TOK 50k Foundation

on:
  push:
    branches:
      - infra/50k-readiness-foundation-20260724
    paths:
      - scripts/50k-foundation.bundle.part*
      - .github/workflows/apply-50k-foundation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tok-50k-foundation
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: infra/50k-readiness-foundation-20260724
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Reassemble and verify reviewed foundation bundle
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/50k-foundation.bundle.part* | base64 --decode > "${RUNNER_TEMP}/50k-foundation.tar.gz"
          echo "f721d43d81eeaa57a0f142234c5b69be86729aede67f3b93fc8405304adee2a4  ${RUNNER_TEMP}/50k-foundation.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/50k-foundation.tar.gz" -C .

      - name: Apply guarded repository patches
        run: node scripts/apply-50k-foundation-patches.mjs

      - name: Validate generated text changes
        run: |
          node --check scripts/verify-production-commit-provenance.mjs
          node --check scripts/load-50k-readiness.mjs
          node --check scripts/edge-function-auth-contract.mjs
          node --test \
            scripts/verify-production-commit-provenance.test.mjs \
            scripts/load-50k-readiness.test.mjs \
            scripts/edge-function-auth-contract.test.mjs
          node scripts/edge-function-auth-contract.mjs

      - name: Remove one-shot bootstrap files
        run: |
          rm -f -- scripts/50k-foundation.bundle.part*
          rm -f -- \
            scripts/apply-50k-foundation-patches.mjs \
            .github/workflows/apply-50k-foundation.yml
          git diff --check

      - name: Commit generated foundation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Repository already contains the foundation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(infra): add 50k readiness foundation"
          git push origin HEAD:infra/50k-readiness-foundation-20260724
