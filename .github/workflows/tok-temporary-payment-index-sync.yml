name: Temporary TOK payment canonical index sync
on:
  push:
    branches:
      - codex/tok-mcp-live-payment-status-hardening-20261017

concurrency:
  group: tok-mcp-payment-index-sync-20261017
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install pinned dependencies without scripts or write token
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Regenerate canonical application index excluding this temporary workflow
        run: |
          set -euo pipefail
          git rm --cached --quiet .github/workflows/tok-temporary-payment-index-sync.yml
          node scripts/generate-application-index.mjs
          node scripts/generate-application-index.mjs --check
      - uses: actions/upload-artifact@v4
        with:
          name: tok-payment-canonical-index
          retention-days: 1
          if-no-files-found: error
          path: |
            docs/architecture/TOK_APPLICATION_REFERENCE.md
            docs/architecture/tok-application-search-index.json
            src/data/tok-user-guide-catalog.generated.ts

  commit-index:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/tok-mcp-live-payment-status-hardening-20261017
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: tok-payment-canonical-index
          path: .
      - name: Commit only generated index and delete this temporary workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/tok-mcp-live-payment-status-hardening-20261017"
          test "$(git branch --show-current)" = "codex/tok-mcp-live-payment-status-hardening-20261017"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rm --quiet .github/workflows/tok-temporary-payment-index-sync.yml
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md
          git add docs/architecture/tok-application-search-index.json
          git add src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(tok): sync canonical index for payment status hardening"
          git push origin HEAD:refs/heads/codex/tok-mcp-live-payment-status-hardening-20261017
