name: App Store Tok One Setup

on:
  push:
    branches:
      - feat/ios-storekit-appstore-compliance
    paths:
      - ios/.appstore-tok-one-setup-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-tok-one-setup-production
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: ch.thetok.app
  APPLE_STOREKIT_NOTIFICATION_URL: https://wwcrtyoueexyxkkikaos.supabase.co/functions/v1/apple-storekit-webhook

jobs:
  configure:
    name: Configure Tok One subscriptions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: app-store-production
    env:
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Guard one-shot trigger
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          parent="${GITHUB_SHA}^"
          git cat-file -e "$parent"
          if ! git diff --name-status "$parent" "$GITHUB_SHA" | grep -Eq '^A[[:space:]]+ios/\.appstore-tok-one-setup-v1$'; then
            echo "::error::Tok One setup must be triggered by adding the v1 marker exactly once."
            exit 1
          fi

      - name: Validate setup script syntax
        run: node --check ./scripts/app-store-connect-tok-one.mjs

      - name: Configure subscriptions and notifications
        id: setup
        run: node ./scripts/app-store-connect-tok-one.mjs

      - name: Summarize configuration
        if: success()
        shell: bash
        run: |
          {
            echo "## Tok One — App Store Connect"
            echo ""
            echo "- Bundle: \`ch.thetok.app\`"
            echo "- Group: \`${{ steps.setup.outputs.subscription_group_id }}\`"
            echo "- Monthly: \`${{ steps.setup.outputs.monthly_subscription_id }}\` — state \`${{ steps.setup.outputs.monthly_state }}\` — CHF 14.90"
            echo "- Yearly: \`${{ steps.setup.outputs.yearly_subscription_id }}\` — state \`${{ steps.setup.outputs.yearly_state }}\` — CHF 149.00"
            echo "- Territory: Switzerland (CHE)"
            echo "- App Store Server Notifications: V2 production + sandbox"
          } >> "$GITHUB_STEP_SUMMARY"
