name: Temporary TOK application index regeneration

on:
  push:
    branches:
      - fix/admin-invoice-word-wrapping-20261014
    paths:
      - .github/workflows/tok-temporary-application-index.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-invoice-word-wrapping-20261014
          fetch-depth: 50
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Synchronize latest main and refresh generated reference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --depth=50
          git merge --no-edit origin/main
          git rm .github/workflows/tok-temporary-application-index.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add -u -- docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --stat
          git commit -m "docs: synchronize refreshed application index with main"
          git push origin HEAD:refs/heads/fix/admin-invoice-word-wrapping-20261014
