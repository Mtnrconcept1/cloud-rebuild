name: "PR786 Refresh generated error map and index (one-shot)"
on:
  push:
    branches:
      - fix/zero-attente-miamz-free-checkout-20261012
    paths:
      - .github/workflows/pr786-refresh-error-map.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/zero-attente-miamz-free-checkout-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Regenerate error map, application index and remove workflow
        shell: bash
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
          VITE_SUPABASE_ANON_KEY: ci-public-placeholder
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/zero-attente-miamz-free-checkout-20261012'
          git rm -- .github/workflows/pr786-refresh-error-map.yml
          pnpm generate:error-code-map
          pnpm docs:application-index
          pnpm docs:application-index:check
          pnpm exec vitest run --mode production src/test/incident-evidence-depth.test.ts
          git add supabase/functions/_shared/error-code-map.ts docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'chore: synchronize generated error code map and application index'
          git push origin HEAD:refs/heads/fix/zero-attente-miamz-free-checkout-20261012
