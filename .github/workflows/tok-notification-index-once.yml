name: One-time notifications index refresh
on:
  push:
    branches:
      - codex/tok-realtime-notifications-20261011
    paths:
      - .github/workflows/tok-notification-index-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/tok-realtime-notifications-20261011
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate and verify index without changing main
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/tok-notification-index-once.yml
          pnpm run docs:application-index
          pnpm run docs:application-index:check
          pnpm exec vitest run src/test/route-wiring.test.ts src/test/application-search-index.test.ts
          git add -- docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'chore(notifications): regenerate canonical app index'
          git push origin HEAD:refs/heads/codex/tok-realtime-notifications-20261011
