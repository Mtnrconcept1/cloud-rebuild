name: One-shot navbar index refresh (PR 782)
on:
  push:
    branches:
      - codex/cuisine-3d-webp-seo-20261012
    paths:
      - .github/workflows/_one-shot-refresh-navbar-index.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove one-shot workflow from index
        run: git rm -- .github/workflows/_one-shot-refresh-navbar-index.yml
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate canonical application index
        run: pnpm docs:application-index
      - name: Check canonical index
        run: pnpm docs:application-index:check
      - name: Verify targeted tests
        run: pnpm exec vitest run src/test/application-search-index.test.ts src/test/navbar-action-stability.test.ts src/test/space-help-chat.test.ts
      - name: Commit regenerated index
        run: |
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh application index after navbar fix'
          git push origin HEAD:codex/cuisine-3d-webp-seo-20261012
