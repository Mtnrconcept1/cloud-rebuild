name: Temporary TOK PR 923 index reconciliation
on:
  push:
    branches:
      - feat/remember-login-reviewed
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable locked pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate index against the final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/_tok_pr923_generate_index_temporary.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(auth): refresh generated index after main reconciliation'
          git push origin HEAD:refs/heads/feat/remember-login-reviewed
