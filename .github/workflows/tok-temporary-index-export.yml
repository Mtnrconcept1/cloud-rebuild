name: Temporary TOK application index export
on:
  push:
    branches:
      - codex/tok-stripe-test-webhook-readiness-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.ref == 'refs/heads/codex/tok-stripe-test-webhook-readiness-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Install dependencies without secrets
        run: pnpm install --frozen-lockfile
      - name: Generate target-branch index without this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm --cached --quiet .github/workflows/tok-temporary-index-export.yml
          rm -f .github/workflows/tok-temporary-index-export.yml
          node scripts/generate-application-index.mjs
          node scripts/generate-application-index.mjs --check
      - uses: actions/upload-artifact@v4
        with:
          name: tok-temporary-canonical-index
          path: |
            docs/architecture/tok-application-search-index.json
            docs/architecture/TOK_APPLICATION_REFERENCE.md
            src/data/tok-user-guide-catalog.generated.ts
          retention-days: 1
          if-no-files-found: error
