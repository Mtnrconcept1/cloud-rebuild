name: One-time Zéro Attente release index refresh

on:
  push:
    branches:
      - fix/zero-attente-no-cost-prod-release-20261013
    paths:
      - .github/workflows/_zero-attente-index-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/zero-attente-no-cost-prod-release-20261013
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pnpm and dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
      - name: Remove one-time workflow
        run: git rm .github/workflows/_zero-attente-index-once.yml
      - name: Refresh generated application and error indexes
        run: |
          pnpm generate:error-code-map
          pnpm docs:application-index
          pnpm docs:application-index:check
      - name: Check release regressions
        run: pnpm exec vitest run --mode production src/test/zero-attente-free-miamz.test.ts src/test/deploy-production-secret-scope.test.ts src/test/seo-indexation-hardening.test.ts src/test/application-search-index.test.ts
      - name: Commit derived artifacts
        run: |
          git config user.name "tok-ci-bot"
          git config user.email "tok-ci-bot@users.noreply.github.com"
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json supabase/functions/_shared/error-code-map.ts
          git commit -m "docs(index): synchronize Zéro Attente backend release dependency"
          git push origin HEAD:fix/zero-attente-no-cost-prod-release-20261013
