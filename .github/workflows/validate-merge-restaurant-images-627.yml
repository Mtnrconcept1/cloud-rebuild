name: Validate and merge restaurant image PR 627

on:
  push:
    branches:
      - ops/validate-merge-restaurant-images-627

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: validate-merge-restaurant-images-627
  cancel-in-progress: false

jobs:
  gate-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: "627"
      EXPECTED_HEAD_BRANCH: fix/restaurant-image-truth-backfill-20260904

    steps:
      - name: Verify immutable pull request target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          PR_JSON="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,isDraft,headRefName,headRefOid,baseRefName,url)"

          test "$(jq -r '.state' <<<"$PR_JSON")" = "OPEN"
          test "$(jq -r '.isDraft' <<<"$PR_JSON")" = "false"
          test "$(jq -r '.headRefName' <<<"$PR_JSON")" = "$EXPECTED_HEAD_BRANCH"
          test "$(jq -r '.baseRefName' <<<"$PR_JSON")" = "main"

          HEAD_SHA="$(jq -r '.headRefOid' <<<"$PR_JSON")"
          test "$HEAD_SHA" != "null"
          test -n "$HEAD_SHA"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Require checks and wait for every check to pass
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            CHECKS="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json name,state,bucket,workflow 2>/dev/null || true)"
            COUNT="$(jq 'length' <<<"${CHECKS:-[]}")"
            if (( COUNT > 0 )); then
              break
            fi
            sleep 10
          done

          CHECKS="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json name,state,bucket,workflow)"
          test "$(jq 'length' <<<"$CHECKS")" -gt 0
          jq -e 'any(.[]; ((.workflow // "") == "CI") or (.name == "validate"))' \
            <<<"$CHECKS" >/dev/null

          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --watch --interval 10 --fail-fast

          FINAL_CHECKS="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json name,state,bucket,workflow)"
          jq -e 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' \
            <<<"$FINAL_CHECKS" >/dev/null

      - name: Recheck immutable head and merge without bypass
        env:
          APPROVED_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,headRefOid --jq 'select(.state == "OPEN") | .headRefOid')"
          test "$CURRENT_HEAD_SHA" = "$APPROVED_HEAD_SHA"

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "$APPROVED_HEAD_SHA" \
            --subject "fix(directory): vérifier les images et continuer le remplissage (#627)"

      - name: Remove temporary validation branch
        if: ${{ success() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/git/refs/heads/ops/validate-merge-restaurant-images-627"
