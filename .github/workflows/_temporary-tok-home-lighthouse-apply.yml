name: Temporary TOK Lighthouse fix publisher
on:
  push:
    branches:
      - codex/fix-tok-canton-hero-lighthouse-20261012
    paths:
      - .github/workflows/_temporary-tok-home-lighthouse-apply.yml
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out dedicated branch
        uses: actions/checkout@v6
        with:
          ref: codex/fix-tok-canton-hero-lighthouse-20261012
          fetch-depth: 5
          persist-credentials: true
      - name: Set Node version
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Apply the audited patch and generate optimized WebP imagery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TOK CI Assistant"
          git config user.email "tok-ci-assistant@users.noreply.github.com"
          base64 --decode .tok_home_lighthouse.patch.gz.b64 | gzip -d > /tmp/tok-light.patch
          echo "a9f82fe2478d9cfd919e0062ebac97151ebad5fbe441a2ccc78ccdc8685614586  /tmp/tok-light.patch" | sha256sum --check
          git apply --check /tmp/tok-light.patch
          git apply /tmp/tok-light.patch
          npm install --prefix /tmp/tok-imgsharp sharp --no-audit --no-fund --loglevel=error
          node <<'JS'
          const sharp = require('/tmp/tok-imgsharp/node_modules/sharp');
          const fs = require('node:fs');
          const path = require('node:path');
          async function main() {
            const dir = 'public/images/section-headers';
            const names = ['cuisine','feast','gastronomy','rewards','geneva','delivery','evening','reservation'];
            for (const name of names) {
              const source = path.join(dir, `tok-editorial-${name}-full.jpg`);
              const target = path.join(dir, `tok-editorial-${name}-optimized.webp`);
              await sharp(source).resize({width:1600,withoutEnlargement:true}).webp({quality:72,effort:5}).toFile(target);
              if (fs.statSync(target).size > 90000) throw new Error('Oversized banner: ' + target);
            }
          }
          main().catch(error => {console.error(error); process.exitCode=1;});
          JS
      - name: Validate the final tree
        shell: bash
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
          VITE_SUPABASE_ANON_KEY: ci-public-placeholder
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
          git rm -f .tok_home_lighthouse.patch.gz.b64 .github/workflows/_temporary-tok-home-lighthouse-apply.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          pnpm exec vitest run --mode production src/test/home-hero-search.test.tsx src/test/home-core-web-vitals.test.ts src/test/home-canton-hero.test.ts src/test/home-section-showcase-header.test.tsx src/test/solidarity-section.test.tsx
          pnpm lint
          pnpm typecheck
          pnpm build:prod
          git add index.html src/components/LoyaltyStatus.tsx src/components/Navbar.tsx src/components/PromoCarousel.tsx src/components/home/CuisineCategoryStrip.tsx src/components/home/HeroSection.css src/components/home/HeroSection.tsx src/components/home/RestaurantSection.tsx src/components/home/SectionShowcaseHeader.tsx src/pages/Index.tsx src/test/home-core-web-vitals.test.ts src/test/home-hero-search.test.tsx docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json public/images/section-headers/tok-editorial-*-optimized.webp
          git diff --cached --check
          git commit -m "fix(home): prevent canton image conflicts and optimize Lighthouse"
          git push origin HEAD:refs/heads/codex/fix-tok-canton-hero-lighthouse-20261012
      - name: Trigger branch CI for final commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref codex/fix-tok-canton-hero-lighthouse-20261012
