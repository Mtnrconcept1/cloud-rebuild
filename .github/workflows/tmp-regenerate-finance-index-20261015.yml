name: One-time regenerate TOK index for finance PR

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  regenerate:
    if: >-
      github.repository == 'Mtnrconcept1/cloud-rebuild' &&
      github.event.pull_request.number == 867 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/zero-attente-stripe-fees-20261015' &&
      github.event.pull_request.user.login == 'mtnrconcept'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zero-attente-stripe-fees-20261015
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove one-shot workflow and regenerate canonical index
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/tmp-regenerate-finance-index-20261015.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate canonical TOK application index for payment repairs"
          git push origin HEAD:refs/heads/codex/zero-attente-stripe-fees-20261015
