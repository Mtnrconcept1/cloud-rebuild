name: Refresh TOK application index for PR 973

on:
  push:
    branches:
      - fix/tok-orange-client-home-20261023
    paths:
      - .github/workflows/_refresh-tok-index-pr973.yml

permissions:
  contents: write

jobs:
  regenerate-and-remove-self:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild' && github.ref == 'refs/heads/fix/tok-orange-client-home-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove temporary workflow and regenerate canonical reference
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/_refresh-tok-index-pr973.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(tok): refresh canonical application reference"
          git push origin "HEAD:${GITHUB_REF_NAME}"
