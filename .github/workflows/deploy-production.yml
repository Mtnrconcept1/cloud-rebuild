name: Deploy Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  SUPABASE_CLI_VERSION: 2.102.0
  SUPABASE_PROJECT_REF: wwcrtyoueexyxkkikaos
  PRODUCTION_SUPABASE_URL: https://wwcrtyoueexyxkkikaos.supabase.co
  APP_BASE_URL: https://www.thetok.ch
  PUBLIC_APP_URL: https://www.thetok.ch
  SITE_URL: https://www.thetok.ch
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write production frontend env
        run: node ./scripts/write-production-env.mjs --out=.env.production
        env:
          GITHUB_SHA: ${{ github.sha }}
          VITE_SUPABASE_PROJECT_ID: wwcrtyoueexyxkkikaos
          VITE_SUPABASE_URL: https://wwcrtyoueexyxkkikaos.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Align repo to production Supabase target
        run: pnpm run supabase:target:prod

      - name: Verify production Supabase target
        run: pnpm run supabase:doctor:prod

      - name: Release readiness
        run: pnpm run release:readiness
        env:
          RELEASE_READINESS_STRICT: "false"
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_PERSONNAL_SECRET_KEY || secrets.STRIPE_PERSONAL_SECRET_KEY || secrets.STRIPE_SECRET_KEY_LIVE }}
          STRIPE_SECRET_KEY_LIVE: ${{ secrets.STRIPE_PERSONNAL_SECRET_KEY || secrets.STRIPE_PERSONAL_SECRET_KEY || secrets.STRIPE_SECRET_KEY_LIVE }}
          STRIPE_PERSONNAL_SECRET_KEY: ${{ secrets.STRIPE_PERSONNAL_SECRET_KEY }}
          STRIPE_PERSONAL_SECRET_KEY: ${{ secrets.STRIPE_PERSONAL_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || secrets.STRIPE_LIVE_WEBHOOK }}
          STRIPE_LIVE_WEBHOOK: ${{ secrets.STRIPE_LIVE_WEBHOOK }}
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_BASE_URL: ${{ env.APP_BASE_URL }}
          PUBLIC_APP_URL: ${{ env.PUBLIC_APP_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_TOKEN_URI: ${{ secrets.FIREBASE_TOKEN_URI }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SUPABASE_LEAKED_PASSWORD_PROTECTION_CONFIRMED: ${{ vars.SUPABASE_LEAKED_PASSWORD_PROTECTION_CONFIRMED }}
          SUPABASE_LEAKED_PASSWORD_PROTECTION_EVIDENCE: ${{ vars.SUPABASE_LEAKED_PASSWORD_PROTECTION_EVIDENCE }}

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:prod

      - name: Build production app
        run: pnpm run build:prod

  deploy_supabase:
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: https://wwcrtyoueexyxkkikaos.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_PERSONNAL_SECRET_KEY || secrets.STRIPE_PERSONAL_SECRET_KEY || secrets.STRIPE_SECRET_KEY_LIVE }}
      STRIPE_SECRET_KEY_LIVE: ${{ secrets.STRIPE_PERSONNAL_SECRET_KEY || secrets.STRIPE_PERSONAL_SECRET_KEY || secrets.STRIPE_SECRET_KEY_LIVE }}
      STRIPE_PERSONNAL_SECRET_KEY: ${{ secrets.STRIPE_PERSONNAL_SECRET_KEY }}
      STRIPE_PERSONAL_SECRET_KEY: ${{ secrets.STRIPE_PERSONAL_SECRET_KEY }}
      STRIPE_LIVE_WEBHOOK: ${{ secrets.STRIPE_LIVE_WEBHOOK }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || secrets.STRIPE_LIVE_WEBHOOK }}
      STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_LIVE_WEBHOOK || secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_WEBHOOK_SIGNING_SECRET: ${{ secrets.STRIPE_WEBHOOK_SIGNING_SECRET || secrets.STRIPE_LIVE_WEBHOOK }}
      STRIPE_WEBHOOK_SIGNING_SECRET_LIVE: ${{ secrets.STRIPE_LIVE_WEBHOOK || secrets.STRIPE_WEBHOOK_SIGNING_SECRET }}
      STRIPE_TOK_ONE_SECRET_KEY: ${{ secrets.STRIPE_TOK_ONE_SECRET_KEY }}
      STRIPE_TOK_ONE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TOK_ONE_TEST_SECRET_KEY }}
      STRIPE_TOK_ONE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TOK_ONE_WEBHOOK_SECRET }}
      STRIPE_TOK_ONE_WEBHOOK_SIGNING_SECRET: ${{ secrets.STRIPE_TOK_ONE_WEBHOOK_SIGNING_SECRET }}
      STRIPE_TOK_ONE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TOK_ONE_TEST_WEBHOOK_SECRET }}
      STRIPE_TOK_ONE_TEST_WEBHOOK_SIGNING_SECRET: ${{ secrets.STRIPE_TOK_ONE_TEST_WEBHOOK_SIGNING_SECRET }}
      INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_IMAGE_TIMEOUT_MS: ${{ secrets.OPENAI_IMAGE_TIMEOUT_MS }}
      TOK_IMAGE_FAST_INTERACTIVE: ${{ secrets.TOK_IMAGE_FAST_INTERACTIVE }}
      TOK_INTERACTIVE_IMAGE_TIMEOUT_MS: ${{ secrets.TOK_INTERACTIVE_IMAGE_TIMEOUT_MS }}
      TOK_AI_IMAGE_BUCKET: ${{ secrets.TOK_AI_IMAGE_BUCKET }}
      TOK_GALLERY_IMAGE_BUCKET: ${{ secrets.TOK_GALLERY_IMAGE_BUCKET }}
      TOK_SOURCE_IMAGE_TIMEOUT_MS: ${{ secrets.TOK_SOURCE_IMAGE_TIMEOUT_MS }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      FIREBASE_TOKEN_URI: ${{ secrets.FIREBASE_TOKEN_URI }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write production frontend env
        run: node ./scripts/write-production-env.mjs --out=.env.production
        env:
          GITHUB_SHA: ${{ github.sha }}
          VITE_SUPABASE_PROJECT_ID: wwcrtyoueexyxkkikaos
          VITE_SUPABASE_URL: https://wwcrtyoueexyxkkikaos.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Align repo to production Supabase target
        run: pnpm run supabase:target:prod

      - name: Verify production Supabase target
        run: pnpm run supabase:doctor:prod

      - name: Prepare Supabase function secrets env
        run: node ./scripts/write-supabase-secrets-env.mjs --out=${RUNNER_TEMP}/supabase.functions.env

      - name: Link Supabase production project
        run: |
          source ./scripts/supabase-ci-retry.sh
          supabase_ci_retry link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Sync Supabase production secrets
        run: |
          source ./scripts/supabase-ci-retry.sh
          supabase_ci_retry secrets set --env-file "${RUNNER_TEMP}/supabase.functions.env" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        run: |
          source ./scripts/supabase-ci-retry.sh
          supabase_ci_retry db push --linked --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        run: |
          source ./scripts/supabase-ci-retry.sh
          supabase_ci_retry functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

  deploy_frontend:
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - deploy_supabase
    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_SUPABASE_PROJECT_ID: wwcrtyoueexyxkkikaos
      VITE_SUPABASE_URL: https://wwcrtyoueexyxkkikaos.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

    steps:
      - name: Assert Vercel production secrets
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing VERCEL_TOKEN" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing VERCEL_ORG_ID" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing VERCEL_PROJECT_ID" && exit 1)

      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write production frontend env
        run: node ./scripts/write-production-env.mjs --out=.env.production
        env:
          GITHUB_SHA: ${{ github.sha }}
          VITE_SUPABASE_PROJECT_ID: wwcrtyoueexyxkkikaos
          VITE_SUPABASE_URL: https://wwcrtyoueexyxkkikaos.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Pull Vercel production project settings
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production output
        run: pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel prebuilt production output
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
