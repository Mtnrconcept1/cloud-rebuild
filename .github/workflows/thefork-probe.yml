name: TheFork Geneva extraction probe

on:
  push:
    branches:
      - ops/thefork-geneva-extraction-2026-07-24
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public extraction routes
        shell: bash
        run: |
          set +e
          python3 --version
          urls=(
            'https://www.thefork.ch/restaurants/geneve-c186655?p=1'
            'https://r.jina.ai/https://www.thefork.ch/restaurants/geneve-c186655?p=1'
            'https://r.jina.ai/http://www.thefork.ch/restaurants/geneve-c186655?p=1'
            'https://r.jina.ai/https://www.thefork.ch/restaurant/les-ciboulettes-r592029'
            'https://s.jina.ai/?q=Les+Ciboulettes+Geneve+email'
            'https://html.duckduckgo.com/html/?q=Les+Ciboulettes+Geneve+email'
          )
          for url in "${urls[@]}"; do
            echo "===== URL: $url ====="
            curl --location --silent --show-error --max-time 45 \
              --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138 Safari/537.36' \
              --header 'Accept-Language: fr-CH,fr;q=0.9,en;q=0.7' \
              --write-out '\nHTTP_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\nSIZE=%{size_download}\n' \
              "$url" | head -c 9000
            echo
          done
          exit 0
