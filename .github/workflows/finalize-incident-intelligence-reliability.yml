name: Finalize incident intelligence reliability

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  finalize:
    name: Preserve support context and refresh stale Guardian cache
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unify-incident-intelligence'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/unify-incident-intelligence
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final reliability patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              return source.replace(old, new, 1)

          shared_path = Path("supabase/functions/_shared/incident-intelligence.ts")
          shared = shared_path.read_text(encoding="utf-8")
          old_selector = '''export function selectSupportMessages(
            rawMessages: Array<Record<string, unknown>>,
            maxMessages = 28,
          ) {
            const normalized = rawMessages.map((message, index) => ({
              ...message,
              body: typeof message.body === "string" ? message.body.trim().slice(0, 1_200) : "",
              __index: index,
              __identity: messageIdentity(message, index),
            }));
            if (normalized.length <= maxMessages) {
              return normalized.map(({ __index: _index, __identity: _identity, ...message }) => message);
            }

            const selected = new Map<string, typeof normalized[number]>();
            const add = (message: typeof normalized[number] | undefined) => {
              if (message) selected.set(message.__identity, message);
            };

            normalized.slice(0, 4).forEach(add);
            normalized.slice(-12).forEach(add);

            const important = /(payment|paiement|stripe|refund|rembourse|reservation|réservation|order|commande|confirm|cancel|annul|error|erreur|allerg|medical|médical|fraud|fraude|urgent|legal|juridique|chargeback)/i;
            normalized
              .filter((message) => important.test(String(message.body || "")))
              .slice(-16)
              .forEach(add);

            const ordered = [...selected.values()]
              .sort((left, right) => left.__index - right.__index)
              .slice(-maxMessages);
            return ordered.map(({ __index: _index, __identity: _identity, ...message }) => message);
          }'''
          new_selector = '''export function selectSupportMessages(
            rawMessages: Array<Record<string, unknown>>,
            maxMessages = 28,
          ) {
            const requestedLimit = Number.isFinite(maxMessages) ? Math.floor(maxMessages) : 28;
            const limit = Math.max(1, requestedLimit);
            const normalized = rawMessages.map((message, index) => ({
              ...message,
              body: typeof message.body === "string" ? message.body.trim().slice(0, 1_200) : "",
              __index: index,
              __identity: messageIdentity(message, index),
            }));
            if (normalized.length <= limit) {
              return normalized.map(({ __index: _index, __identity: _identity, ...message }) => message);
            }

            const selected = new Map<string, typeof normalized[number]>();
            const add = (message: typeof normalized[number] | undefined) => {
              if (message) selected.set(message.__identity, message);
            };

            const firstCount = Math.min(4, Math.max(1, limit - 1));
            normalized.slice(0, firstCount).forEach(add);

            const lastCount = Math.min(12, Math.max(0, limit - selected.size));
            if (lastCount > 0) normalized.slice(-lastCount).forEach(add);

            const important = /(payment|paiement|stripe|refund|rembourse|reservation|réservation|order|commande|confirm|cancel|annul|error|erreur|allerg|medical|médical|fraud|fraude|urgent|legal|juridique|chargeback)/i;
            const remaining = Math.max(0, limit - selected.size);
            if (remaining > 0) {
              normalized
                .filter((message) => important.test(String(message.body || "")))
                .filter((message) => !selected.has(message.__identity))
                .slice(-remaining)
                .forEach(add);
            }

            const ordered = [...selected.values()]
              .sort((left, right) => left.__index - right.__index);
            return ordered.map(({ __index: _index, __identity: _identity, ...message }) => message);
          }'''
          shared = replace_once(shared, old_selector, new_selector, "support message selector")
          shared_path.write_text(shared, encoding="utf-8")

          guardian_path = Path("supabase/functions/ai-guardian/index.ts")
          guardian = guardian_path.read_text(encoding="utf-8")
          canonical_start = guardian.index("  const canonical = buildCanonicalGuardianAssessment(incident);")
          canonical_end = guardian.index("\n\n  if (canonical && !deepRequired)", canonical_start)
          canonical_block = guardian[canonical_start:canonical_end]
          guardian = guardian[:canonical_start] + guardian[canonical_end + 2:]

          query_marker = "  const { data: existingAssessment, error: existingError } = await actor.adminClient"
          if guardian.count(query_marker) != 1:
              raise SystemExit("Guardian assessment query marker missing")
          guardian = guardian.replace(
              query_marker,
              canonical_block + "\n\n" + query_marker,
              1,
          )

          old_cache_start = '''  if (existingAssessment && !forceDeepAnalysis) {
            const reusedModel = existingAssessment.model || "cache";'''
          new_cache_start = '''  const currentSeverity = canonical?.severity || normalizeLevel(incident.severity);
            const currentRiskLevel = canonical?.risk_level || normalizeLevel(incident.risk_level);
            const reusableExistingAssessment = Boolean(
              existingAssessment
                && !forceDeepAnalysis
                && (
                  existingAssessment.analysis_source === "deep"
                    ? normalizeLevel(existingAssessment.severity) === currentSeverity
                      && normalizeLevel(existingAssessment.risk_level) === currentRiskLevel
                    : !deepRequired
                      && canonical
                      && normalizeLevel(existingAssessment.severity) === canonical.severity
                      && normalizeLevel(existingAssessment.risk_level) === canonical.risk_level
                )
            );
            if (reusableExistingAssessment && existingAssessment) {
            const reusedModel = existingAssessment.model || "cache";'''
          guardian = replace_once(
              guardian,
              old_cache_start,
              new_cache_start,
              "Guardian cache freshness guard",
          )
          guardian_path.write_text(guardian, encoding="utf-8")

          test_path = Path("src/test/incident-intelligence-routing.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              "  shouldUseDeepIncidentAnalysis,\n",
              "  selectSupportMessages,\n  shouldUseDeepIncidentAnalysis,\n",
              "support selector test import",
          )

          final_marker = "\n});\n"
          if not tests.endswith(final_marker):
              raise SystemExit("Unexpected routing test terminator")
          extra_tests = '''

            it("preserves the opening complaint and latest replies in the bounded support context", () => {
              const messages = Array.from({ length: 50 }, (_, index) => ({
                id: `message-${index}`,
                author_role: index % 2 === 0 ? "customer" : "admin",
                created_at: `2026-08-01T10:${String(index).padStart(2, "0")}:00Z`,
                body: index === 0
                  ? "Plain opening complaint with essential context"
                  : index >= 8 && index < 42
                  ? `Payment error detail ${index}`
                  : `Conversation message ${index}`,
              }));

              const selected = selectSupportMessages(messages, 28);
              const ids = selected.map((message) => message.id);

              expect(selected).toHaveLength(28);
              expect(ids[0]).toBe("message-0");
              expect(ids).toContain("message-49");
              expect(ids.at(-1)).toBe("message-49");
            });

            it("invalidates a stale canonical Guardian assessment when severity or risk changes", () => {
              const guardian = readFileSync(
                resolve(root, "supabase/functions/ai-guardian/index.ts"),
                "utf8",
              );
              const canonicalIndex = guardian.indexOf(
                "const canonical = buildCanonicalGuardianAssessment(incident)",
              );
              const cacheQueryIndex = guardian.indexOf(
                "const { data: existingAssessment, error: existingError }",
              );

              expect(canonicalIndex).toBeGreaterThan(0);
              expect(cacheQueryIndex).toBeGreaterThan(canonicalIndex);
              expect(guardian).toContain("const reusableExistingAssessment = Boolean(");
              expect(guardian).toContain(
                "normalizeLevel(existingAssessment.severity) === currentSeverity",
              );
              expect(guardian).toContain(
                "normalizeLevel(existingAssessment.risk_level) === currentRiskLevel",
              );
              expect(guardian).toContain(": !deepRequired");
            });'''
          tests = tests[:-len(final_marker)] + extra_tests + final_marker
          test_path.write_text(tests, encoding="utf-8")

          print("Final incident intelligence reliability patch applied.")
          PY

      - name: Regenerate canonical error-code map
        run: pnpm run generate:error-code-map

      - name: Run focused tests
        run: >-
          pnpm exec vitest run --mode production
          src/test/incident-intelligence-routing.test.ts
          src/test/incident-intelligence-unification.test.ts
          src/test/incident-automation-readiness.test.ts
          src/test/incident-evidence-depth.test.ts
          src/test/tok-intelligence-suite.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build:prod

      - name: Validate and commit only product changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- \
            public/sitemap-actualites.xml \
            public/sitemap-pages.xml \
            public/sitemap-restaurants.xml
          rm -f .github/workflows/finalize-incident-intelligence-reliability.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/_shared/incident-intelligence.ts \
            supabase/functions/_shared/error-code-map.ts \
            supabase/functions/ai-guardian/index.ts \
            src/test/incident-intelligence-routing.test.ts
          git add -u .github/workflows/finalize-incident-intelligence-reliability.yml

          git diff --cached --check
          if git diff --cached | grep -Eiq '(sk-proj-|sk-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|whsec_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})'; then
            echo "::error::A secret-like value was detected in the final diff."
            exit 1
          fi

          git commit -m "fix(ops): preserve support context and refresh Guardian cache"
          git push origin HEAD:feat/unify-incident-intelligence
