name: Diagnose PR 518 test shards

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/restaurateur-onboarding-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [2, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/restaurateur-onboarding-reliability
          fetch-depth: 1

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run shard and capture JSON
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run --mode production --shard=${{ matrix.shard }}/4 --reporter=json --outputFile="$RUNNER_TEMP/shard-${{ matrix.shard }}.json"

      - name: Build sanitized failure summary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const shard = process.env.SHARD;
          const input = `${process.env.RUNNER_TEMP}/shard-${shard}.json`;
          const output = `${process.env.RUNNER_TEMP}/shard-${shard}-summary.json`;
          const report = JSON.parse(fs.readFileSync(input, 'utf8'));
          const failures = [];
          for (const file of report.testResults || []) {
            for (const assertion of file.assertionResults || []) {
              if (assertion.status !== 'failed') continue;
              const message = String((assertion.failureMessages || [])[0] || '')
                .replace(/(?:sk|ghp|github_pat|sb_secret|whsec)_[A-Za-z0-9_-]+/g, '[REDACTED]')
                .slice(0, 3000);
              failures.push({
                file: file.name,
                title: assertion.fullName || assertion.title,
                message,
              });
            }
          }
          fs.writeFileSync(output, JSON.stringify({ shard, failures }, null, 2));
          NODE
        env:
          SHARD: ${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        with:
          name: pr518-shard-${{ matrix.shard }}-failures
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}-summary.json
          if-no-files-found: error
          retention-days: 1
