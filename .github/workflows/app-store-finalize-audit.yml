name: App Store Finalize Audit

on:
  push:
    branches:
      - chore/appstore-finalize-audit-2
    paths:
      - scripts/app-store-connect-finalize-audit.mjs
      - .github/workflows/app-store-finalize-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: Audit App Store submission state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: app-store-production
    env:
      IOS_BUNDLE_ID: ch.thetok.app
      APP_STORE_VERSION: "1.0"
      APP_STORE_LOCALE: fr-FR
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate audit script
        run: node --check ./scripts/app-store-connect-finalize-audit.mjs
      - name: Audit current App Store Connect state
        run: node ./scripts/app-store-connect-finalize-audit.mjs
