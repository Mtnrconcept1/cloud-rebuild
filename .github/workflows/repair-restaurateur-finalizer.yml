name: Repair restaurateur onboarding finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/restaurateur-onboarding-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/restaurateur-onboarding-reliability
          fetch-depth: 0

      - name: Replace fragile checkout patch with anchor-based patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-restaurateur-onboarding-reliability.yml')
          source = path.read_text(encoding='utf-8')
          label = '              "onboarding card recovery message",'
          label_index = source.index(label)
          block_start = source.rfind('          auth = replace_once(', 0, label_index)
          if block_start < 0:
              raise SystemExit('Unable to locate fragile checkout patch start')
          block_end = source.index('\n          )', label_index) + len('\n          )')

          replacement = r'''          checkout_anchor = "const checkout = await createCheckoutWithRecovery({"
          checkout_anchor_index = auth.index(checkout_anchor)
          checkout_start = auth.rfind("\n", 0, checkout_anchor_index) + 1
          checkout_end_anchor = 'if (!checkout.url) throw new Error("La session d\\'enregistrement de la carte est en cours de vérification.");'
          checkout_end_anchor_index = auth.index(checkout_end_anchor, checkout_anchor_index)
          checkout_end = auth.rfind("\n", 0, checkout_end_anchor_index)
          checkout_replacement = '''  const checkout = await (async () => {
            try {
              return await createCheckoutWithRecovery({
                paymentAttemptId,
                create: async () => {
                  const { data, error } = await invokeSupabaseFunction("create-checkout", { body: checkoutPayload });
                  if (error) throw error;
                  return data;
                },
                getStatus: async () => {
                  const { data, error } = await invokeSupabaseFunction("payment-attempt-status", {
                    body: { payment_attempt_id: paymentAttemptId },
                  });
                  if (error) throw error;
                  return data;
                },
              });
            } catch (error) {
              if (isPaymentAttemptIndeterminateError(error)) {
                throw new Error(
                  "La demande d’enregistrement de carte est encore en cours de vérification. Aucun débit n’a été créé. Réessayez dans quelques instants.",
                );
              }
              throw error;
            }
          })();'''
          auth = auth[:checkout_start] + checkout_replacement + auth[checkout_end:]'''

          path.write_text(source[:block_start] + replacement + source[block_end:], encoding='utf-8')
          PY

      - name: Commit repaired finalizer and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-restaurateur-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/finalize-restaurateur-onboarding-reliability.yml
          git add -u .github/workflows/repair-restaurateur-finalizer.yml
          git diff --cached --check
          git commit -m "ci: make onboarding finalizer patch anchor-based"
          git push origin HEAD:fix/restaurateur-onboarding-reliability
