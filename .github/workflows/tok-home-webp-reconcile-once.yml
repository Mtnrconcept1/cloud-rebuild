name: TOK Home WebP branch reconciliation (one shot)
on:
  push:
    branches:
      - codex/tok-home-webp-responsive-20261014
    paths:
      - .github/workflows/tok-home-webp-reconcile-once.yml
permissions:
  contents: write
jobs:
  reconcile:
    if: github.ref == 'refs/heads/codex/tok-home-webp-responsive-20261014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile latest main and regenerate only conflicted indexes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge --no-commit --no-ff origin/main; then
            echo 'Merge cleanly staged.'
          else
            echo 'Checking merge conflicts before resolving generated indexes.'
          fi
          allowed='docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts'
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case " $allowed " in
              *" $path "*) git checkout --ours -- "$path" ;;
              *) echo "::error::Unexpected merge conflict: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only --diff-filter=U)
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "::error::Merge still has unresolved conflicts"; exit 1
          fi
          pnpm run docs:application-index
          pnpm run docs:application-index:check
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git commit -m 'chore(home): reconcile main and regenerate generated WebP indexes'
          git push origin HEAD:refs/heads/codex/tok-home-webp-responsive-20261014
