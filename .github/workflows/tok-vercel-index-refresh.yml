name: TOK Vercel deployment config index refresh (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tok-vercel-index-refresh.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.event.pull_request.number == 840 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/vercel-git-deployments-off-20261014' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed feature revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove temporary workflow, regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/tok-vercel-index-refresh.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          pnpm exec vitest run --mode production src/test/vercel-rewrites.test.ts src/test/application-search-index.test.ts
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(vercel): refresh TOK application index for Git deployment control"
          git push origin HEAD:refs/heads/chore/vercel-git-deployments-off-20261014
