name: Temporary Workforce SQL Index Sync

on:
  push:
    branches:
      - fix/tok-workforce-sql-delimiters-20261014
    paths:
      - .github/workflows/tok-workforce-sql-index-sync.yml

permissions:
  contents: write

jobs:
  sync-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate application reference and self-remove
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/tok-workforce-sql-delimiters-20261014"
          git rm -- .github/workflows/tok-workforce-sql-index-sync.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git commit -m "docs(workforce): synchronize SQL migration documentation"
          git push origin HEAD:refs/heads/fix/tok-workforce-sql-delimiters-20261014
