name: TOK mailing generated-index refresh (one shot)

on:
  push:
    branches:
      - fix/tok-mailing-da-editorial-posters-20261028
    paths:
      - .github/workflows/tok-mailing-index-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/tok-mailing-da-editorial-posters-20261028
          fetch-depth: 1
          persist-credentials: true
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies without postinstall mutation
        run: pnpm install --frozen-lockfile
      - name: Remove one-shot workflow from index before regenerating
        run: git rm -f .github/workflows/tok-mailing-index-refresh-once.yml
      - name: Regenerate canonical application index and error-code map
        run: |
          pnpm run docs:application-index
          pnpm run generate:error-code-map
          pnpm run docs:application-index:check
      - name: Commit generated files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts supabase/functions/_shared/error-code-map.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): régénérer les références TOK des e-mails"
          git push origin HEAD:refs/heads/fix/tok-mailing-da-editorial-posters-20261028
