name: PR 419 diagnostics

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
  VITE_SUPABASE_ANON_KEY: ci-public-placeholder

jobs:
  shard-2-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run shard 2 and preserve JSON report
        id: tests
        continue-on-error: true
        run: pnpm exec vitest run --mode production --shard=2/4 --reporter=json --outputFile=vitest-shard2.json
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr419-vitest-shard2
          path: vitest-shard2.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failure status
        if: steps.tests.outcome == 'failure'
        run: exit 1
