name: Apply pickup-only public copy v3

on:
  push:
    branches: [fix/legal-flat10-pickup-only]
    paths: [.github/workflows/apply-flat10-public-v3.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/legal-flat10-pickup-only
          fetch-depth: 0
      - name: Apply guarded public changes
        run: python scripts/apply-flat10-public-v3.py
      - name: Commit public hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(copy): separate takeaway from dormant delivery"
          git push origin HEAD:fix/legal-flat10-pickup-only
