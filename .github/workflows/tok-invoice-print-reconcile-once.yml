name: TOK invoice print index reconciliation one time
on:
  push:
    branches:
      - fix/tok-invoice-print-visible-20261014
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref_name == 'fix/tok-invoice-print-visible-20261014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Refresh indexes from the final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tok-invoice-print-reconcile-once.yml
          pnpm run docs:application-index
          pnpm run generate:error-code-map
          pnpm run docs:application-index:check
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts supabase/functions/_shared/error-code-map.ts
          git diff --cached --check
          git config user.name "TOK index bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): reconcile printable invoice indexes on current main"
          git push origin HEAD:fix/tok-invoice-print-visible-20261014
