name: One-time TOK Connect preview application-index sync
on:
  push:
    branches:
      - fix/tok-connect-preview-csp-20261028
permissions:
  contents: write
jobs:
  regenerate-index:
    if: github.repository == 'Mtnrconcept1/cloud-rebuild' && github.ref == 'refs/heads/fix/tok-connect-preview-csp-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Enable Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove one-time workflow and regenerate canonical TOK index
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/tok-connect-preview-index-sync-once-20261028.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add -- docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(tok-connect): regenerate index after CodeQL hardening'
          git push origin HEAD:refs/heads/fix/tok-connect-preview-csp-20261028
