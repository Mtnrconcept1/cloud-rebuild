name: Ensure Supabase Auth SMTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ensure-supabase-auth-smtp-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPABASE_PROJECT_REF: wwcrtyoueexyxkkikaos

jobs:
  configure:
    runs-on: [self-hosted, Linux, X64, cloud-rebuild-linux]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure and verify Resend SMTP for Supabase Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node ./scripts/ensure-supabase-auth-smtp.mjs
