name: Temporary TOK world index reconciliation
on:
  push:
    branches:
      - codex/tok-world-geo-hero-20261014
    paths:
      - .github/workflows/_tok-world-index-reconcile.yml
permissions:
  contents: write
  actions: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/tok-world-geo-hero-20261014
          fetch-depth: 10
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Regenerate from final staged Git tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TOK CI Assistant'
          git config user.email 'tok-ci-assistant@users.noreply.github.com'
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
          rm .github/workflows/_tok-world-index-reconcile.yml
          git add -u .github/workflows/_tok-world-index-reconcile.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git commit -m 'docs: sync TOK worldwide hero application index'
          git push origin HEAD:refs/heads/codex/tok-world-geo-hero-20261014
