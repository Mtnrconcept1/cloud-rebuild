name: Consent prefill validation bridge
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/consent-prefill-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/commercial-consent-prefill-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Restore exact reviewed source and verify integrity
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,re,subprocess,urllib.request
          files={'src/components/commercial/CommercialEmailConsentDialog.tsx':('d59e5cc2a95839676df48753a86da24a5faab308','7eeed5b7b3ec380184a1630a8123b429e5e34f199354a3f0f862ae262407b7a8'),'src/test/commercial-email-consent.test.tsx':('d1a17b8e234f33fffe4f8a0e9544caf1724f62ba','79411bfe10a73a358b122bee5d3b5ddad4cf38aa6abe07e1fa7baa9139928703')}
          for path,(before,after) in files.items():
            b=pathlib.Path(path).read_bytes()
            assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==before,path
          source=urllib.request.urlopen('https://raw.githubusercontent.com/Mtnrconcept1/cloud-rebuild/f2f2f4e96effaa1dea6d2e8b855d28076ad943a8/.github/workflows/consent-prefill-validation.yml',timeout=30).read().decode()
          encoded=re.search(r"b64decode\('([A-Za-z0-9+/=]+)'\)",source).group(1)
          # Correct a transport transcription; every resulting file is verified below.
          encoded=encoded.replace('TzJzJPHW4','TzJPHW4')
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for path,(before,after) in files.items():
            assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==after,path
          PY
      - name: Validate final sources and canonical references
        run: |
          git rm .github/workflows/consent-prefill-validation.yml
          corepack enable && corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
          node scripts/generate-application-index.mjs
          pnpm exec vitest run src/test/commercial-email-consent.test.tsx src/test/commercial-email-consent-contract.test.ts src/test/commercial-consent-confirmation.test.ts src/test/commercial-consent-page.test.ts src/test/email-provider-reconciliation.test.ts src/test/marketing-consent-dispatch.test.ts src/test/application-search-index.test.ts
          pnpm typecheck && pnpm lint && pnpm build
          node scripts/generate-application-index.mjs --check
          git diff --check
      - name: Package validated sources
        run: |
          mkdir -p "$RUNNER_TEMP/prefill"
          for f in src/components/commercial/CommercialEmailConsentDialog.tsx src/test/commercial-email-consent.test.tsx docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts; do
            mkdir -p "$RUNNER_TEMP/prefill/$(dirname "$f")"
            cp "$f" "$RUNNER_TEMP/prefill/$f"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consent-prefill-validated
          path: ${{ runner.temp }}/prefill/
          retention-days: 7
  publish-blobs:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: consent-prefill-validated
          path: validated
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Publish validated file objects only; never commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs'; import {createHash} from 'node:crypto';
          const paths=['src/components/commercial/CommercialEmailConsentDialog.tsx','src/test/commercial-email-consent.test.tsx','docs/architecture/TOK_APPLICATION_REFERENCE.md','docs/architecture/tok-application-search-index.json','src/data/tok-user-guide-catalog.generated.ts'];
          for(const path of paths){const b=readFileSync('validated/'+path); if(b.length>12000000)throw new Error('Invalid size');const expected=createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex'); const r=await fetch('https://api.github.com/repos/Mtnrconcept1/cloud-rebuild/git/blobs',{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,'Content-Type':'application/json',Accept:'application/vnd.github+json'},body:JSON.stringify({content:b.toString('base64'),encoding:'base64'})}); if(!r.ok)throw new Error('Object write failed '+r.status);const result=await r.json();if(result.sha!==expected)throw new Error('Integrity mismatch');console.log(JSON.stringify({path,sha:result.sha,size:b.length}));}
          JS
