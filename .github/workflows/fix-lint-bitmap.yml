name: Fix lint bitmap

on:
  push:
    paths:
      - .github/workflows/fix-lint-bitmap.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix prefer-const lint error
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/bzip2Decompress.ts')
          text = path.read_text()
          old = 'let bitmap'
          new = 'const bitmap'
          if old not in text:
              raise SystemExit('Expected declaration not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/bzip2Decompress.ts
          git commit -m "fix(lint): use const for bitmap"
          git push
