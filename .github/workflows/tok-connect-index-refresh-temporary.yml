name: TOK Connect final generated indexes refresh

on:
  push:
    branches:
      - fix/tok-connect-admin-pagination-20261013
    paths:
      - .github/workflows/tok-connect-index-refresh-temporary.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/tok-connect-admin-pagination-20261013
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate references without temporary workflow in the final tree
        run: |
          set -euo pipefail
          git rm .github/workflows/tok-connect-index-refresh-temporary.yml
          pnpm generate:error-code-map
          pnpm docs:application-index
          pnpm docs:application-index:check
          pnpm exec vitest run --mode production src/test/incident-evidence-depth.test.ts src/test/tok-connect-admin-pagination.test.ts
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json supabase/functions/_shared/error-code-map.ts
          git diff --cached --check

      - name: Commit refresh and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(tok-connect): regenerate references after main sync"
          git push origin HEAD:refs/heads/fix/tok-connect-admin-pagination-20261013
