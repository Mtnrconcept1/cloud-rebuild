name: Temporary TOK Email Index Synchronization PR 1010
on:
  push:
    branches:
      - fix/tok-mailing-da-editorial-posters-20261028
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove temporary workflow and regenerate official indexes
        shell: bash
        run: |
          set -euo pipefail
          # Respect simultaneous changes to this PR branch; never force-push.
          git fetch origin fix/tok-mailing-da-editorial-posters-20261028
          git checkout -B fix/tok-mailing-da-editorial-posters-20261028 FETCH_HEAD
          git rm -- .github/workflows/tok-email-index-1010-temp.yml
          pnpm docs:application-index
          pnpm generate:error-code-map
          pnpm docs:application-index:check
          git add -- docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts supabase/functions/_shared/error-code-map.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(marketing): synchronize canonical indexes for TOK email DA'
          git push origin HEAD:fix/tok-mailing-da-editorial-posters-20261028
