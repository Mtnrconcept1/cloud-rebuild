name: Normalize TOK Brand Assets

on:
  push:
    branches:
      - fix/unify-logotok-appstore-build6
    paths:
      - scripts/.normalize-logotok-brand-build6

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Replace remaining legacy TOK brand references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("supabase/functions/_shared/transactional-emails.ts"): {
                  '"/logo.png"': '"/logotok.png"',
                  '"/tok.png"': '"/logotok.png"',
              },
              Path("src/test/transactional-email-templates.test.ts"): {
                  'logo.png': 'logotok.png',
                  'tok.png': 'logotok.png',
              },
              Path("src/test/public-asset-deduplication.test.ts"): {
                  'publicFile("logo.png")': 'publicFile("logotok.png")',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in mapping.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY

      - name: Remove unreferenced legacy TOK brand files
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d public/event-logos ]] && ! git grep -Fq '/event-logos/' -- ':!public/event-logos/**'; then
            git rm -r public/event-logos
          fi

          for asset in \
            logo.png logo2.png logo3.png logo35.png logo37.png logo3df.png logo4.png logo5.png \
            logo-watermark.png tok.png; do
            path="public/$asset"
            [[ -e "$path" ]] || continue
            if ! git grep -Fq "$asset" -- ':!public/**'; then
              git rm "$path"
            fi
          done

      - name: Commit normalized brand assets
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No additional legacy TOK brand references remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(brand): remove remaining legacy TOK logo sources"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
