name: PR642 apply gallery and print fix

on:
  push:
    branches:
      - fix/ai-gallery-print-media-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ai-gallery-print-media-20260907
          fetch-depth: 1
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply gallery and print patch
        run: python scripts/pr642_apply_media_fix.py
      - name: Regenerate error code map
        run: pnpm run generate:error-code-map
      - name: Verify focused regression suite
        run: pnpm exec vitest run --mode production src/test/ai-gallery-print-media-contract.test.ts src/test/tok-ai-tools.test.ts src/test/photo-studio-persistence.test.ts src/test/ai-image-reference-security.test.ts src/test/incident-evidence-depth.test.ts src/test/marketing-print*.test.ts
      - name: Remove temporary patch files
        run: rm .github/workflows/pr642-apply-media-fix.yml scripts/pr642_apply_media_fix.py
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): route gallery media through governed storage"
          git push origin HEAD:fix/ai-gallery-print-media-20260907
