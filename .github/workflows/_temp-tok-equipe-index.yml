name: TOK Equipe temporary index regeneration
on:
  push:
    branches:
      - feat/tok-equipe-swisstime-20261028
    paths:
      - '.github/workflows/_temp-tok-equipe-index.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/feat/tok-equipe-swisstime-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tok-equipe-swisstime-20261028
          fetch-depth: 0
          persist-credentials: true
      - name: Node and pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove temporary workflow and regenerate index
        run: |
          set -euo pipefail
          git rm .github/workflows/_temp-tok-equipe-index.yml
          pnpm docs:application-index
          pnpm docs:application-index:check
          git diff --check
      - name: Commit generated references
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json src/data/tok-user-guide-catalog.generated.ts
          git diff --cached --check
          git commit -m "chore(equipe): régénérer les catalogues après correction Zod"
          git push origin HEAD:feat/tok-equipe-swisstime-20261028
