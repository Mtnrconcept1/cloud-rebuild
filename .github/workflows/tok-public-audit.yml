name: TOK public route audit (one-off)
'on':
  push:
    branches: ['audit/tok-full-20261003']
    paths: ['.github/workflows/tok-public-audit.yml']
permissions:
  contents: read
jobs:
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 68852d10feab466430e0f70f5e5b6ebfee414a59
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - name: Prepare isolated metadata folder and GET-only route inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tok-public-audit"
          python3 - <<'PY'
          import pathlib,re,urllib.request,urllib.error,json,concurrent.futures,time,os,collections
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'tok-public-audit'
          source=pathlib.Path('src/App.tsx').read_text()
          paths=sorted(set(p for p in re.findall(r'<Route\s+path="([^"]+)"',source) if ':' not in p and '*' not in p))
          urls=['https://www.thetok.ch'+p for p in paths]+['https://www.thetok.ch/robots.txt','https://www.thetok.ch/sitemap.xml','https://www.thetok.ch/tok-audit-nonexistent-20261003','https://admin.thetok.ch/admin','https://admin.thetok.ch/marketing/login','https://marketing.thetok.ch/marketing/login']
          def check(url):
              start=time.monotonic()
              request=urllib.request.Request(url,headers={'User-Agent':'TOK-authorized-read-only-audit/1.0','Accept':'text/html,application/xml;q=0.9'})
              try:
                  try: response=urllib.request.urlopen(request,timeout=15)
                  except urllib.error.HTTPError as error: response=error
                  with response:
                      body=response.read(2000000).decode('utf8','replace')
                      record={'url':url,'status':response.status,'final_url':response.url,'seconds':round(time.monotonic()-start,3),'headers':{k.lower():v for k,v in response.headers.items() if k.lower() in ['content-type','content-security-policy','permissions-policy','x-frame-options','strict-transport-security','cache-control','x-robots-tag','x-vercel-cache']},'title':re.findall(r'<title[^>]*>(.*?)</title>',body,re.S)[:1],'canonical':re.findall(r'<link[^>]+rel=[\"\x27]canonical[\"\x27][^>]+href=[\"\x27]([^\"\x27]+)',body)[:2],'h1_count':len(re.findall(r'<h1\b',body)),'bytes_read':len(body.encode()),'prerendered':'data-seo-prerender' in body}
                      if url.endswith(('/robots.txt','/sitemap.xml')):record['document']=body[:100000]
                      return record
              except Exception as error:return {'url':url,'error':str(error),'seconds':round(time.monotonic()-start,3)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: results=list(pool.map(check,urls))
          (out/'route-http.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print('GET route status summary',dict(collections.Counter(r.get('status','error') for r in results)))
          print('Non-200:',[(r['url'],r.get('status'),r.get('error')) for r in results if r.get('status')!=200])
          PY
      - name: Install pinned browser client without lifecycle scripts
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Observe unauthenticated navigation; block mutation requests
        shell: bash
        run: |
          set -euo pipefail
          cat > audit-public-browser.mjs <<'JS'
          import puppeteer from 'puppeteer';
          import { writeFile } from 'node:fs/promises';
          const out=process.env.RUNNER_TEMP+'/tok-public-audit';
          const executablePath=process.env.CHROME_PATH || '/usr/bin/google-chrome';
          const browser=await puppeteer.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const targets=['https://www.thetok.ch/','https://www.thetok.ch/recherche','https://www.thetok.ch/auth','https://www.thetok.ch/parametres/securite','https://www.thetok.ch/tok-connect/mcp-widget','https://www.thetok.ch/dashboard','https://admin.thetok.ch/admin','https://admin.thetok.ch/marketing/login'];
          const results=[];
          try {
            for(let i=0;i<targets.length;i++) {
              const context=await browser.createBrowserContext();const page=await context.newPage();
              await page.setViewport({width:390,height:844,deviceScaleFactor:1});
              const errors=[],failures=[],blocked=[];
              await page.setRequestInterception(true);
              page.on('request',r=>{const u=new URL(r.url());const readRpc=/\/rest\/v1\/rpc\/(search_restaurants_catalog_page|search_restaurants_catalog|get_social_feed_premium_banners|get_total_donated_points|get_total_donated_meals|resolve_google_booking_slug)$/.test(u.pathname);if(!['GET','HEAD','OPTIONS'].includes(r.method())&&!readRpc){blocked.push({method:r.method(),host:u.host,path:u.pathname});void r.abort();}else void r.continue();});
              page.on('pageerror',e=>errors.push(e.message.slice(0,500)));
              page.on('response',r=>{if(r.status()>=400){const u=new URL(r.url());failures.push({status:r.status(),host:u.host,path:u.pathname});}});
              const result={url:targets[i],errors,failures,blocked};
              try {const response=await page.goto(targets[i],{waitUntil:'networkidle2',timeout:25000});await new Promise(r=>setTimeout(r,1200));result.status=response?.status();result.final_url=page.url();result.title=await page.title();result.headings=await page.$$eval('h1,h2',els=>els.slice(0,12).map(x=>x.textContent?.trim()));result.body_excerpt=await page.$eval('body',b=>b.innerText.slice(0,900));result.password_inputs=await page.$$eval('input[type=password]',els=>els.length);result.horizontal_overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2);if(i===0||i===4||i===6)await page.screenshot({path:out+'/route-'+i+'.png',fullPage:false});}catch(e){result.error=String(e).slice(0,500);}
              results.push(result);await context.close();
            }
          }finally {await browser.close();await writeFile(out+'/browser-public.json',JSON.stringify(results,null,2));}
          console.log(JSON.stringify(results.map(r=>({url:r.url,status:r.status,final_url:r.final_url,errors:r.errors.length,failures:r.failures.length,blocked:r.blocked.length,error:r.error}))));
          JS
          node audit-public-browser.mjs
      - name: Preserve non-sensitive observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tok-public-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/tok-public-audit/
          retention-days: 3
          if-no-files-found: error
