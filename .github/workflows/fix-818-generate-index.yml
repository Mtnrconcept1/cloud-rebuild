name: Temporary PR 818 application index regeneration
on:
  push:
    branches:
      - fix/chunk-load-recovery-20261013
    paths:
      - .github/workflows/fix-818-generate-index.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned pnpm dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
      - name: Generate tracked index outputs using repository generator
        run: pnpm docs:application-index
      - name: Commit only the three generated artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          if git diff --cached --quiet; then
            echo 'Generated files already current.'
          else
            git commit -m 'docs: regenerate application index for chunk recovery [skip ci]'
            git push origin HEAD:fix/chunk-load-recovery-20261013
          fi
