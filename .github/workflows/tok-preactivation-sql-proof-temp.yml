name: TOK preactivation disposable PostgreSQL integration

on:
  push:
    branches:
      - feat/restaurant-preactivation-weekly-ai-credits-20261014
    paths:
      - .github/workflows/tok-preactivation-sql-proof-temp.yml

permissions:
  contents: write

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tok_credit_ci
          POSTGRES_DB: tok_credit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: tok_credit_ci
      PGUSER: postgres
      PGPASSWORD: tok_credit_ci
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/restaurant-preactivation-weekly-ai-credits-20261014
          persist-credentials: true
      - name: Remove one-time workflow before computing canonical indexes
        run: git rm -- .github/workflows/tok-preactivation-sql-proof-temp.yml
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Apply fixture and exact pending migration to disposable PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/restaurant_preactivation_credit_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261014110000_restaurant_preactivation_weekly_ai_credits.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/restaurant_preactivation_credit_integration.sql
      - name: Enforce 15-credit cap with concurrent SQL sessions
        shell: bash
        run: |
          set -euo pipefail
          ONE="00000000-0000-4000-8000-000000000006"
          (psql -v ON_ERROR_STOP=1 -c "BEGIN; INSERT INTO public.ai_usage_logs(restaurant_id,status,metadata) VALUES ('$ONE','success','{\"credit_units\":10}'); SELECT pg_sleep(2); COMMIT;" > /tmp/first.log 2>&1) &
          p1=$!
          sleep 0.25
          (psql -v ON_ERROR_STOP=1 -c "BEGIN; INSERT INTO public.ai_usage_logs(restaurant_id,status,metadata) VALUES ('$ONE','success','{\"credit_units\":10}'); COMMIT;" > /tmp/second.log 2>&1) &
          p2=$!
          set +e
          wait "$p1"; r1=$?
          wait "$p2"; r2=$?
          set -e
          cat /tmp/first.log
          cat /tmp/second.log
          if ! { [[ "$r1" -eq 0 && "$r2" -ne 0 ]] || [[ "$r2" -eq 0 && "$r1" -ne 0 ]]; }; then
            echo "::error::Concurrency test requires exactly one accepted 10-credit transaction"
            exit 1
          fi
          used=$(psql -tA -c "SELECT COALESCE(sum((metadata->>'credit_units')::numeric),0) FROM public.ai_usage_logs WHERE restaurant_id='$ONE' AND status='success'")
          balance=$(psql -tA -c "SELECT (get_restaurant_credit_usage('$ONE'::uuid)->'credits'->0->>'balance')::numeric")
          echo "Concurrent usage=$used balance=$balance"
          [[ "$used" == "10" && "$balance" == "5" ]]
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate index and validate
        run: |
          pnpm docs:application-index
          pnpm docs:application-index:check
      - name: Targeted regression tests
        run: pnpm exec vitest run --mode production src/test/restaurant-preactivation-ai-credits.test.ts src/test/tok-ai-tools.test.ts src/test/restaurant-billing-account.test.ts src/test/application-search-index.test.ts
      - name: Lint and types
        run: |
          pnpm lint
          pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Commit generated references and delete temporary workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          if ! git diff --cached --quiet; then
            git commit -m "test(db): publish disposable Postgres SQL credit verification and refresh index"
            git push origin HEAD:refs/heads/feat/restaurant-preactivation-weekly-ai-credits-20261014
          fi
