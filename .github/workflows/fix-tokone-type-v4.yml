name: Fix Tok One benefit type guard

on:
  push:
    branches: [fix/legal-flat10-pickup-only]
    paths: [.github/workflows/fix-tokone-type-v4.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/legal-flat10-pickup-only
      - name: Remove obsolete free-delivery comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/TokOne.tsx')
          text = p.read_text(encoding='utf-8')
          old = '.filter((benefit) => benefit.enabled && benefit.id !== "free_delivery")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one obsolete filter, got {text.count(old)}')
          p.write_text(text.replace(old, '.filter((benefit) => benefit.enabled)', 1), encoding='utf-8')
          Path('.github/workflows/fix-tokone-type-v4.yml').unlink()
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(tok-one): remove obsolete delivery benefit type guard"
          git push origin HEAD:fix/legal-flat10-pickup-only
