name: PR642 fix print types

on:
  push:
    branches:
      - fix/ai-gallery-print-media-20260907

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ai-gallery-print-media-20260907
          fetch-depth: 1
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply print type fix
        run: python scripts/pr642_fix_print_types.py
      - name: Verify typecheck and focused regressions
        run: |
          pnpm run typecheck
          pnpm exec vitest run --mode production src/test/ai-gallery-print-media-contract.test.ts src/test/marketing-print*.test.ts src/test/photo-studio-persistence.test.ts
      - name: Remove temporary patch files
        run: rm .github/workflows/pr642-fix-print-types.yml scripts/pr642_fix_print_types.py
      - name: Validate diff
        run: git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(print): type persisted AI asset discovery"
          git push origin HEAD:fix/ai-gallery-print-media-20260907
