name: Apply production Supabase credential hotfix

on:
  push:
    branches:
      - fix/marketing-bff-supabase-credential
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  patch:
    if: ${{ github.event_name == 'push' || github.head_ref == 'fix/marketing-bff-supabase-credential' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v6
        with:
          ref: fix/marketing-bff-supabase-credential
          fetch-depth: 1

      - name: Apply reviewed workflow patch
        run: node ./scripts/apply-production-supabase-credential-hotfix.mjs

      - name: Validate generated workflow diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- .github/workflows/deploy-production.yml
          git diff --exit-code --quiet -- .github/workflows/deploy-production.yml && {
            echo "::error::The workflow patch produced no change."
            exit 1
          }

      - name: Upload patched production workflow
        uses: actions/upload-artifact@v4
        with:
          name: patched-production-workflow-${{ github.run_id }}
          path: .github/workflows/deploy-production.yml
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
