name: Apply production Supabase credential hotfix

on:
  push:
    branches:
      - fix/marketing-bff-supabase-credential
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/marketing-bff-supabase-credential') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v6
        with:
          ref: fix/marketing-bff-supabase-credential
          fetch-depth: 1

      - name: Apply reviewed workflow patch
        run: node ./scripts/apply-production-supabase-credential-hotfix.mjs

      - name: Remove one-shot patch machinery
        run: |
          rm -f -- \
            .github/workflows/apply-production-supabase-credential-hotfix.yml \
            scripts/apply-production-supabase-credential-hotfix.mjs

      - name: Commit patched production workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/deploy-production.yml \
            .github/workflows/apply-production-supabase-credential-hotfix.yml \
            scripts/apply-production-supabase-credential-hotfix.mjs
          git diff --cached --check
          git commit -m "fix(deploy): resolve Supabase server key at runtime"
          git push origin HEAD:fix/marketing-bff-supabase-credential
