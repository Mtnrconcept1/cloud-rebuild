name: Bootstrap production Supabase credential

on:
  push:
    branches:
      - fix/marketing-bff-supabase-credential
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bootstrap:
    if: ${{ github.event_name == 'push' || github.head_ref == 'fix/marketing-bff-supabase-credential' }}
    runs-on: ubuntu-latest
    environment: production

    env:
      TARGET_PRODUCTION_SHA: 045b4db1f73741ddbf8338468c29a6ecdf9a678a
      SUPABASE_PROJECT_REF: wwcrtyoueexyxkkikaos
      GH_TOKEN: ${{ secrets.TOK_GITHUB_INCIDENT_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Assert protected credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || (echo "::error::Missing TOK_GITHUB_INCIDENT_TOKEN." && exit 1)
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::Missing SUPABASE_ACCESS_TOKEN." && exit 1)

      - name: Resolve and provision the server-only Supabase credential
        shell: bash
        run: |
          set -euo pipefail
          keys_file="$(mktemp)"
          secret_file="$(mktemp)"
          trap 'rm -f -- "$keys_file" "$secret_file"' EXIT

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/api-keys?reveal=true" \
            --output "$keys_file"
          chmod 600 "$keys_file"

          KEYS_FILE="$keys_file" node --input-type=module > "$secret_file" <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync(process.env.KEYS_FILE, "utf8"));
          const keys = Array.isArray(payload) ? payload : payload.keys;
          if (!Array.isArray(keys)) throw new Error("Invalid Supabase API key response.");
          const active = keys.filter((key) => key && key.disabled !== true && typeof key.api_key === "string" && key.api_key);
          const selected = active.find((key) => key.name === "service_role")
            || active.find((key) => key.type === "secret");
          if (!selected) throw new Error("No active server-only Supabase key was returned.");
          process.stdout.write(selected.api_key);
          NODE

          test -s "$secret_file" || (echo "::error::Supabase returned an empty server-only credential." && exit 1)
          service_key="$(cat "$secret_file")"
          echo "::add-mask::$service_key"
          gh secret set SUPABASE_SERVICE_ROLE_KEY \
            --repo "$GITHUB_REPOSITORY" \
            --body "$service_key"

      - name: Re-run the failed production deployment
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Deploy Production" \
              --branch main \
              --limit 30 \
              --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"${TARGET_PRODUCTION_SHA}\") | .databaseId" \
              | head -n 1
          )"
          test -n "$run_id" || (echo "::error::Unable to find the failed production run for ${TARGET_PRODUCTION_SHA}." && exit 1)
          gh run rerun "$run_id" --failed --repo "$GITHUB_REPOSITORY"
          echo "Re-run requested for production workflow $run_id."
