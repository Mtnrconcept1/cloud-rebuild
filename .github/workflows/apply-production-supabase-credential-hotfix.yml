name: Complete PR510 production deployment

on:
  push:
    branches:
      - fix/marketing-bff-supabase-credential
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr510-emergency-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/marketing-bff-supabase-credential' }}
    runs-on: ubuntu-latest
    environment: production

    env:
      NODE_VERSION: 22
      PNPM_VERSION: 10.28.1
      VERCEL_CLI_VERSION: 55.0.0
      TARGET_PRODUCTION_SHA: 045b4db1f73741ddbf8338468c29a6ecdf9a678a
      SUPABASE_PROJECT_REF: wwcrtyoueexyxkkikaos
      PRODUCTION_SUPABASE_URL: https://wwcrtyoueexyxkkikaos.supabase.co
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Assert production targets and protected credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$VERCEL_ORG_ID" = "team_FvFPXdOD5Vw9DAQS5grAuJAv" || (echo "::error::Unexpected Vercel team." && exit 1)
          test "$VERCEL_PROJECT_ID" = "prj_v4X2Bhefbcf12CVIanrvS62q9Vy6" || (echo "::error::Unexpected Vercel project." && exit 1)
          test -n "$VERCEL_TOKEN" || (echo "::error::Missing VERCEL_TOKEN." && exit 1)
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::Missing SUPABASE_ACCESS_TOKEN." && exit 1)

      - name: Resolve production Supabase runtime keys
        shell: bash
        run: |
          set -euo pipefail
          keys_file="$(mktemp)"
          env_file="$(mktemp)"
          trap 'rm -f -- "$keys_file" "$env_file"' EXIT

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/api-keys?reveal=true" \
            --output "$keys_file"
          chmod 600 "$keys_file"

          KEYS_FILE="$keys_file" node --input-type=module > "$env_file" <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync(process.env.KEYS_FILE, "utf8"));
          const keys = Array.isArray(payload) ? payload : payload.keys;
          if (!Array.isArray(keys)) throw new Error("Invalid Supabase API key response.");
          const active = keys.filter((key) => key && key.disabled !== true && typeof key.api_key === "string" && key.api_key);
          const publishable = active.find((key) => key.type === "publishable")
            || active.find((key) => key.name === "anon");
          const service = active.find((key) => key.name === "service_role")
            || active.find((key) => key.type === "secret");
          if (!publishable || !service) throw new Error("Required Supabase runtime keys were not returned.");
          for (const [name, value] of [
            ["SUPABASE_PUBLISHABLE_KEY", publishable.api_key],
            ["SUPABASE_SERVICE_ROLE_KEY", service.api_key],
          ]) {
            if (!/^[A-Za-z0-9._-]+$/.test(value)) throw new Error(`${name} contains unsupported characters.`);
            console.log(`${name}=${value}`);
          }
          NODE

          while IFS='=' read -r name value; do
            test -n "$name" && test -n "$value"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < "$env_file"

      - name: Checkout merged PR510 commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_PRODUCTION_SHA }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Store marketing BFF runtime variables in Vercel
        shell: bash
        run: |
          set -euo pipefail

          upsert_vercel_env() {
            local key="$1"
            local value="$2"
            local add_mode="${3:-encrypted}"

            if printf '%s\n' "$value" \
              | pnpm dlx "vercel@${VERCEL_CLI_VERSION}" env update "$key" production --yes --token="$VERCEL_TOKEN"; then
              echo "Updated Vercel production variable: $key"
              return 0
            fi

            if [[ "$add_mode" == "sensitive" ]]; then
              printf '%s\n' "$value" \
                | pnpm dlx "vercel@${VERCEL_CLI_VERSION}" env add "$key" production --sensitive --token="$VERCEL_TOKEN"
            else
              printf '%s\n' "$value" \
                | pnpm dlx "vercel@${VERCEL_CLI_VERSION}" env add "$key" production --token="$VERCEL_TOKEN"
            fi
            echo "Created Vercel production variable: $key"
          }

          upsert_vercel_env SUPABASE_URL "$PRODUCTION_SUPABASE_URL"
          upsert_vercel_env SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY"
          upsert_vercel_env SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY" sensitive

      - name: Write production frontend environment
        run: node ./scripts/write-production-env.mjs --out=.env.production
        env:
          GITHUB_SHA: ${{ env.TARGET_PRODUCTION_SHA }}
          VITE_SUPABASE_PROJECT_ID: wwcrtyoueexyxkkikaos
          VITE_SUPABASE_URL: https://wwcrtyoueexyxkkikaos.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY || secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Pull Vercel production settings
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production output
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy PR510 to Vercel production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_output="$(
            pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy \
              --prebuilt \
              --prod \
              --token="$VERCEL_TOKEN" \
              --meta githubCommitSha="$TARGET_PRODUCTION_SHA"
          )"
          deployment_url="$(printf '%s\n' "$deployment_output" | tail -n 1 | tr -d '\r')"
          test -n "$deployment_url" || (echo "::error::Vercel did not return a deployment URL." && exit 1)
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $deployment_url"

      - name: Attach marketing.thetok.ch non-destructively
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f -- "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains/marketing.thetok.ch?teamId=${VERCEL_ORG_ID}")"
          if [[ "$status" == "404" ]]; then
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"name":"marketing.thetok.ch"}' \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}")"
          fi
          [[ "$status" == "200" || "$status" == "201" ]] || {
            cat "$response_file"
            echo "::error::Unable to attach marketing.thetok.ch (HTTP $status)."
            exit 1
          }

      - name: Smoke-test deployed marketing BFF
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f -- "$headers_file" "$body_file"' EXIT
          origin="${DEPLOYMENT_URL%/}"
          status="$(curl --silent --show-error --location \
            --output "$body_file" --dump-header "$headers_file" --write-out '%{http_code}' \
            "$origin/marketing")"
          [[ "$status" == "200" ]] || (echo "::error::Marketing UI returned HTTP $status." && exit 1)
          session_status="$(curl --silent --show-error \
            --output "$body_file" --dump-header "$headers_file" --write-out '%{http_code}' \
            "$origin/api/marketing/session")"
          [[ "$session_status" == "401" ]] || (echo "::error::Anonymous marketing session endpoint returned HTTP $session_status instead of 401." && exit 1)
          grep -Eiq '^cache-control:.*no-store' "$headers_file" || (echo "::error::Marketing BFF response is cacheable." && exit 1)
