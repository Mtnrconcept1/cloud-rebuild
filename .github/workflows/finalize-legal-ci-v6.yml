name: Finalize legal CI alignment

on:
  push:
    branches:
      - fix/legal-flat10-pickup-only
    paths:
      - ".github/workflows/finalize-legal-ci-v6.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/legal-flat10-pickup-only
          fetch-depth: 0

      - name: Apply guarded corrections
        run: python .github/scripts/finalize_legal_ci_v6.py

      - name: Commit corrections
        run: |
          git rm .github/workflows/finalize-legal-ci-v6.yml .github/scripts/finalize_legal_ci_v6.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(legal): complete public privacy boundary and align validation"
          git push origin HEAD:fix/legal-flat10-pickup-only
