name: Validate TOK Printer changes (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tok-printer-quality-bootstrap.yml"

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event.pull_request.number == 835 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/admin-tok-printer-page-20261014' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove temporary workflow before source-index validation
        run: git rm -- .github/workflows/tok-printer-quality-bootstrap.yml
      - name: Check canonical documentation
        run: pnpm run docs:application-index:check
      - name: Run related tests
        run: pnpm exec vitest run --mode production src/test/application-search-index.test.ts src/test/route-wiring.test.ts src/test/marketing-print-contract.test.ts src/test/admin-mobile-navigation.test.tsx src/test/print-catalog-admin-pagination.test.tsx
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build production
        run: pnpm run build:prod
      - name: Restore clean branch without temporary workflow
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .github/workflows/tok-printer-quality-bootstrap.yml >/dev/null 2>&1; then
            git rm -- .github/workflows/tok-printer-quality-bootstrap.yml
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m "chore(ci): remove temporary TOK Printer validation workflow"
          git push origin HEAD:refs/heads/feat/admin-tok-printer-page-20261014
