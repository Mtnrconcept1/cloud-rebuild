name: Temporary TOK ready list index sync
on:
  push:
    branches:
      - codex/tok-list-controls-ready-20261021

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/codex/tok-list-controls-ready-20261021'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate reference on current main and self-remove
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-ready-list-index-sync.yml
          pnpm docs:application-index
          git add docs/architecture/tok-application-search-index.json docs/architecture/TOK_APPLICATION_REFERENCE.md src/data/tok-user-guide-catalog.generated.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(index): sync current marketing review and list controls"
          git push origin HEAD:codex/tok-list-controls-ready-20261021
