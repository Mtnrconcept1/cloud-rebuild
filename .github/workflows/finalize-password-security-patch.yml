name: Finalize password security patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/password-recovery-and-account-security' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/password-recovery-and-account-security
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply reviewed patch
        run: |
          sed -i 's/if role_switch_count < 2:/if role_switch_count < 1:/' scripts/apply-password-recovery-and-account-security.py
          python scripts/apply-password-recovery-and-account-security.py

      - name: Validate targeted behavior
        run: |
          pnpm exec vitest run src/test/auth-password-recovery.test.ts src/test/password-recovery-routing.test.ts
          pnpm run typecheck
          pnpm run lint

      - name: Commit reviewed result
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-password-recovery-and-account-security.yml \
            .github/workflows/apply-password-security-on-pr.yml \
            .github/workflows/retry-password-security-patch.yml \
            .github/workflows/finalize-password-security-patch.yml \
            scripts/apply-password-recovery-and-account-security.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(auth): route recovery links to password reset [password-security-applied]"
          git push origin HEAD:fix/password-recovery-and-account-security
