name: One-time actualités SEO index regeneration

on:
  push:
    branches:
      - fix/seo-actualites-launch-closed-20261013
    paths:
      - .github/workflows/_seo-actualites-index-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/seo-actualites-launch-closed-20261013
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install packages
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
      - name: Drop one-time workflow
        run: git rm .github/workflows/_seo-actualites-index-once.yml
      - name: Update derived references
        run: |
          pnpm generate:error-code-map
          pnpm docs:application-index
          pnpm docs:application-index:check
      - name: Run focused SEO contracts
        run: pnpm exec vitest run --mode production src/test/actualites-search-seo.test.ts src/test/application-search-index.test.ts src/test/seo-indexation-hardening.test.ts
      - name: Commit references to feature branch
        run: |
          git config user.name "tok-ci-bot"
          git config user.email "tok-ci-bot@users.noreply.github.com"
          git add docs/architecture/TOK_APPLICATION_REFERENCE.md docs/architecture/tok-application-search-index.json supabase/functions/_shared/error-code-map.ts
          git commit -m "docs(index): synchronize launch-protected actualités prerender"
          git push origin HEAD:fix/seo-actualites-launch-closed-20261013
