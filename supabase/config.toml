# -----------------------------------------------------------------------------
# Edge function auth policy.
#
# User-authenticated functions keep Supabase gateway JWT verification enabled so
# unauthenticated requests are rejected before the handler runs. Webhooks, cron
# jobs, service-to-service dispatchers, and intentionally public collectors keep
# `verify_jwt = false` and must validate their own signature or secret inside the
# handler.
# -----------------------------------------------------------------------------

