# -----------------------------------------------------------------------------
# Edge function auth policy.
#
# Supabase gateway JWT verification is disabled consistently so handlers can
# validate current Supabase JWT algorithms themselves. User-authenticated
# functions must call authenticateRequest/getUser inside the handler. Webhooks,
# cron jobs, service-to-service dispatchers, and intentionally public collectors
# must validate their signature, shared secret, captcha, or rate-limit gate
# before side effects.
# -----------------------------------------------------------------------------

