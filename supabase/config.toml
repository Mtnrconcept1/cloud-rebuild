# -----------------------------------------------------------------------------
# Edge function auth policy.
#
# Supabase documents that platform-level `verify_jwt` is incompatible with the
# new JWT Signing Keys flow. This project now validates Authorization headers in
# the handler itself (`authenticateRequest`, `auth.getUser()`, scheduler secret,
# Stripe webhook signature, etc.), so every function below explicitly opts out
# of the legacy gateway JWT verification layer.
# -----------------------------------------------------------------------------

[functions.ai-admin-support]
verify_jwt = false

